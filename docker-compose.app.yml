services:
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    env_file:
      - /opt/connectcomms/env/.env.platform
      # VitalPBX panel robot login for the automated onboarding tenant build
      # (CONNECT_BASE_URL / CONNECT_ROBOT_USER / CONNECT_ROBOT_PASS). Optional:
      # hosts without the file simply run onboarding in dry-run mode.
      - path: /etc/connect-robot/credentials.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
      # ── Automated onboarding (owner-mandated 2026-07-26) ────────────────────
      # "on" = wizard submissions really buy the VoIP.ms number/subaccount and
      # build the VitalPBX tenant. Set to anything else to fall back to
      # fully-logged dry runs.
      VOIPMS_AUTO_PROVISION: ${VOIPMS_AUTO_PROVISION:-on}
      ONBOARDING_PBX_AUTO_SETUP: ${ONBOARDING_PBX_AUTO_SETUP:-on}
      # Production must send real provider traffic. The platform env historically
      # carried SMS_PROVIDER_TEST_MODE=true for early smoke tests; override it here
      # unless the host shell explicitly opts back into test mode for a dry run.
      SMS_PROVIDER_TEST_MODE: ${SMS_PROVIDER_TEST_MODE:-false}
      SIMULATE_NUMBER_PROVIDER: ${SIMULATE_NUMBER_PROVIDER:-false}
      SOLA_CARDKNOX_SIMULATE: ${SOLA_CARDKNOX_SIMULATE:-false}
      SOLA_CARDKNOX_MODE: ${SOLA_CARDKNOX_MODE:-sandbox}
      SOLA_CARDKNOX_API_BASE_URL: ${SOLA_CARDKNOX_API_BASE_URL:-}
      SOLA_CARDKNOX_API_KEY: ${SOLA_CARDKNOX_API_KEY:-}
      SOLA_CARDKNOX_API_SECRET: ${SOLA_CARDKNOX_API_SECRET:-}
      SOLA_CARDKNOX_WEBHOOK_SECRET: ${SOLA_CARDKNOX_WEBHOOK_SECRET:-}
      PBX_SIMULATE: ${PBX_SIMULATE:-false}
      PBX_BASE_URL: ${PBX_BASE_URL:-}
      PBX_API_TOKEN: ${PBX_API_TOKEN:-}
      PBX_API_SECRET: ${PBX_API_SECRET:-}
      PBX_TIMEOUT_MS: ${PBX_TIMEOUT_MS:-10000}
      # IANA timezone for "today" KPI. Defaults to America/New_York; override via .env.platform or host shell.
      PBX_TIMEZONE: ${PBX_TIMEZONE:-America/New_York}
      # Confirmed WSS endpoint on this PBX build. Override in .env.platform if different.
      PBX_WS_ENDPOINT: ${PBX_WS_ENDPOINT:-wss://209.145.60.79:8089/ws}
      # STUN server — used as fallback ICE when tenant has no custom ICE servers
      STUN_SERVER: ${STUN_SERVER:-stun:stun.l.google.com:19302}
      # TURN server — set in .env.platform for production audio behind strict NAT
      # TURN_AUTH_SECRET enables HMAC time-limited credentials (use-auth-secret mode, recommended).
      # If set, TURN_USERNAME and TURN_PASSWORD are ignored.
      TURN_SERVER: ${TURN_SERVER:-}
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      # Internal URL for /voice/webrtc/health to fetch AMI/ARI status from telephony service
      TELEPHONY_INTERNAL_URL: ${TELEPHONY_INTERNAL_URL:-http://telephony:3003}
      PBX_WEBHOOK_VERIFY_MODE: ${PBX_WEBHOOK_VERIFY_MODE:-token}
      PBX_WEBHOOK_TOKEN: ${PBX_WEBHOOK_TOKEN:-}
      PBX_WEBHOOK_SIGNATURE_SECRET: ${PBX_WEBHOOK_SIGNATURE_SECRET:-}
      PBX_WEBHOOK_ALLOWED_IPS: ${PBX_WEBHOOK_ALLOWED_IPS:-}
      PBX_WEBHOOK_REGISTER_PATH: ${PBX_WEBHOOK_REGISTER_PATH:-}
      PBX_WEBHOOK_LIST_PATH: ${PBX_WEBHOOK_LIST_PATH:-}
      PBX_WEBHOOK_DELETE_PATH: ${PBX_WEBHOOK_DELETE_PATH:-}
      PBX_ACTIVE_CALLS_PATH: ${PBX_ACTIVE_CALLS_PATH:-}
      PBX_SUPPORTS_WEBHOOKS: ${PBX_SUPPORTS_WEBHOOKS:-false}
      PBX_SUPPORTS_ACTIVE_CALL_POLLING: ${PBX_SUPPORTS_ACTIVE_CALL_POLLING:-false}
      PBX_WEBHOOK_EVENT_TYPES: ${PBX_WEBHOOK_EVENT_TYPES:-}
      EXPO_PUSH_ACCESS_TOKEN: ${EXPO_PUSH_ACCESS_TOKEN:-}
      # Firebase direct-FCM call wakes: the service-account JSON is exposed to the
      # container via the /opt/connectcomms → /host-inventory mount below. Point the
      # sender at it so call-critical Android wakes go direct (Doze-exempt) instead of
      # silently falling back to the Expo relay. Missing file/path = Expo fallback.
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-/host-inventory/opt/connectcomms/env/firebase-service-account.json}
      MOBILE_PUSH_SIMULATE: ${MOBILE_PUSH_SIMULATE:-false}
      VOICE_SIMULATE: ${VOICE_SIMULATE:-false}
      # CDR_INGEST_SECRET IS DELIBERATELY *NOT* LISTED HERE.
      # It comes from env_file (/opt/connectcomms/env/.env.platform).
      # `environment:` WINS OVER `env_file:`, so the old line
      #     CDR_INGEST_SECRET: ${CDR_INGEST_SECRET:-}
      # substituted the DEPLOY SHELL's value - and the deploy scripts source
      # only .env.deploy-queue, never .env.platform. The result was an
      # EMPTY string in api and telephony (proven live: defined=true len=0)
      # that silently overrode the file, which is exactly why every
      # /internal/* door ran unauthenticated for the life of the platform.
      # Same trap the telephony block already warns about for JWT_SECRET /
      # AMI_PASSWORD. Do not re-add it. See
      # docs/ai-context/AGENT_HANDOFF_TENANT_ISOLATION_AUDIT_2026-08-17.md
      # ── MOH asset storage + PBX sync ───────────────────────────────────────
      # Volume-backed directory so uploaded MOH audio survives container
      # rebuilds. Bound to the docker volume moh-assets below.
      MOH_STORAGE_DIR: ${MOH_STORAGE_DIR:-/var/lib/connect/moh-assets}
      # Shared secret the PBX-host connect-media-sync.sh helper presents as
      # x-connect-secret when pulling /voice/moh/sync-manifest. Distinct from
      # CDR_INGEST_SECRET so we can rotate them independently.
      MOH_SYNC_SHARED_SECRET: ${MOH_SYNC_SHARED_SECRET:-}
      # Signs the short-lived download URLs embedded in the manifest. Keep
      # separate from CDR_INGEST so a CDR secret leak doesn't grant file read.
      # ⛔ This `environment:` line OVERRIDES the 43-char value in
      # .env.platform with "" (the deploy shell never sources that file) — the
      # same trap that left CDR_INGEST_SECRET empty for the life of the platform.
      # It is LEFT AS IS on purpose: nothing outside apps/api mints or verifies a
      # MOH URL, so api deriving its key from JWT_SECRET is deterministic and
      # correct. Deleting this line would hand api the 43-char file value and
      # rotate every outstanding MOH URL (harmless — 10-min TTL — but deliberate,
      # not accidental). See apps/api/src/urlSigningSecret.ts.
      MOH_URL_SIGNING_SECRET: ${MOH_URL_SIGNING_SECRET:-}
      # Shared chat attachment storage. The worker mounts the same volume so
      # it can transcode voice notes before VoIP.ms MMS submission.
      CHAT_STORAGE_DIR: ${CHAT_STORAGE_DIR:-/var/lib/connect/chat-attachments}
      # Onboarding wizard uploads (porting bills / LOAs). MUST stay on the
      # onboarding-files volume: without it the files land in the container's
      # writable layer and every api deploy destroys them while the DB row
      # survives (2026-08-05: a customer's Verizon bill needed for a number
      # port was lost exactly this way).
      ONBOARDING_STORAGE_DIR: ${ONBOARDING_STORAGE_DIR:-/var/lib/connect/onboarding-files}
      # Local voicemail audio store — each message is fetched from the PBX once
      # and served from here forever. Losing the volume is only a re-fetch cost
      # (the PBX keeps the original), but an ephemeral dir would silently
      # reinstate the per-play PBX load the store exists to remove.
      VOICEMAIL_AUDIO_STORAGE_DIR: ${VOICEMAIL_AUDIO_STORAGE_DIR:-/var/lib/connect/voicemail-audio}
      # Profile photos (users) and contact photos. Same trap as the onboarding
      # uploads above: unset, these fell back to <cwd>/data, which no volume
      # covers, so every api deploy destroyed them while the DB kept
      # avatarStorageKey + avatarUrl — and the UI rendered a broken image.
      # Found 2026-08-09 with /app/data absent and 2 orphaned user rows.
      USER_AVATAR_STORAGE_DIR: ${USER_AVATAR_STORAGE_DIR:-/var/lib/connect/user-avatars}
      CONTACT_AVATAR_STORAGE_DIR: ${CONTACT_AVATAR_STORAGE_DIR:-/var/lib/connect/contact-avatars}
      # Public URL the PBX-host helper can actually reach. MUST be set in
      # production or signed URLs will point at http://localhost:3001.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      # ── IVR prompt audio storage (browser-playable system recordings) ─────
      # The PBX-host connect-prompt-sync.sh helper POSTs WAV/MP3/GSM bytes here
      # so the Connect UI can preview them. Admins can also upload via the UI
      # directly. Same shared-secret pattern as MOH; reuses its env var by
      # default so no new secret is required for turn-up.
      PROMPT_STORAGE_DIR: ${PROMPT_STORAGE_DIR:-/var/lib/connect/ivr-prompts}
      PROMPT_SYNC_SHARED_SECRET: ${PROMPT_SYNC_SHARED_SECRET:-}
      PROMPT_URL_SIGNING_SECRET: ${PROMPT_URL_SIGNING_SECRET:-}
      # ── Android APK distribution ─────────────────────────────────────────
      # Where the API reads APK files from (mounted read-only below). The
      # host-side directory is populated by scripts/android-publish.ps1.
      APK_DOWNLOAD_DIR: ${APK_DOWNLOAD_DIR:-/var/lib/connect/downloads}
      # Optional override for the public download URL that goes into the
      # invitation email. Leave unset to auto-derive from PUBLIC_API_URL.
      ANDROID_APK_DOWNLOAD_URL: ${ANDROID_APK_DOWNLOAD_URL:-}
      ANDROID_APK_DOWNLOAD_URL_BASE: ${ANDROID_APK_DOWNLOAD_URL_BASE:-}
      # ── CRM lead document storage ─────────────────────────────────────────
      # Volume-backed directory for imported tenant Drive documents. Files survive
      # container rebuilds.
      # ⛔ CORRECTED 2026-08-18: signed open URLs NO LONGER borrow
      # PROMPT_URL_SIGNING_SECRET (nor MOH's, nor CDR_INGEST_SECRET, nor the repo
      # literal "dev-signing-secret" that chain ended on). The key is
      # CRM_DOC_URL_SIGNING_SECRET, else one derived from JWT_SECRET, else the
      # helper THROWS. See apps/api/src/urlSigningSecret.ts and
      # docs/ai-context/AGENT_HANDOFF_TENANT_ISOLATION_AUDIT_2026-08-17.md §3b.
      CRM_DOC_STORAGE_DIR: ${CRM_DOC_STORAGE_DIR:-/var/lib/connect/crm-lead-docs}
      # CRM voicemail drop converted WAV storage. Must be volume-backed so
      # previews and PBX pushes survive API rebuilds and blue/green rollouts.
      CRM_VOICEMAIL_DROP_STORAGE_DIR: ${CRM_VOICEMAIL_DROP_STORAGE_DIR:-/var/lib/connect/crm-voicemail-drops}
      # ── Storage Health host visibility (Phase 1.6, read-only inventory) ───
      STORAGE_HOST_INVENTORY_ROOT: ${STORAGE_HOST_INVENTORY_ROOT:-/host-inventory}
      STORAGE_DOCKER_SOCKET: ${STORAGE_DOCKER_SOCKET:-/var/run/docker.sock}
      STORAGE_APP_ROOT: ${STORAGE_APP_ROOT:-/host-inventory/opt/connectcomms}
      STORAGE_APP_CLONE_ROOT: ${STORAGE_APP_CLONE_ROOT:-/host-inventory/opt/connectcomms/app}
      STORAGE_DATA_ROOT: ${STORAGE_DATA_ROOT:-/host-inventory/opt/connectcomms/data}
      STORAGE_ENV_ROOT: ${STORAGE_ENV_ROOT:-/host-inventory/opt/connectcomms/env}
      STORAGE_BACKUPS_ROOT: ${STORAGE_BACKUPS_ROOT:-/host-inventory/opt/connectcomms/backups}
      STORAGE_DOWNLOADS_ROOT: ${STORAGE_DOWNLOADS_ROOT:-/host-inventory/opt/connectcomms/downloads}
      STORAGE_MONITORING_LOGS_ROOT: ${STORAGE_MONITORING_LOGS_ROOT:-/host-inventory/opt/connectcomms/monitoring/logs}
      STORAGE_CONTAINERD_ROOT: ${STORAGE_CONTAINERD_ROOT:-/host-inventory/var/lib/containerd}
      STORAGE_JOURNAL_ROOT: ${STORAGE_JOURNAL_ROOT:-/host-inventory/var/log/journal}
      STORAGE_DEPLOY_LOGS_ROOT: ${STORAGE_DEPLOY_LOGS_ROOT:-/host-inventory/var/log/connect-deploys}
      STORAGE_PREFLIGHT_SNAPSHOT_ROOT: ${STORAGE_PREFLIGHT_SNAPSHOT_ROOT:-/var/lib/connect/storage-preflight}
      STORAGE_CLEANUP_ENABLED: ${STORAGE_CLEANUP_ENABLED:-0}
    command: sh -lc "pnpm --filter @connect/api start"
    ports:
      - "127.0.0.1:3001:3001"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 180s
    volumes:
      # Persistent MOH asset storage — survives container rebuilds. The
      # connect-media-sync.sh cron on the PBX host pulls files from here via
      # signed HTTPS URLs, never by shared filesystem.
      - moh-assets:/var/lib/connect/moh-assets
      # IVR prompt audio storage — same pattern as MOH. The
      # connect-prompt-sync.sh cron on the PBX host POSTs recording bytes
      # here so Connect can stream them to the browser on click.
      - ivr-prompts:/var/lib/connect/ivr-prompts
      # Android APK distribution. Operators populate this directory via
      # scripts/android-publish.ps1 (scp on top of an existing release APK).
      # Mounted read-only so a compromised API container cannot tamper with
      # the published binary.
      - /opt/connectcomms/downloads:/var/lib/connect/downloads:ro
      - chat-attachments:/var/lib/connect/chat-attachments
      # Onboarding wizard uploads (porting bills / LOAs) — must survive
      # deploys; the DB rows that point at these files certainly do.
      - onboarding-files:/var/lib/connect/onboarding-files
      # Voicemail audio fetched once from the PBX, served locally forever.
      - voicemail-audio:/var/lib/connect/voicemail-audio
      # Profile and contact photos — must survive deploys and blue/green
      # cutovers; the DB rows pointing at them do.
      - user-avatars:/var/lib/connect/user-avatars
      - contact-avatars:/var/lib/connect/contact-avatars
      # Persistent CRM lead document storage. Tenant document files survive
      # container rebuilds and blue/green API rollouts.
      - crm-lead-docs:/var/lib/connect/crm-lead-docs
      # Persistent CRM voicemail drop WAV storage for preview and PBX sync.
      - crm-voicemail-drops:/var/lib/connect/crm-voicemail-drops
      # Read-only host inventory for Storage Health scanner (Phase 1.6). No writes.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/containerd:/host-inventory/var/lib/containerd:ro
      - /opt/connectcomms:/host-inventory/opt/connectcomms:ro
      - /var/log:/host-inventory/var/log:ro
      # Writable preflight snapshot store (Phase 2 proof JSON only — no cleanup)
      - /opt/connectcomms/backups/storage-preflight:/var/lib/connect/storage-preflight
    networks:
      - default
      - infra_default

  # Blue/green candidate for zero-downtime API deploys (host :3004). See scripts/deploy-api.sh
  # and docs/nginx/README.md. Not started by default (`profiles`); deploy queue starts explicitly.
  api_candidate:
    profiles: ["api_rollout"]
    restart: "no"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    container_name: app-api-candidate-1
    env_file:
      - /opt/connectcomms/env/.env.platform
      - path: /etc/connect-robot/credentials.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
      # Same automated-onboarding gates as the stable api service.
      VOIPMS_AUTO_PROVISION: ${VOIPMS_AUTO_PROVISION:-on}
      ONBOARDING_PBX_AUTO_SETUP: ${ONBOARDING_PBX_AUTO_SETUP:-on}
      SMS_PROVIDER_TEST_MODE: ${SMS_PROVIDER_TEST_MODE:-false}
      SIMULATE_NUMBER_PROVIDER: ${SIMULATE_NUMBER_PROVIDER:-false}
      SOLA_CARDKNOX_SIMULATE: ${SOLA_CARDKNOX_SIMULATE:-false}
      SOLA_CARDKNOX_MODE: ${SOLA_CARDKNOX_MODE:-sandbox}
      SOLA_CARDKNOX_API_BASE_URL: ${SOLA_CARDKNOX_API_BASE_URL:-}
      SOLA_CARDKNOX_API_KEY: ${SOLA_CARDKNOX_API_KEY:-}
      SOLA_CARDKNOX_API_SECRET: ${SOLA_CARDKNOX_API_SECRET:-}
      SOLA_CARDKNOX_WEBHOOK_SECRET: ${SOLA_CARDKNOX_WEBHOOK_SECRET:-}
      PBX_SIMULATE: ${PBX_SIMULATE:-false}
      PBX_BASE_URL: ${PBX_BASE_URL:-}
      PBX_API_TOKEN: ${PBX_API_TOKEN:-}
      PBX_API_SECRET: ${PBX_API_SECRET:-}
      PBX_TIMEOUT_MS: ${PBX_TIMEOUT_MS:-10000}
      PBX_TIMEZONE: ${PBX_TIMEZONE:-America/New_York}
      PBX_WS_ENDPOINT: ${PBX_WS_ENDPOINT:-wss://209.145.60.79:8089/ws}
      STUN_SERVER: ${STUN_SERVER:-stun:stun.l.google.com:19302}
      TURN_SERVER: ${TURN_SERVER:-}
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      TELEPHONY_INTERNAL_URL: ${TELEPHONY_INTERNAL_URL:-http://telephony:3003}
      PBX_WEBHOOK_VERIFY_MODE: ${PBX_WEBHOOK_VERIFY_MODE:-token}
      PBX_WEBHOOK_TOKEN: ${PBX_WEBHOOK_TOKEN:-}
      PBX_WEBHOOK_SIGNATURE_SECRET: ${PBX_WEBHOOK_SIGNATURE_SECRET:-}
      PBX_WEBHOOK_ALLOWED_IPS: ${PBX_WEBHOOK_ALLOWED_IPS:-}
      PBX_WEBHOOK_REGISTER_PATH: ${PBX_WEBHOOK_REGISTER_PATH:-}
      PBX_WEBHOOK_LIST_PATH: ${PBX_WEBHOOK_LIST_PATH:-}
      PBX_WEBHOOK_DELETE_PATH: ${PBX_WEBHOOK_DELETE_PATH:-}
      PBX_ACTIVE_CALLS_PATH: ${PBX_ACTIVE_CALLS_PATH:-}
      PBX_SUPPORTS_WEBHOOKS: ${PBX_SUPPORTS_WEBHOOKS:-false}
      PBX_SUPPORTS_ACTIVE_CALL_POLLING: ${PBX_SUPPORTS_ACTIVE_CALL_POLLING:-false}
      PBX_WEBHOOK_EVENT_TYPES: ${PBX_WEBHOOK_EVENT_TYPES:-}
      EXPO_PUSH_ACCESS_TOKEN: ${EXPO_PUSH_ACCESS_TOKEN:-}
      # Firebase direct-FCM call wakes: the service-account JSON is exposed to the
      # container via the /opt/connectcomms → /host-inventory mount below. Point the
      # sender at it so call-critical Android wakes go direct (Doze-exempt) instead of
      # silently falling back to the Expo relay. Missing file/path = Expo fallback.
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-/host-inventory/opt/connectcomms/env/firebase-service-account.json}
      MOBILE_PUSH_SIMULATE: ${MOBILE_PUSH_SIMULATE:-false}
      VOICE_SIMULATE: ${VOICE_SIMULATE:-false}
      # CDR_INGEST_SECRET IS DELIBERATELY *NOT* LISTED HERE.
      # It comes from env_file (/opt/connectcomms/env/.env.platform).
      # `environment:` WINS OVER `env_file:`, so the old line
      #     CDR_INGEST_SECRET: ${CDR_INGEST_SECRET:-}
      # substituted the DEPLOY SHELL's value - and the deploy scripts source
      # only .env.deploy-queue, never .env.platform. The result was an
      # EMPTY string in api and telephony (proven live: defined=true len=0)
      # that silently overrode the file, which is exactly why every
      # /internal/* door ran unauthenticated for the life of the platform.
      # Same trap the telephony block already warns about for JWT_SECRET /
      # AMI_PASSWORD. Do not re-add it. See
      # docs/ai-context/AGENT_HANDOFF_TENANT_ISOLATION_AUDIT_2026-08-17.md
      MOH_STORAGE_DIR: ${MOH_STORAGE_DIR:-/var/lib/connect/moh-assets}
      MOH_SYNC_SHARED_SECRET: ${MOH_SYNC_SHARED_SECRET:-}
      # ⛔ This `environment:` line OVERRIDES the 43-char value in
      # .env.platform with "" (the deploy shell never sources that file) — the
      # same trap that left CDR_INGEST_SECRET empty for the life of the platform.
      # It is LEFT AS IS on purpose: nothing outside apps/api mints or verifies a
      # MOH URL, so api deriving its key from JWT_SECRET is deterministic and
      # correct. Deleting this line would hand api the 43-char file value and
      # rotate every outstanding MOH URL (harmless — 10-min TTL — but deliberate,
      # not accidental). See apps/api/src/urlSigningSecret.ts.
      MOH_URL_SIGNING_SECRET: ${MOH_URL_SIGNING_SECRET:-}
      CHAT_STORAGE_DIR: ${CHAT_STORAGE_DIR:-/var/lib/connect/chat-attachments}
      # Same onboarding upload volume as the stable api service — port
      # documents must survive blue/green cutovers too.
      ONBOARDING_STORAGE_DIR: ${ONBOARDING_STORAGE_DIR:-/var/lib/connect/onboarding-files}
      # Same voicemail audio store as the stable api service — the cache must
      # survive blue/green cutovers or every cutover re-fetches from the PBX.
      VOICEMAIL_AUDIO_STORAGE_DIR: ${VOICEMAIL_AUDIO_STORAGE_DIR:-/var/lib/connect/voicemail-audio}
      # Profile photos (users) and contact photos. Same trap as the onboarding
      # uploads above: unset, these fell back to <cwd>/data, which no volume
      # covers, so every api deploy destroyed them while the DB kept
      # avatarStorageKey + avatarUrl — and the UI rendered a broken image.
      # Found 2026-08-09 with /app/data absent and 2 orphaned user rows.
      USER_AVATAR_STORAGE_DIR: ${USER_AVATAR_STORAGE_DIR:-/var/lib/connect/user-avatars}
      CONTACT_AVATAR_STORAGE_DIR: ${CONTACT_AVATAR_STORAGE_DIR:-/var/lib/connect/contact-avatars}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PROMPT_STORAGE_DIR: ${PROMPT_STORAGE_DIR:-/var/lib/connect/ivr-prompts}
      PROMPT_SYNC_SHARED_SECRET: ${PROMPT_SYNC_SHARED_SECRET:-}
      PROMPT_URL_SIGNING_SECRET: ${PROMPT_URL_SIGNING_SECRET:-}
      APK_DOWNLOAD_DIR: ${APK_DOWNLOAD_DIR:-/var/lib/connect/downloads}
      ANDROID_APK_DOWNLOAD_URL: ${ANDROID_APK_DOWNLOAD_URL:-}
      ANDROID_APK_DOWNLOAD_URL_BASE: ${ANDROID_APK_DOWNLOAD_URL_BASE:-}
      CRM_DOC_STORAGE_DIR: ${CRM_DOC_STORAGE_DIR:-/var/lib/connect/crm-lead-docs}
      CRM_VOICEMAIL_DROP_STORAGE_DIR: ${CRM_VOICEMAIL_DROP_STORAGE_DIR:-/var/lib/connect/crm-voicemail-drops}
      STORAGE_HOST_INVENTORY_ROOT: ${STORAGE_HOST_INVENTORY_ROOT:-/host-inventory}
      STORAGE_DOCKER_SOCKET: ${STORAGE_DOCKER_SOCKET:-/var/run/docker.sock}
      STORAGE_APP_ROOT: ${STORAGE_APP_ROOT:-/host-inventory/opt/connectcomms}
      STORAGE_APP_CLONE_ROOT: ${STORAGE_APP_CLONE_ROOT:-/host-inventory/opt/connectcomms/app}
      STORAGE_DATA_ROOT: ${STORAGE_DATA_ROOT:-/host-inventory/opt/connectcomms/data}
      STORAGE_ENV_ROOT: ${STORAGE_ENV_ROOT:-/host-inventory/opt/connectcomms/env}
      STORAGE_BACKUPS_ROOT: ${STORAGE_BACKUPS_ROOT:-/host-inventory/opt/connectcomms/backups}
      STORAGE_DOWNLOADS_ROOT: ${STORAGE_DOWNLOADS_ROOT:-/host-inventory/opt/connectcomms/downloads}
      STORAGE_MONITORING_LOGS_ROOT: ${STORAGE_MONITORING_LOGS_ROOT:-/host-inventory/opt/connectcomms/monitoring/logs}
      STORAGE_CONTAINERD_ROOT: ${STORAGE_CONTAINERD_ROOT:-/host-inventory/var/lib/containerd}
      STORAGE_JOURNAL_ROOT: ${STORAGE_JOURNAL_ROOT:-/host-inventory/var/log/journal}
      STORAGE_DEPLOY_LOGS_ROOT: ${STORAGE_DEPLOY_LOGS_ROOT:-/host-inventory/var/log/connect-deploys}
      STORAGE_PREFLIGHT_SNAPSHOT_ROOT: ${STORAGE_PREFLIGHT_SNAPSHOT_ROOT:-/var/lib/connect/storage-preflight}
      STORAGE_CLEANUP_ENABLED: ${STORAGE_CLEANUP_ENABLED:-0}
    command: sh -lc "pnpm --filter @connect/api start"
    ports:
      - "127.0.0.1:3004:3001"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    volumes:
      - moh-assets:/var/lib/connect/moh-assets
      - ivr-prompts:/var/lib/connect/ivr-prompts
      - /opt/connectcomms/downloads:/var/lib/connect/downloads:ro
      - chat-attachments:/var/lib/connect/chat-attachments
      - onboarding-files:/var/lib/connect/onboarding-files
      - voicemail-audio:/var/lib/connect/voicemail-audio
      # Profile and contact photos — must survive deploys and blue/green
      # cutovers; the DB rows pointing at them do.
      - user-avatars:/var/lib/connect/user-avatars
      - contact-avatars:/var/lib/connect/contact-avatars
      - crm-lead-docs:/var/lib/connect/crm-lead-docs
      - crm-voicemail-drops:/var/lib/connect/crm-voicemail-drops
      # Read-only host inventory for Storage Health scanner (Phase 1.6). No writes.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/containerd:/host-inventory/var/lib/containerd:ro
      - /opt/connectcomms:/host-inventory/opt/connectcomms:ro
      - /var/log:/host-inventory/var/log:ro
      - /opt/connectcomms/backups/storage-preflight:/var/lib/connect/storage-preflight
    networks:
      - default
      - infra_default

  portal:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_TELEPHONY_WS_URL: ${NEXT_PUBLIC_TELEPHONY_WS_URL:-}
        NEXT_PUBLIC_FORCE_ICE_RELAY: ${NEXT_PUBLIC_FORCE_ICE_RELAY:-}
        NEXT_PUBLIC_CRM_EMAIL_PHASE1_ENABLED: ${NEXT_PUBLIC_CRM_EMAIL_PHASE1_ENABLED:-true}
        # Cloudflare Turnstile site key for the sign-in form. PUBLIC by design (it ships
        # in the bundle); the SECRET lives in .env.platform and never leaves the api.
        # The literal is the DEFAULT on purpose: deploy-direct.sh sources only
        # .env.deploy-queue, so a bare ${VAR:-} would silently bake an UNKEYED portal
        # and the login page would lose its check with nothing failing loudly.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-0x4AAAAAAEXikCDGv1Pl_SuX}
    environment:
      # Empty = browser uses same-origin `/api` (works for every hostname nginx serves; avoids
      # hard-coding one domain when users open an alternate spelling/alias host).
      # Local dev: set NEXT_PUBLIC_API_URL=http://localhost:3001 in apps/portal/.env.local
      NEXT_PUBLIC_API_URL: ""
      # Server-side fetches from the portal container (if any) reach the API service directly.
      PORTAL_API_INTERNAL_URL: http://api:3001
      # Live AMI event stream for call/extension/queue state in the portal dashboard.
      # Must be wss:// in production (nginx proxies wss: → ws: internally).
      NEXT_PUBLIC_TELEPHONY_WS_URL: ${NEXT_PUBLIC_TELEPHONY_WS_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default

  # Blue/green candidate for zero-downtime portal deploys (host :3005). See scripts/deploy-portal.sh
  # and docs/nginx/README.md. Started only with profile portal_rollout.
  portal_candidate:
    profiles: ["portal_rollout"]
    restart: "no"
    container_name: app-portal-candidate-1
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_TELEPHONY_WS_URL: ${NEXT_PUBLIC_TELEPHONY_WS_URL:-}
        NEXT_PUBLIC_FORCE_ICE_RELAY: ${NEXT_PUBLIC_FORCE_ICE_RELAY:-}
        NEXT_PUBLIC_CRM_EMAIL_PHASE1_ENABLED: ${NEXT_PUBLIC_CRM_EMAIL_PHASE1_ENABLED:-true}
        # Cloudflare Turnstile site key for the sign-in form. PUBLIC by design (it ships
        # in the bundle); the SECRET lives in .env.platform and never leaves the api.
        # The literal is the DEFAULT on purpose: deploy-direct.sh sources only
        # .env.deploy-queue, so a bare ${VAR:-} would silently bake an UNKEYED portal
        # and the login page would lose its check with nothing failing loudly.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-0x4AAAAAAEXikCDGv1Pl_SuX}
    environment:
      NEXT_PUBLIC_API_URL: ""
      PORTAL_API_INTERNAL_URL: http://api:3001
      NEXT_PUBLIC_TELEPHONY_WS_URL: ${NEXT_PUBLIC_TELEPHONY_WS_URL:-}
    ports:
      - "127.0.0.1:3005:3000"
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ready"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 240s
    networks:
      - default

  realtime:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    env_file:
      - /opt/connectcomms/env/.env.platform
    ports:
      - "127.0.0.1:3002:3002"
    networks:
      - default

  telephony:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/telephony/Dockerfile
    env_file:
      - /opt/connectcomms/env/.env.platform
    environment:
      # Non-secret defaults only. Secrets (JWT_SECRET, AMI_PASSWORD, ARI_PASSWORD)
      # are read directly from env_file — do NOT override them here or the
      # empty shell-substitution will win over the file value.
      PORT: ${TELEPHONY_PORT:-3003}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PBX_HOST: ${PBX_HOST:-209.145.60.79}
      AMI_PORT: ${AMI_PORT:-5038}
      AMI_USERNAME: ${AMI_USERNAME:-connectcommsgefenu}
      ARI_BASE_URL: ${ARI_BASE_URL:-http://209.145.60.79:8088}
      ARI_USERNAME: ${ARI_USERNAME:-connectcomms}
      ARI_APP_NAME: ${ARI_APP_NAME:-connectcomms}
      TELEPHONY_WS_PATH: ${TELEPHONY_WS_PATH:-/ws/telephony}
      TELEPHONY_SNAPSHOT_INTERVAL_MS: ${TELEPHONY_SNAPSHOT_INTERVAL_MS:-5000}
      TELEPHONY_EVENT_DEBOUNCE_MS: ${TELEPHONY_EVENT_DEBOUNCE_MS:-100}
      ENABLE_TELEPHONY_DEBUG: ${ENABLE_TELEPHONY_DEBUG:-false}
      # CDR persistence: telephony POSTs completed calls to the API for DB storage.
      CDR_INGEST_URL: ${CDR_INGEST_URL:-http://api:3001/internal/cdr-ingest}
      # CDR_INGEST_SECRET IS DELIBERATELY *NOT* LISTED HERE.
      # It comes from env_file (/opt/connectcomms/env/.env.platform).
      # `environment:` WINS OVER `env_file:`, so the old line
      #     CDR_INGEST_SECRET: ${CDR_INGEST_SECRET:-}
      # substituted the DEPLOY SHELL's value - and the deploy scripts source
      # only .env.deploy-queue, never .env.platform. The result was an
      # EMPTY string in api and telephony (proven live: defined=true len=0)
      # that silently overrode the file, which is exactly why every
      # /internal/* door ran unauthenticated for the life of the platform.
      # Same trap the telephony block already warns about for JWT_SECRET /
      # AMI_PASSWORD. Do not re-add it. See
      # docs/ai-context/AGENT_HANDOFF_TENANT_ISOLATION_AUDIT_2026-08-17.md
      # ── On-ring contact-liveness probe ────────────────────────────────────
      # A phone that slept and lost its socket leaves its contact bound for at
      # least 10 minutes (minimum_expiration=600) while the PBX only re-checks
      # on its own 30 s qualify cycle. Inside that window the dead contact looks
      # perfectly healthy, so the call is dialled straight into a black hole and
      # the caller hears voicemail. One SIP OPTIONS at ring time
      # (qualify_timeout=3) collapses that window from ≤30 s to ~3 s at the only
      # moment it matters — far cheaper than raising qualify_frequency
      # fleet-wide, which drains battery on every handset continuously.
      #
      # ⛔ Written 2026-07 and DEFAULT OFF ever since because it makes the
      # read-only PBX emit OPTIONS, so it needed the owner's explicit mandate.
      # Verified on 2026-08-06 that it had never been set anywhere in
      # production — the safeguard existed on paper only. Enabled under Izzy's
      # explicit go-ahead the same day.
      PBX_CONTACT_QUALIFY_ON_RING: ${PBX_CONTACT_QUALIFY_ON_RING:-1}
    ports:
      - "127.0.0.1:3003:3003"
      # Voice-agent AudioSocket ingress (PBX dialplan → AudioSocket(uuid, host:4590)).
      # ⛔ Docker-published ports BYPASS ufw, so this is internet-reachable; the
      # structural lock is the single-use 128-bit session UUID announced over AMI
      # seconds earlier (unknown UUID → terminated instantly), plus a
      # DOCKER-USER iptables rule restricting the port to the PBX's address.
      # ⛔ VOICE_AGENT_ENABLED / VOICE_AGENT_PORT are read from env_file ONLY —
      # never add them to `environment:` (the ${VAR:-} deploy-shell substitution
      # trap that silently blanked CDR_INGEST_SECRET for the platform's life).
      - "4590:4590"
    networks:
      - default
      - infra_default

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: sh -c "pnpm --filter @connect/db exec prisma generate --schema prisma/schema.prisma && pnpm --filter @connect/worker dev"
    env_file:
      - /opt/connectcomms/env/.env.platform
    environment:
      TZ: ${TZ:-America/New_York}
      SMS_PROVIDER: ${SMS_PROVIDER:-fake}
      # Worker handles queued chat/campaign SMS sends; production default must
      # call the provider, not return voipms-test-* simulated ids.
      SMS_PROVIDER_TEST_MODE: ${SMS_PROVIDER_TEST_MODE:-false}
      SIMULATE_PROVIDER_FAILURE_TWILIO: ${SIMULATE_PROVIDER_FAILURE_TWILIO:-false}
      SIMULATE_PROVIDER_FAILURE_VOIPMS: ${SIMULATE_PROVIDER_FAILURE_VOIPMS:-false}
      SIMULATE_NUMBER_PROVIDER: ${SIMULATE_NUMBER_PROVIDER:-false}
      SOLA_CARDKNOX_SIMULATE: ${SOLA_CARDKNOX_SIMULATE:-false}
      SOLA_CARDKNOX_MODE: ${SOLA_CARDKNOX_MODE:-sandbox}
      SOLA_CARDKNOX_API_BASE_URL: ${SOLA_CARDKNOX_API_BASE_URL:-}
      SOLA_CARDKNOX_API_KEY: ${SOLA_CARDKNOX_API_KEY:-}
      SOLA_CARDKNOX_API_SECRET: ${SOLA_CARDKNOX_API_SECRET:-}
      SOLA_CARDKNOX_WEBHOOK_SECRET: ${SOLA_CARDKNOX_WEBHOOK_SECRET:-}
      PBX_SIMULATE: ${PBX_SIMULATE:-false}
      PBX_BASE_URL: ${PBX_BASE_URL:-}
      PBX_API_TOKEN: ${PBX_API_TOKEN:-}
      PBX_API_SECRET: ${PBX_API_SECRET:-}
      PBX_TIMEOUT_MS: ${PBX_TIMEOUT_MS:-10000}
      PBX_WS_ENDPOINT: ${PBX_WS_ENDPOINT:-wss://209.145.60.79:8089/ws}
      STUN_SERVER: ${STUN_SERVER:-stun:stun.l.google.com:19302}
      TURN_SERVER: ${TURN_SERVER:-}
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      PBX_WEBHOOK_VERIFY_MODE: ${PBX_WEBHOOK_VERIFY_MODE:-token}
      PBX_WEBHOOK_TOKEN: ${PBX_WEBHOOK_TOKEN:-}
      PBX_WEBHOOK_SIGNATURE_SECRET: ${PBX_WEBHOOK_SIGNATURE_SECRET:-}
      PBX_WEBHOOK_ALLOWED_IPS: ${PBX_WEBHOOK_ALLOWED_IPS:-}
      PBX_ACTIVE_CALLS_PATH: ${PBX_ACTIVE_CALLS_PATH:-}
      PBX_SUPPORTS_WEBHOOKS: ${PBX_SUPPORTS_WEBHOOKS:-false}
      PBX_SUPPORTS_ACTIVE_CALL_POLLING: ${PBX_SUPPORTS_ACTIVE_CALL_POLLING:-false}
      PBX_WEBHOOK_EVENT_TYPES: ${PBX_WEBHOOK_EVENT_TYPES:-}
      EXPO_PUSH_ACCESS_TOKEN: ${EXPO_PUSH_ACCESS_TOKEN:-}
      # ⛔ WITHOUT THESE TWO LINES THE WORKER'S DIRECT-FCM CODE IS DEAD CODE.
      # The worker gained a direct-FCM sender on 2026-07-31 (see
      # sendPushToUserDevices → callCriticalTypes block) but was never given the
      # credential the api already had, so `isFcmDirectConfigured()` returned
      # false on every call and 100% of worker pushes — INCOMING_CALL rings,
      # INCOMING_CALL_WAKE, INVITE_CANCELED stop-ringing, INVITE_CLAIMED — fell
      # back to the Expo relay for EVERY device, including the ones holding a
      # native FCM token. Found 2026-08-06: env var empty, no mount, six days of
      # silent fallback. `isFcmDirectConfigured()` fails closed and logs nothing,
      # which is exactly why it went unnoticed — see the startup assertion in
      # apps/worker/src/main.ts that now makes this loud.
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-/host-inventory/opt/connectcomms/env/firebase-service-account.json}
      MOBILE_PUSH_SIMULATE: ${MOBILE_PUSH_SIMULATE:-false}
      VOICE_SIMULATE: ${VOICE_SIMULATE:-false}
      CHAT_STORAGE_DIR: ${CHAT_STORAGE_DIR:-/var/lib/connect/chat-attachments}
    volumes:
      - chat-attachments:/var/lib/connect/chat-attachments
      # Read-only, and scoped to `env/` only — the worker needs exactly one file
      # (firebase-service-account.json). The api mounts all of /opt/connectcomms
      # because its storage-preflight walks the tree; the worker does not.
      - /opt/connectcomms/env:/host-inventory/opt/connectcomms/env:ro
    networks:
      - default
      - infra_default

networks:
  infra_default:
    external: true

volumes:
  # Persistent storage for MOH audio files uploaded via the portal. Survives
  # container rebuilds; PBX-host helper pulls files from here via signed
  # HTTPS, never by shared filesystem or SSH.
  moh-assets:
    driver: local
  # Persistent storage for IVR prompt audio (VitalPBX system recordings)
  # uploaded via the PBX-host cron helper or directly from the Connect UI.
  # The browser streams these via /voice/ivr/prompts/:id/stream.
  ivr-prompts:
    driver: local
  chat-attachments:
    driver: local
  # Onboarding wizard uploads (porting bills / LOAs). Shared between api and
  # api_candidate so files survive deploys and blue/green cutovers. Before
  # this volume existed every api deploy silently destroyed these documents.
  onboarding-files:
    driver: local
  # Voicemail audio fetched once from the PBX and served locally forever.
  # Shared between api and api_candidate so the cache survives blue/green
  # cutovers. Losing it is a re-fetch cost, never data loss.
  voicemail-audio:
    driver: local
  # Persistent storage for CRM imported lead documents (Drive files pulled into
  # tenant-scoped local storage). Survives container rebuilds and blue/green rollouts.
  # Shared between api and api_candidate so signed open URLs resolve during cutover.
  crm-lead-docs:
    driver: local
  # Persistent storage for CRM voicemail drop WAV files. Shared between api
  # and api_candidate so previews work through blue/green cutovers.
  crm-voicemail-drops:
    driver: local
  # Profile photos and contact photos. Shared between api and api_candidate so
  # an avatar uploaded on one side still resolves after a blue/green cutover.
  user-avatars:
    driver: local
  contact-avatars:
    driver: local
