; ============================================================================
; Connect — CRM Voicemail Drop dialplan context  (REVIEW COPY / exact snippet)
;
; This is the exact [connect-vm-drop] context emitted by the installer
;   scripts/pbx/install-connect-vm-drop-dialplan.sh
; Kept here for human review of the precise dialplan BEFORE any install.
;
; INSTALL LOCATION (confirmed from the PBX repo snapshot, docs/pbx-brain/):
;   /etc/asterisk/vitalpbx/extensions__96-connect-vm-drop.conf
;   Auto-loaded by /etc/asterisk/extensions.conf line 1:
;       #include vitalpbx/extensions__*.conf
;   (same mechanism that loads the existing Connect-owned
;    extensions__95-connect-vm-greeting.conf). Prefix __96 is uniquely named
;    and sits above VitalPBX's generated __20/__50 range, so VitalPBX config
;    regeneration never collides with or clobbers it.
;
; DO NOT install by hand. Use the installer (idempotent, backs up, reloads,
; verifies, restores on failure, supports --check / --dry-run / --rollback).
; Installing is a manual, human-approved PBX change per AGENTS.md — NOT a
; deploy step, and Cursor agents must not run it against the live PBX.
;
; HOW CONNECT DRIVES IT (AMI only — no ARI media; see TELEPHONY.md):
;   1. Setvar   <customer leg>  VMDROP_FILE=<basename>   (no "custom/", no ext)
;      (optional) VMDROP_STRATEGY=<fixed|waitsilence|amd>, VMDROP_WAIT=<secs>
;   2. Redirect <customer leg>  -> connect-vm-drop,s,1
;   3. Hangup   <agent leg>
;   customer leg channel name = PJSIP/<trunkdigits>_<name>-<hex> (e.g. PJSIP/344022_Vaddb-00000a93)
;   agent leg    channel name = PJSIP/T<tenantId>_<ext>-<hex>   (e.g. PJSIP/T3_302-00000a93)
;
; LIMITATION (Choice B): default wait strategy is "fixed" (manual — the agent
; confirms voicemail was reached before clicking Drop). app_amd.so and
; app_waitforsilence.so ARE loaded on this build, so "amd"/"waitsilence" are
; wired as pluggable strategies for a later, separately-validated rollout.
; ============================================================================

[connect-vm-drop]
exten => s,1,NoOp(Connect VM drop file=${VMDROP_FILE} strategy=${VMDROP_STRATEGY} linkedid=${LINKEDID} chan=${CHANNEL(name)})
 same => n,ExecIf($["${VMDROP_STRATEGY}" = ""]?Set(VMDROP_STRATEGY=fixed))
 same => n,ExecIf($["${VMDROP_WAIT}" = ""]?Set(VMDROP_WAIT=2))
 same => n,ExecIf($["${VMDROP_SILENCE_MS}" = ""]?Set(VMDROP_SILENCE_MS=2500))
 same => n,ExecIf($["${VMDROP_SILENCE_MAXMS}" = ""]?Set(VMDROP_SILENCE_MAXMS=12000))
 same => n,GotoIf($["${VMDROP_FILE}" = ""]?nofile)
 same => n,Set(VMDROP_OK=0)
 same => n,ExecIf($["${STAT(e,/var/lib/asterisk/sounds/custom/${VMDROP_FILE}.wav)}" = "1"]?Set(VMDROP_OK=1))
 same => n,ExecIf($["${STAT(e,/var/lib/asterisk/sounds/custom/${VMDROP_FILE}.ulaw)}" = "1"]?Set(VMDROP_OK=1))
 same => n,ExecIf($["${STAT(e,/var/lib/asterisk/sounds/custom/${VMDROP_FILE}.gsm)}" = "1"]?Set(VMDROP_OK=1))
 same => n,GotoIf($["${VMDROP_OK}" != "1"]?nofile)
 same => n,ExecIf($["${CHANNEL(state)}" != "Up"]?Answer())
 same => n,Goto(wait_${VMDROP_STRATEGY},1)
 same => n,Goto(play,1)

exten => wait_fixed,1,NoOp(Connect VM drop wait=fixed secs=${VMDROP_WAIT})
 same => n,Wait(${VMDROP_WAIT})
 same => n,Goto(play,1)

exten => wait_waitsilence,1,NoOp(Connect VM drop wait=waitsilence ms=${VMDROP_SILENCE_MS} max=${VMDROP_SILENCE_MAXMS})
 same => n,WaitForSilence(${VMDROP_SILENCE_MS},1,${VMDROP_SILENCE_MAXMS})
 same => n,Wait(1)
 same => n,Goto(play,1)

exten => wait_amd,1,NoOp(Connect VM drop wait=amd)
 same => n,AMD()
 same => n,NoOp(Connect VM drop AMD status=${AMDSTATUS} cause=${AMDCAUSE})
 same => n,ExecIf($["${AMDSTATUS}" = "MACHINE"]?Wait(1))
 same => n,Goto(play,1)

exten => play,1,NoOp(Connect VM drop playing custom/${VMDROP_FILE})
 same => n,Playback(custom/${VMDROP_FILE})
 same => n,NoOp(Connect VM drop playback complete file=${VMDROP_FILE} linkedid=${LINKEDID})
 same => n,Hangup()

exten => s,n(nofile),NoOp(Connect VM drop ABORTED missing file '${VMDROP_FILE}')
 same => n,Hangup()
