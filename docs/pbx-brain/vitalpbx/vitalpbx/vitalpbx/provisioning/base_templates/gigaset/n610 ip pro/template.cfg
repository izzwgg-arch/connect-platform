    <!-- ========================= -->
    @foreach ($accounts as $index => $account)
    @php
        $hsId = sprintf('%05d', $index);   // 00000..00249
        $intNo = 11 + $index;             // 11..99
    @endphp

    <oper name="add_hs" value="{{ $hsId }}">
        <param name="hs.RegStatus" value="ToReg"/>
        <param name="hs.InternalNumber" value="{{ $intNo }}"/>
    </oper>

    <param name="hs.{{ $hsId }}.DECT_AC" value="0000"/>

    <param name="SipAccount.{{ $hsId }}.Active" value="1"/>
    <param name="SipAccount.{{ $hsId }}.AuthName" value="{{ $account['device_name'] ?? '' }}"/>
    <param name="SipAccount.{{ $hsId }}.AuthPassword" value="{{ $account['secret'] ?? '' }}"/>
    <param name="SipAccount.{{ $hsId }}.UserName" value="{{ $account['device_name'] ?? '' }}"/>
    <param name="SipAccount.{{ $hsId }}.DisplayName" value="{{ $account['description'] ?? '' }}"/>
    <param name="SipAccount.{{ $hsId }}.ProviderId" value="0"/>

    @endforeach

</nvm>

</provisioning>
