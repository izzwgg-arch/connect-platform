<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!-- Generated global.cfg Configuration File -->
<polycomConfig xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="polycomConfig.xsd">
    <reg
        @foreach ($accounts as $account)
            reg.{{ $loop->iteration }}.address="{{ $account['address'] ?? null }}"
            reg.{{ $loop->iteration }}.auth.password=REDACTED
            reg.{{ $loop->iteration }}.auth.userId="{{ $account['device_name'] ?? null }}"
            reg.{{ $loop->iteration }}.label="{{ $account['description'] ?? null }}"
            reg.{{ $loop->iteration }}.server.1.address="{{ $account['sip_domain'] ?? null }}"
            reg.{{ $loop->iteration }}.server.1.port="{{ $account['sip_port'] ?? 0 }}"
            reg.{{ $loop->iteration }}.server.1.transport="{{ $account['protocol'] ?? 'DNSnaptr' }}"
            reg.{{ $loop->iteration }}.outboundProxy.address="{{ $account['sip_proxy'] ?? null }}"
            reg.{{ $loop->iteration }}.outboundProxy.port="{{ $account['sip_proxy_port'] ?? 0 }}"
            reg.{{ $loop->iteration }}.outboundProxy.transport="{{ $account['protocol'] ?? 'DNSnaptr' }}"
        @endforeach
    >
    </reg>

    <lineKey
        @foreach ($dssKeys as $key)
            lineKey.{{ $loop->iteration }}.category="{{ $key['type'] ?? null }}"
            lineKey.{{ $loop->iteration }}.index="{{ $key['index'] ?? null }}"
        @endforeach
    >
    </lineKey>

    <attendant.resourceList
        @foreach ($dssKeys as $key)
            @if (in_array($key['blf_type'] ?? null, ['normal', 'automata']))
                attendant.resourceList.{{ $loop->iteration }}.label="{{ $key['label'] ?? null }}"
                attendant.resourceList.{{ $loop->iteration }}.address="{{ $key['address'] ?? null }}"
                attendant.resourceList.{{ $loop->iteration }}.type="{{ $key['blf_type'] ?? null }}"
            @endif
        @endforeach
    >
    </attendant.resourceList>

    <device device.set="1">
        <device.sntp
          device.sntp.gmtOffset="{{ explode('|', $timezone)[1] ?? null }}"
          device.sntp.gmtOffsetcityID="{{ explode('|', $timezone)[0] ?? null }}"
          device.sntp.serverName="pool.ntp.org"
        >
            <device.sntp.gmtOffset device.sntp.gmtOffset.set="1">
            </device.sntp.gmtOffset>
            <device.sntp.gmtOffsetcityID device.sntp.gmtOffsetcityID.set="1">
            </device.sntp.gmtOffsetcityID>
            <device.sntp.serverName device.sntp.serverName.set="1">
            </device.sntp.serverName>
        </device.sntp>
        <device.auth device.auth.localAdminPassword=REDACTED
            <device.auth.localAdminPassword device.auth.localAdminPassword.set="1">
            </device.auth.localAdminPassword>
        </device.auth>
    </device>

    <lcl.ml lcl.ml.lang="{{ $language }}"></lcl.ml>

    <lcl.datetime>
      <lcl.datetime.date lcl.datetime.date.format="{{ $dateFormat ?? 'D,dM' }}"></lcl.datetime.date>
      <lcl.datetime.time lcl.datetime.time.24HourClock="{{ $timeFormat ?? 0 }}"></lcl.datetime.time>
    </lcl.datetime>

    <bg bg.logo="">
      <bg.background bg.background.enabled="1">
      </bg.background>
      <bg.color bg.color.selection="2,1">
        <bg.color.bm bg.color.bm.1.em.name="" bg.color.bm.1.name="{{ $wallpaper }}" bg.color.bm.2.em.name="" bg.color.bm.2.name="">
        </bg.color.bm>
      </bg.color>
  </bg>
</polycomConfig>
