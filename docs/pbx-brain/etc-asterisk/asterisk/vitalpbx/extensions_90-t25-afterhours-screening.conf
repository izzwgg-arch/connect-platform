[from-internal-custom]
exten => 9000,1,NoOp(T_25 after-hours screening entry)
 same => n,Goto(t25-afterhours-screening,s,1)

[t25-afterhours-screening]
exten => s,1,NoOp(T_25 screening start)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/please-state-name-and-reason)
 same => n,Record(/var/spool/asterisk/tmp/t25-screening-${UNIQUEID}.wav,3,15,k)
 same => n,Set(SCREENFILE=/var/spool/asterisk/tmp/t25-screening-${UNIQUEID})

 ; Ring extension 101 in tenant T25 and run called-party screening on answer
 same => n,Dial(PJSIP/T25_101,30,U(t25-screen-call^${SCREENFILE}))

 ; If the called party never answers, send caller to 101 voicemail
 same => n,Voicemail(101@relax_tires-voicemail,u)
 same => n,Hangup()

[t25-screen-call]
exten => s,1,NoOp(T_25 screening prompt to callee)
 same => n,Set(SCREENFILE=${ARG1})
 same => n,Wait(1)

 ; "You have an incoming call from the business"
 same => n,Playback(you-have)
 same => n,Playback(an)
 same => n,Playback(incoming)
 same => n,Playback(call)
 same => n,Playback(from)
 same => n,Playback(the)
 same => n,Playback(company)

 ; play caller recording
 same => n,Playback(${SCREENFILE})

 ; "Press 1 to accept, press 2 to decline"
 same => n,Playback(press)
 same => n,Playback(digits/1)
 same => n,Playback(to)
 same => n,Playback(accept)
 same => n,Playback(press)
 same => n,Playback(digits/2)
 same => n,Playback(to)
 same => n,Playback(decline)

 ; wait for one digit
 same => n,Read(ACCEPT,,1,,1,5)

 ; 1 = accept and continue call
 same => n,GotoIf($["${ACCEPT}"="1"]?accept)

 ; 2 or timeout/anything else = send original caller to voicemail 101
 same => n,Goto(reject)

 same => n(accept),Return()

 same => n(reject),Set(GOSUB_RESULT=CONTINUE)
same => n,Return()	

[IVR-44]
exten => 0,1,Goto(from-internal-custom,9000,1)
