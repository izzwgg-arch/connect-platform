;PAGING VER. 1.0.0
;-------------------------------------------------------------------
[sub-paging]
exten => s,1,NoOp(APPLICATION: PAGING AND INTERCOM)
 same => n,Set(__CALL_ORIGIN=paging)
 same => n,Set(__IGNORE_DIVERSIONS=yes)
 same => n,NoOp(Filtering Paging Members)
 same => n,Set(FILTERED_PAGING_STRING=)
 same => n,Set(PAGING_STRING=${ARG1})
 same => n,Set(PAGING_CALLER=${IF($[${LEN(${CALL_SOURCE})}=0]?${CALLERID(num)}:${CALL_SOURCE})})
 same => n,Set(COUNTER=1)
 same => n,Set(CURRENT_DEVICE=${CUT(PAGING_STRING,&,${COUNTER})})
 same => n,While($[${EXISTS(${CURRENT_DEVICE})}])
 same => n,Set(MEMBER_TYPE=${CUT(CURRENT_DEVICE,/,1)})
 same => n,GotoIf($["${MEMBER_TYPE}"="MulticastRTP"]?post-filter) ; Do not Filter MultiCast Items
 same => n,Set(EXTENSION_WITH_CTXT=${CUT(CURRENT_DEVICE,/,2)})
 same => n,Set(EXTENSION=${CUT(EXTENSION_WITH_CTXT,@,1)})
 same => n,GotoIf($["${PAGING_CALLER}"="${EXTENSION}"]?next) ; Remove from list if match with the caller
 same => n(post-filter),NoOP()
 same => n,GotoIf($[${LEN(${FILTERED_PAGING_STRING})}=0]?:concatenate)
 same => n,Set(FILTERED_PAGING_STRING=${CURRENT_DEVICE})
 same => n,Goto(next)
 same => n(concatenate),NoOp()
 same => n,Set(FILTERED_PAGING_STRING=${FILTERED_PAGING_STRING}&${CURRENT_DEVICE})
 same => n(next),Set(COUNTER=$[${COUNTER} + 1])
 same => n,Set(CURRENT_DEVICE=${CUT(PAGING_STRING,&,${COUNTER})})
 same => n,EndWhile()
 same => n,GotoIf($[${LEN(${FILTERED_PAGING_STRING})}=0]?return)
 same => n,NoOp(Executing the Paging)
 same => n,Page(${FILTERED_PAGING_STRING},${ARG2},${ARG3})
 same => n(return),Return()
;END of [sub-paging]
;-------------------------------------------------------------------
;END PAGING

