[sub-get-device-tree]
exten => s,1,NoOp(Configuring Device Tree)
 same => n,Set(DEV_TECHNOLOGY=${CHANNEL(channeltype)})
 same => n,GoSubIf($["${DEV_TECHNOLOGY}"="Local"]?s-local,1)
 same => n,GotoIf($["${TECH_DETERMINATED}"="no"]?return)
 same => n,GotoIf($["${DEV_TECHNOLOGY}"="PJSIP"]?pjsip)
 same => n(chk_dahdi),GotoIf($["${DEV_TECHNOLOGY}"="DAHDI"]?:digital)
 same => n,Set(DEV_USER=${CHANNEL(dahdi_channel)})
 same => n,Goto(build_interface)
 same => n(pjsip),NoOp(A PJSIP)
 same => n,Set(DEV_USER=${IF($["X${CHANNEL(endpoint)}X"="XX"]?${CALL_SOURCE}:${CHANNEL(endpoint)})})
 same => n,Goto(build_interface)
 same => n(digital),Set(DEV_USER=${IF($["X${CHANNEL(peername)}X"="XX"]?${CALL_SOURCE}:${CHANNEL(peername)})})
 same => n(build_interface),Set(_INTERFACE=${DEV_TECHNOLOGY}/${DEV_USER})
 same => n,Set(DEV_TREE=devices/${INTERFACE})
 same => n(return),Return()

exten => s-local,1,NoOp(Try to determianate caller technology ${CALL_SOURCE})
 same => n,Set(TECH_DETERMINATED=no)
 same => n,Set(DEV_TECHNOLOGY=${IF($["X${CHANNEL(dahdi_channel)}X"!="XX"]?DAHDI:${DEV_TECHNOLOGY})})
 same => n,Set(DEV_TECHNOLOGY=${IF($["X${DB(devices/SIP/${CALL_SOURCE}/assigned_exten)}X"!="XX"]?SIP:${DEV_TECHNOLOGY})})
 same => n,Set(DEV_TECHNOLOGY=${IF($["X${DB(devices/IAX2/${CALL_SOURCE}/assigned_exten)}X"!="XX"]?IAX2:${DEV_TECHNOLOGY})})
 same => n,Set(TECH_DETERMINATED=${IF($["${DEV_TECHNOLOGY}"!="Local"]?yes:${TECH_DETERMINATED})})
 same => n,Return()

;LOCKPHONE CHECK VER. 1.0.0
;-------------------------------------------------------------------
[sub-lockphone-check]
exten => s,1,NoOP(SUB: LOCK PHONE CHECK)
 same => n,GotoIf($["${CALL_TYPE}"="2"]?unlock)
 same => n,GotoIf($["X${CALL_SOURCE}X"="XX"]?unlock)
 same => n,GotoIf($["${CALL_ORIGIN}"="feature"]?unlock)
 same => n,GotoIf($["${EXTENSION_${CALL_SOURCE}_UNLOCKED}"="yes"]?unlock)
 same => n,GotoIf($["${DB(${TENANT}/extensions/${CALL_SOURCE}/lock)}" = "yes"]?:unlock)
 same => n,NoOP(Extension ${CALL_SOURCE} is lock)
 same => n,Set(password=REDACTED
 same => n,GotoIf($["${password}"=""]?unlock)
 same => n,Authenticate(${password})
 same => n,Set(__EXTENSION_${CALL_SOURCE}_UNLOCKED=yes)
 same => n(unlock),Return()
;END of [sub-lockphone-check]
;-------------------------------------------------------------------
;END LOCKPHONE CHECK

[sub-set-global-vars]
exten => s,1,NoOp(Setting Global Vars)
 same => n,Set(TENANT_PATH=${ARG1})
 same => n,Set(PREFIX=${IF($["${DB(${TENANT_PATH}/main)}"="no"]?${DB(${TENANT_PATH}/prefix)}:)})
 same => n,Set(__PICKUPMARK=${PREFIX}${ARG2})
 same => n,Set(__PARKINGLOT=${ARG3})
 same => n,Set(__DYNAMIC_FEATURES=${IF($["${CUSTOM_DYNAMIC_FEATURES}" = ""]?custom-features:custom-features#${CUSTOM_DYNAMIC_FEATURES})})
 same => n,Set(ICALL=no)
 same => n,Return()

[sub-set-call-vars]
exten => s,1,NoOp(Setting Call Vars)
 same => n,Set(_TENANT=${ARG1})
 same => n,Set(_CALL_DESTINATION=${ARG2})
 same => n,Set(_COS_ID=${ARG3})
 same => n,Set(_COS_NAME=${ARG4})
 same => n,Set(__TRANSFER_CONTEXT=${COS_NAME})
 same => n,Set(_ARS=${ARG5})
 same => n,Set(CDR(tenant)=${DB(${TENANT}/name)})
 same => n,Set(CDR(destination)=${CALL_DESTINATION})
 same => n,Set(CDR(trunk)=${TRUNK_ID})
 same => n,Set(CDR(did)=${DID_NUMBER})
 same => n,Set(__CALLID=${UNIQUEID})
 same => n,NoOP(Channel Type: ${CHANNEL(channeltype)})
 same => n,ExecIf($["${CHANNEL(channeltype)}"="PJSIP"]?Set(__PJSIP_CALLID=${CHANNEL(pjsip,call-id)}))
 same => n,ExecIf($[$["${LEN(${INBOUND_LANGUAGE})}"!="0"]&$["${OVER_WRITTEN_LANG}"!="TRUE"]]?Set(CHANNEL(language)=${INBOUND_LANGUAGE}))
 same => n,ExecIf($[$["${LEN(${DIVERSION_ORIGIN})}"!="0"]&$["${LEN(${INBOUND_LANGUAGE})}"="0"]&$["${OVER_WRITTEN_LANG}"!="TRUE"]]?Set(CHANNEL(language)=${DB(${TENANT}/extensions/${DIVERSION_ORIGIN}/language)}))
 same => n,Return()

exten => s-incoming,1,NoOp(Setting Incoming Call Vars)
 same => n,Set(__CALLID=${UNIQUEID})
 same => n,Set(__INCOMING_SOURCE=${ARG1})
 same => n,Set(__INCOMING_DESTINATION=${ARG2})
 same => n,Set(__INCOMING_TENANT=${ARG3})
 same => n,Set(__CALL_SOURCE=${INCOMING_SOURCE})
 same => n,Set(__CS=${INCOMING_SOURCE})
 same => n,Set(__CALL_DESTINATION=${INCOMING_DESTINATION})
 same => n,Set(__TENANT=${INCOMING_TENANT})
 same => n,Set(CDR(tenant)=${DB(${TENANT}/name)})
 same => n,Set(CDR(destination)=${CALL_DESTINATION})
 same => n,Set(CDR(trunk)=${TRUNK_ID})
 same => n,Set(CDR(did)=${DID_NUMBER})
 same => n,Set(CDR(calltype)=2)
 same => n,ExecIf($["${CHANNEL(channeltype)}"="PJSIP"]?Set(__PJSIP_CALLID=${CHANNEL(pjsip,call-id)}))
 same => n,GoSub(app-incoming,1)
 same => n,Return()

exten => app-incoming,1,NoOp(Incoming Call App CDR)
 same => n,GotoIf($["${CALL_TYPE}"="2"]?:return)
 same => n,Set(CDR(source)=${INCOMING_SOURCE})
 same => n,Set(CDR(tenant)=${DB(${INCOMING_TENANT}/name)})
 same => n,Set(CDR(destination)=${INCOMING_DESTINATION})
 same => n(return),Return()

[sub-construct-cid]
exten => s,1,NoOp(Building CID)
 same => n,Set(ORIGINAL_CID_NAME=${CALLERID(name)})
 same => n,Set(ORIGINAL_CID_NUMBER=${CALLERID(num)})
 same => n,Set(_CALL_SOURCE=${CALLERID(num)})
 same => n,Set(_CS=${CALLERID(num)})
 same => n,GotoIf($["${CID_CONSTRUCTED}"="yes"]?return)
 same => n,GoSub(sub-get-device-tree,s,1)
 same => n,GotoIf($["${DEV_TREE}"=""]?return)
 same => n,Set(_CALL_SOURCE=${IF($["X${DB(${DEV_TREE}/assigned_exten)}X"="XX"]?${CALL_SOURCE}:${DB(${DEV_TREE}/assigned_exten)})})
 same => n,Set(_CS=${CALL_SOURCE})
 same => n,Set(DYNAMIC_EXTERNAL_CID=${ODBC_EXTENSION-SETTING(dynamic_external_cid,${CALL_SOURCE},${TENANT})})
 same => n,GotoIf($[$["${DYNAMIC_EXTERNAL_CID}"="yes"]&$["${LEN(${ORIGINAL_CID_NUMBER})}"!="0"]]?cid_constructed)
 same => n,Set(EXTENSION_INTERNAL_CID=${ODBC_EXTENSION-SETTING(internal_cid,${CALL_SOURCE},${TENANT})})
 same => n,ExecIf($["${LEN(${EXTENSION_INTERNAL_CID})}"!="0"]?Set(CALLERID(all)=${EXTENSION_INTERNAL_CID}))
 same => n(cid_constructed),Set(_CID_CONSTRUCTED=yes)
 same => n(return),NoOp()
 same => n,Set(CDR(source)=${IF($["${CALL_ORIGIN}"="diversions"]?${DIVERSION_ORIGIN}:${CALL_SOURCE})})
 same => n,Return()

exten => s-external,1,NoOp(Setting External CID)
 same => n,Set(EXTENSION_NUMBER=${IF($[$["${CALL_ORIGIN}"="diversions"]&$["${LOCAL_DIRVERSION}"!="yes"]]?${DIVERSION_ORIGIN}:${CALL_SOURCE})})
 same => n,GotoIf($["${EXT_CID_CONSTRUCTED}"="yes"]?return)
 same => n,GotoIf($["${OUT_FROM_TENANT}"="yes"]?return)
 same => n,Set(EMERGENCY_CALL=${IF($["${ARG1}"="emergency"]?yes:no)})
 same => n,Set(EXTENSION_EMERGENCY_CID=)
 same => n,Set(DYNAMIC_EXTERNAL_CID=no)
 same => n,Set(EXTENSION_EMERGENCY_CID=${ODBC_EXTENSION-SETTING(emergency_cid,${EXTENSION_NUMBER},${TENANT})})
 same => n,Set(DYNAMIC_EXTERNAL_CID=${ODBC_EXTENSION-SETTING(dynamic_external_cid,${EXTENSION_NUMBER},${TENANT})})
 same => n,GotoIf($["${DYNAMIC_EXTERNAL_CID}"="yes"]?check-emergency)
 same => n,Set(EXTENSION_EXTERNAL_CID=${ODBC_EXTENSION-SETTING(external_cid,${EXTENSION_NUMBER},${TENANT})})
 same => n,ExecIf($["${ODBCSTATUS}"="SUCCESS"]?Set(CALLERID(all)=${EXTENSION_EXTERNAL_CID}))
 same => n,GotoIf($["${ODBCSTATUS}"="SUCCESS"]?:check-emergency)
 same => n,Set(TENANT_DEFAULT_EXTERNAL_CID=${DB(${TENANT}/default_external_cid)})
 same => n,ExecIf($[$["${LEN(${EXTENSION_EXTERNAL_CID})}"="0"]&$["${LEN(${TENANT_DEFAULT_EXTERNAL_CID})}"!="0"]]?Set(CALLERID(all)=${TENANT_DEFAULT_EXTERNAL_CID}))
 same => n(check-emergency),GotoIf($["${EMERGENCY_CALL}"="yes"]?:info)
 same => n,Set(EMERGENCY_CID=${EXTENSION_EMERGENCY_CID})
 same => n,Set(DEVICE_EMERGENCY_CID=${DB(${DEV_TREE}/emergency_cid)})
 same => n,ExecIf($["${LEN(${DEVICE_EMERGENCY_CID})}"!="0"]?Set(EMERGENCY_CID=${DEVICE_EMERGENCY_CID}))
 same => n,Set(DISPATCHABLE_LOCATION=${DB(${DEV_TREE}/location)})
 same => n,GotoIf($["${LEN(${DISPATCHABLE_LOCATION})}"="0"]?get-default-location)
 same => n,Set(ARRAY(LOC_CID_NAME,LOC_CID_NUMBER)=${GET_EMERGENCY-CID(${DISPATCHABLE_LOCATION},${TENANT})})
 same => n,Goto(setup-disp-loc)
 same => n(get-default-location),NoOp(Read the default emergency location)
 same => n,Set(ARRAY(LOC_CID_NAME,LOC_CID_NUMBER)=${GET_DEFAULT-EMERGENCY-CID(${TENANT})})
 same => n(setup-disp-loc),NoOp(Setting up the CID from the Dispatchable Locations)
 same => n,ExecIf($[$["${LEN(${LOC_CID_NAME})}"!="0"]&$["${LEN(${LOC_CID_NUMBER})}"!="0"]]?Set(DISPATCHABLE_LOCATION_CID="${LOC_CID_NAME}" <${LOC_CID_NUMBER}>))
 same => n,ExecIf($[$["${LEN(${DEVICE_EMERGENCY_CID})}"="0"]&$["${LEN(${DISPATCHABLE_LOCATION_CID})}"!="0"]]?Set(EMERGENCY_CID=${DISPATCHABLE_LOCATION_CID}))
 same => n,Set(CALLERID(all)=${EMERGENCY_CID})
 same => n(info),NoOp(CID Name: ${CALLERID(name)}, CID Number: ${CALLERID(num)})
 same => n,Set(SEND_CID=${ODBC_EXTENSION-SETTING(sendcid,${EXTENSION_NUMBER},${TENANT})})
 same => n,ExecIf($[$[$["${SEND_CID}"="no"]|$["${FORCE_HIDE_CID}"="yes"]]&$["${EMERGENCY_CALL}"="no"]]?Set(CALLERID(name-pres)=prohib_passed_screen))
 same => n,ExecIf($[$[$["${SEND_CID}"="no"]|$["${FORCE_HIDE_CID}"="yes"]]&$["${EMERGENCY_CALL}"="no"]]?Set(CALLERID(num-pres)=prohib_passed_screen))
 same => n,Set(__EXT_CID_CONSTRUCTED=yes)
 same => n(return),ExecIf($["${HOT_DESK_CALL}"!="yes"]?Set(CDR(source)=${EXTENSION_NUMBER}))
 same => n,Return()

exten => s-incoming,1,NoOp(Setting Incoming CID)
 same => n,GotoIf($["X${CALLERID(num)}X"="XX"]?return)
 same => n,Set(_CALL_SOURCE=${CALLERID(num)})
 same => n,Set(_CS=${CALLERID(num)})
 same => n,Set(CDR(source)=${CALLERID(num)})
 same => n,Set(__CID_CONSTRUCTED=yes)
 same => n(return),Return()

[sub-local-dialing]
exten => s,1,NoOP(Trying to determine if is a local extension)
 same => n,GotoIf(${DB_EXISTS(${TENANT}/extensions/${CALL_DESTINATION}/dial)}?:return)
 same => n,Set(EXTENSION_TO_DIAL=${FILTER(0-9+*#,${CALL_DESTINATION})})
 same => n,Goto(${EXTENSION_TO_DIAL},1)
 same => n(return),Return()

exten => _[*#0-9]!,1,NoOp(Dialing Local Extension)
 same => n,ExecIf($["${DISABLE_CDR}"="yes"]?NoCDR())
 same => n,GoSub(sub-setup-call-type,s,1(internal))
 same => n,Set(_DESTINATION_STATE=${EXTENSION_STATE(${EXTEN}@${HINTS_CONTEXT})})
 same => n,Set(_DESTINATION_NUMBER=${EXTEN})
 same => n,Set(_DESTINATION_COS_NAME=${DB(${TENANT}/extensions/${CALL_DESTINATION}/context)})
 same => n,GoSub(sub-check-cos-privacy,s,1(${DESTINATION_COS_NAME},${COS_ID},${COS_NAME}))
 same => n,Set(DIAL_STRING=${DB(${TENANT}/extensions/${CALL_DESTINATION}/dial)})
 same => n,Set(DB(${TENANT}/LASTCALLER/${EXTEN})=${IF($["${CALL_TYPE}"="2"]?${INCOMING_SOURCE}:${CALL_SOURCE})})
 same => n,Set(IGNORE_DIVERSIONS=${IF($["${CALL_ORIGIN}"="diversions"]?yes:${IGNORE_DIVERSIONS})})
 same => n,Set(QUEUE_CALL=${IF($["${BLINDTRANSFER}"=""]?${QUEUE_CALL}:FALSE)})
 same => n,GoSubIf($["${QUEUE_CALL}"="TRUE"]?sub-queue-members,s,1)
 same => n,GoSubIf($[$["${IGNORE_DIVERSIONS}"="yes"]&$["${BLINDTRANSFER}"=""]]?:sub-check-diversions,s,1(predialing))
 same => n,GotoIf($["${DIAL_STRING}"=""]?post-dial)
 same => n,Gosub(sub-crm-setup,s,1(${EXTEN},${CALL_SOURCE}))
 same => n,Gosub(parse-dial-string,s,1)
 same => n,NoOp(Configuring Dial Settings)
 same => n,Set(RING_TIME=${DB(${TENANT}/extensions/${CALL_DESTINATION}/ringtimer)})
 same => n,Set(RING_TIME=${IF($["XXX${RING_TIME}"="XXX"]?${RINGTIMEDEF}:${RING_TIME})})
 same => n,Set(RING_TIME=${IF($["XXX${O_RING_TIME}"="XXX"]?${RING_TIME}:${O_RING_TIME})})
 same => n,Set(RING_TIME=${IF($[$["XXX${RG_RINGTIME}"="XXX"]|$["${BLINDTRANSFER}"!=""]]?${RING_TIME}:${RG_RINGTIME})})
 same => n,Set(DIAL_OPTIONS=${DB(${TENANT}/extensions/${CALL_DESTINATION}/dial_options)})
 same => n,Set(DIAL_OPTIONS=${IF($["XXX${DIAL_OPTIONS}"="XXX"]?${DIALOPTIONS}:${DIAL_OPTIONS})})
 same => n,GotoIf($[$["${CALL_ORIGIN}"="feature"]|$["${CALL_ORIGIN}"="paging"]]?:answermode)
 same => n,GotoIf($["${QUEUE_CALL}"="TRUE"]?:answermode)
 same => n,Set(DIAL_OPTIONS=${STRREPLACE(DIAL_OPTIONS,an(1)p,,1)})
 same => n,Set(DIAL_OPTIONS=${STRREPLACE(DIAL_OPTIONS,aP,,1)})
 same => n(answermode),Set(ANSWER_MODE=${ODBC_EXTENSION-SETTING(answermode,${CALL_DESTINATION},${TENANT})})
 same => n,Set(ANSWER_MODE=${IF($["${CALL_ORIGIN}"="paging"]?intercom:${ANSWER_MODE})})
 same => n,GotoIf($["${SKIP_AA}"="TRUE"]?check-hd)
 same => n,ExecIf($[$[$[$["${ANSWER_MODE}"="intercom"]&$["${CALL_TYPE}"="1"]]|$["${FORCE_INTERCOM}"="yes"]]&$[$["${DESTINATION_STATE}"="NOT_INUSE"]&$["${DB(${TENANT}/diversions/${CALL_DESTINATION}/FWM/enable)}"="no"]]]?Set(EXEC_AA=yes)) ;Flag for Auto-Answer
 same => n,ExecIf($[$["${FORCE_INTERCOM}"="yes"]&$["${DESTINATION_STATE}"="NOT_INUSE"]]?Set(EXEC_AA=yes)) ; Force Auto-Answer when using the paging module or the paging feature.
 same => n(check-hd),Set(IS_HOT_DESK=${DB(${TENANT}/extensions/${CALL_DESTINATION}/hotdesking)})
 same => n,Set(MOH_CLASS=${DB(${TENANT}/extensions/${CALL_DESTINATION}/moh)})
 same => n,GosubIf($["${IS_HOT_DESK}"="yes"]?sub-set-moh,s,1(${MOH_CLASS}):moh,1)
 same => n,GotoIf($[$[$["${DESTINATION_STATE}"="INUSE"]|$["${DESTINATION_STATE}"="BUSY"]]&$["${DB(${TENANT}/extensions/${CALL_DESTINATION}/call_waiting)}"="no"]]?busy-here)
 same => n,Set(FORCE_RECORDING=${IF($["${APP_RECORDING}"="yes"]?yes:no)}) ;Force recordings by apps like: Queues, Ring Groups, Conferences, Paging, etc
 same => n,Set(DIAL_OPTIONS=${IF($[$[$["${DESTINATION_STATE}"="INUSE"]|$["${DESTINATION_STATE}"="BUSY"]]&$["${PLAY_CW_TONE}"="yes"]]?${STRREPLACE(DIAL_OPTIONS,r,r(callwaiting),1)}:${DIAL_OPTIONS})})
 same => n,Set(DIAL_OPTIONS=${DIAL_OPTIONS}b(sub-before-connecting-call^s^1(${TENANT}^${CALL_SOURCE}^${EXTEN}^${EXEC_AA}^${CUSTOM-ALERT-INFO})))
 same => n,Set(DIAL_OPTIONS=${DIAL_OPTIONS}U(sub-before-bridging-call^${TENANT}^${CALL_SOURCE}^${EXTEN}^${FORCE_RECORDING}))
 same => n,Set(__TRANSFERED_CALL=TRUE)
 same => n,NoOP(Enable Follow-Me Ring Time If needed)
 same => n,GotoIf($[$[$["${DB(${TENANT}/diversions/${CALL_DESTINATION}/FWM/enable)}"="yes"]&$["${IGNORE_DIVERSIONS}"!="yes"]]|$[$["${LEN(${BLINDTRANSFER})}"!="0"]&$["${DB(${TENANT}/diversions/${CALL_DESTINATION}/FWM/enable)}"="yes"]]]?:check-rt)
 same => n,GotoIf($["${DB(${TENANT}/diversions/${CALL_DESTINATION}/FWM/time_group)}"!=""]?:set-fw-rt)
 same => n,Set(FWM_TG=${DB(${TENANT}/diversions/${CALL_DESTINATION}/FWM/time_group)})
 same => n,Gosub(${FWM_TG},s,1)
 same => n,GotoIf($[${TGMATCH}=1]?:check-rt)
 same => n(set-fw-rt),NoOP(Using Follow-me Ring Time)
 same => n,Set(RING_TIME=${DB(${TENANT}/extensions/${CALL_DESTINATION}/followme/ringtime)})
 same => n(check-rt),GotoIf($["${RING_TIME}"="0"]?post-dial)
 same => n,GotoIf($[$["${SKIP_BUSY}"="yes"]&$["${DESTINATION_STATE}"!="NOT_INUSE"]]?end_call)
 same => n,Gosub(sub-udpate-virtual-dev-state,s,1(${CALL_DESTINATION},BUSY))
 same => n,Gosub(sub-setup-callrec-name,s,1)
 same => n,Dial(${DIAL_STRING},${RING_TIME},${DIAL_OPTIONS})
 same => n(post-dial),Set(_CALL_STATUS=${DIALSTATUS})
 same => n,Set(_CALL_STATUS=${IF($[$["${DESTINATION_STATE}"="BUSY"]|$["${DESTINATION_STATE}"="INUSE"]]?BUSY:${CALL_STATUS})})
 same => n,Gosub(sub-udpate-virtual-dev-state,s,1(${CALL_DESTINATION},NOT_INUSE))
 same => n,Goto(check-post-diversions)
 same => n(busy-here),Set(_CALL_STATUS=BUSY)
 same => n(check-post-diversions),GoSubIf($[$["${IGNORE_DIVERSIONS}"="yes"]&$["${BLINDTRANSFER}"=""]]?:sub-check-diversions,s,1(postdialing))
 same => n,GosubIf($["${BLINDTRANSFER}"!=""]?blind-transfer-callback,s,1(${CALL_STATUS}))
 same => n,Gosub(sub-notify-missed-call,s,1(${TENANT},${CALL_DESTINATION},${CALL_STATUS},${CALLERID(num)},${CALLERID(name)},${CALL_TYPE},${PBX_APP},${PBX_APP_DESC}))
 same => n,Set(MISSED_CALL_NOTIFIED=TRUE)
 same => n,GotoIf($["${QUEUE_CALL}"="TRUE"]?end_call)
 same => n,GotoIf($[$[$["${SKIP_CONTACT_SERVICES}"="TRUE"]&$["${BLINDTRANSFER}"=""]]&$["${LEN(${PARKER})}"="0"]]?end_call)
 same => n,GotoIf($[$[$["${NO_POST_SERVICES}"="TRUE"]&$["${BLINDTRANSFER}"=""]]&$["${LEN(${PARKER})}"="0"]]?end_call)
 same => n,GoSub(sub-leave-vm,s,1)
 same => n,GoSubIf($["${FEATURE_SERVICE}"!="call_completion"]?sub-request-cc,s,1)
 same => n(end_call),ExecIf($["${CALL_STATUS}"="BUSY"]?Busy(5))
 same => n,Hangup()

exten => set_dial,1,NoOp(Set Dial options)
 same => n,Set(CHANNEL(namedcallgroup)=${DB(${TENANT}/extensions/${DESTINATION_NUMBER}/callgroup)})
 same => n,GotoIf($[${EXISTS(${hotdesk_moh})}]?:end)
 same => n,Set(CHANNEL(musicclass)=${hotdesk_moh})
 same => n(end),Return()

exten => moh,1,NoOp(Set Music on Hold)
 same => n,GotoIf($[${DB_EXISTS(${TENANT}/queues/${QUEUE_NUMBER}/moh)}]?:return)
 same => n,ExecIf($[$["${DB(${TENANT}/queues/${QUEUE_NUMBER}/moh)}"!=""]&$["${FORCE_QUEUE_MOH}"="yes"]]?Set(CHANNEL(musicclass)=${DB(${TENANT}/queues/${QUEUE_NUMBER}/moh)}))
 same => n(return),Return()

exten => h,1,NoOp(Finishing the call)
 same => n,System(test -e ${REC_FILENAME})
 same => n,ExecIf($["${SYSTEMSTATUS}"="SUCCESS"]?Set(CDR(recfile)=${REC_FILENAME}))
 same => n,Gosub(sub-udpate-virtual-dev-state,s,1(${CALL_DESTINATION},NOT_INUSE))
 same => n,GoSubIf($["${DYNROUTING}"="yes"]?dynamic-routing-connected,s,1(${DIALSTATUS},${CALL_SOURCE}))
 same => n,GotoIf($["${MISSED_CALL_NOTIFIED}"="TRUE"]?check-if-qc)
 same => n,Gosub(sub-notify-missed-call,s,1(${TENANT},${CALL_DESTINATION},${DIALSTATUS},${CALLERID(num)},${CALLERID(name)},${CALL_TYPE},${PBX_APP},${PBX_APP_DESC}))
 same => n(check-if-qc),GotoIf($[$["${QUEUE_CALL}"="TRUE"]&$["${DIALSTATUS}"!="ANSWER"]]?call_ended)
 same => n,Gosub(sub-log-crm-call,s,1)
 same => n,GoSubIf($["${FEATURE_SERVICE}"="wake_up"]?wake-up-no-answered,s,1)
 same => n,Gosub(sub-call-completion-check,s,1)
 same => n(call_ended),NoOp(Call ended)
 same => n,Gosub(notify-call-hangup,s,1)
 same => n,GosubIf($[${DIALPLAN_EXISTS(${TENANT_PREFIX}end-ext-dialing-hook,s,1)}=1]?${TENANT_PREFIX}end-ext-dialing-hook,s,1)
 same => n,Hangup()

[sub-notify-missed-call]
 exten => s,1,NoOP(Check if call is missed and need to be notified)
  same => n,Set(TENANT=${ARG1})
  same => n,Set(CALLEE_NUM=${ARG2})
  same => n,Set(STATUS=${ARG3})
  same => n,Set(CALLER_NUM=${ARG4})
  same => n,Set(CALLER_NAME=${ARG5})
  same => n,Set(CALL_DIR=${ARG6})
  same => n,Set(DP_APP=${ARG7})
  same => n,Set(DP_APP_DESC=${ARG8})
  same => n,Set(NOTIFY_MISSED_CALLS=${DB(${TENANT}/extensions/${EXT_NUM}/notify_missed_calls)})
  same => n,GotoIf($["${NOTIFY_MISSED_CALLS}"!="yes"]?last_stage)
  same => n,Set(IS_VM_ENABLED=${DB(${TENANT}/extensions/${CALLEE_NUM}/vmenabled)})
  same => n,GotoIf($[$[$["${CALL_DIR}"="2"]|$["${CALL_DIR}"="1"]]&$["${IS_VM_ENABLED}"!="yes"]&$["${STATUS}"!="ANSWER"]]?notify_missed_call)
