 same => n,Set(HAS_VIRTUAL_DEVICES=${DB(${TENANT}/extensions/${EXT_NUM}/virtual_devices)})
 same => n,GotoIf($["${HAS_VIRTUAL_DEVICES}"!="yes"]?no_rows)
 same => n,Set(ODBC_ID=${GET_VIRTUAL-DEVICES(${EXT_NUM},${TENANT})})
 same => n,GotoIf($[${ODBCROWS} < 1]?no_rows)
 same => n,Set(COUNTER=1)
 same => n,While($[${COUNTER}<=${ODBCROWS}])
 same => n,Set(VDevice=${ODBC_FETCH(${ODBC_ID})})
 same => n,Set(DEVICE_STATE(Custom:VirtualDev${VDevice})=${NEW_STATUS})
 same => n,Set(COUNTER=$[${COUNTER} + 1])
 same => n,EndWhile()
 same => n,ODBCFinish()
 same => n(no_rows),Return()

