exten => s,1,NoOp(SUB: PERSONAL ASSISTANT ENABLED/DISABLED)
 same => n,Answer
 same => n,Wait(1)
 same => n,System(test -e ${ASTSPOOLDIR}/${TENANT}/pa/${CALL_SOURCE}/pamsg.wav)
 same => n,Noop(${SYSTEMSTATUS})
 same => n,GotoIf($["${SYSTEMSTATUS}" = "SUCCESS"]?:recording_no_exist)
 same => n,GotoIf($["${DB(${TENANT}/diversions/${CALL_SOURCE}/PEA/enable)}"="yes"]?disable_pea)
 same => n,Set(DB(${TENANT}/diversions/${CALL_SOURCE}/PEA/enable)=yes)
 same => n,Set(DB(${TENANT}/diversions/${CALL_SOURCE}/has_enable_diversions)=yes)
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}PEA_${CALL_SOURCE})=BUSY)
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer "enable-PEA" "${TENANT}" "${CALL_SOURCE}")
 same => n,Playback(vpbx/vital-personal-assistant&activated)
 same => n,Hangup()
 same => n(disable_pea),Set(DB(${TENANT}/diversions/${CALL_SOURCE}/PEA/enable)=no)
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}PEA_${CALL_SOURCE})=NOT_INUSE)
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer "disable-PEA" "${TENANT}" "${CALL_SOURCE}")
 same => n,Gosub(sub-cf-checkall,s,1)
 same => n,Playback(vpbx/vital-personal-assistant&de-activated)
 same => n,Hangup()
 same => n(recording_no_exist),Noop( FILE NOT PRESENT ${SYSTEMSTATUS})
 same => n,Playback(vpbx/vital-personal-assistant-no-recording)
 same => n,Hangup()

;------------------------------------------------------------------
[sub-personal-assistant-rec-msg]
exten => s,1,NoOp(SUB: PERSONAL ASSISTANT RECORD MESSAGE)
 same => n,Answer
 same => n,Wait(1)
 same => n,Set(RecordedFilename=pamsg)
 same => n,Set(RandomNumber=${RAND()})
 same => n(record),Playback(vpbx/vital-personal-assistant-rec-message&astcc-followed-by-the-pound-key)
 same => n,Wait(1)
 same => n,Record(${ASTSPOOLDIR}/${TENANT}/pa/${CALL_SOURCE}/temporaryRecording-${RandomNumber}.wav)
 same => n(handle_recording),Read(ActionItem,vm-review,1)
 same => n,GotoIf($['${ActionItem}' = '1' | '${ActionItem}' = '2' |  '${ActionItem}' = '3']?valid_action)
 same => n,Playback(wrong-try-again-smarty)
 same => n,Goto(handle_recording)
 same => n(valid_action),NoOp()
 same => n,GotoIf($['${ActionItem}' = '1']?accept,1) ; keep this recording
 same => n,GotoIf($['${ActionItem}' = '3']?record)   ; re-record it
 same => n,Playback(${ASTSPOOLDIR}/${TENANT}/pa/${CALL_SOURCE}/temporaryRecording-${RandomNumber})
 same => n,Goto(handle_recording)

exten => accept,1,Verbose(2,Recording accepted!)
 same => n,System(mkdir -p ${ASTSPOOLDIR}/${TENANT}/pa/${CALL_SOURCE})
 same => n,System(mv ${ASTSPOOLDIR}/${TENANT}/pa/${CALL_SOURCE}/temporaryRecording-${RandomNumber}.wav ${ASTSPOOLDIR}/${TENANT}/pa/${CALL_SOURCE}/${RecordedFilename}.wav)
 same => n,Playback(vm-message&recorded)

exten => h,1,Verbose(2,Cleanup tmp recording if recording wasn't finished)
 same => n,System(test -e ${ASTSPOOLDIR}/${TENANT}/pa/${CALL_SOURCE}/temporaryRecording-${RandomNumber}.wav)
 same => n,GotoIf($["${SYSTEMSTATUS}" = "SUCCESS"]?:no_recodring)
 same => n,System(rm -f ${ASTSPOOLDIR}/${TENANT}/pa/${CALL_SOURCE}/temporaryRecording-${RandomNumber}.wav)
 same => n(no_recodring),hangup();

