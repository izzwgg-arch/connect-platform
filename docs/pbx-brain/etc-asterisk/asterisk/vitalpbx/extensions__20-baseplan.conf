 same => n(read_did),Read(REMINDER_DID,vpbx/vital-reminder)
 same => n,GotoIf($["${REMINDER_DID}"=""]?read_did)

 same => n(confirm_did),Playback(you-entered)
 same => n,SayDigits(${REMINDER_DID})
 same => n,Read(RESPONSE,if-this-is-correct&press-1&otherwise&press-2,1)
 same => n,GotoIf($["${RESPONSE}"="1"]?read_year)
 same => n,GotoIf($["${RESPONSE}"="2"]?read_did)
 same => n,Goto(confirm_did)

 same => n(read_year),Read(REMINDER_YEAR,please-enter-the&digits/4&digit&year&or&press-1&for&digits/today&followed_pound,4)
 same => n,GotoIf($["${REMINDER_YEAR}"="1"]?set_today)
 same => n,GotoIf($[${LEN(${REMINDER_YEAR})}=4]?read_day)
 same => n,Goto(read_year)

 same => n(read_day),Read(REMINDER_DATE,please-enter-the&digits/2&digit&month&and&digits/2&digit&day,4)
 same => n,GotoIf($[${LEN(${REMINDER_DATE})}=4]?read_time)
 same => n,Goto(read_day)

 same => n(read_time),Read(REMINDER_TIME,enter-a-time,4)
 same => n,GotoIf($[${LEN(${REMINDER_TIME})}=4]?parse_datetime)
 same => n,Goto(read_time)

 same => n(parse_datetime),Set(REMINDER_UNIX=${STRPTIME(${REMINDER_YEAR}-${REMINDER_DATE:0:2}-${REMINDER_DATE:2:2} ${REMINDER_TIME},,%Y-%m-%d %H%M)})
 same => n(confirm_datetime),Playback(you-entered)
 same => n,SayUnixTime(${REMINDER_UNIX})
 same => n,Read(RESPONSE,if-this-is-correct&press-1&otherwise&press-2,1)
 same => n,GotoIf($["${RESPONSE}"="1"]?record)
 same => n,GotoIf($["${RESPONSE}"="2"]?read_year)
 same => n,Goto(confirm_datetime)

 same => n(record),Playback(vm-rec-temp)
 same => n,Record(/var/spool/asterisk/tmp/reminder-${UNIQUEID}.wav,5,120)
 same => n(confirm_recording),Read(RESPONSE,to-accept-recording&press-1&otherwise&press-2,1)
 same => n,GotoIf($["${RESPONSE}"="1"]?done)
 same => n,GotoIf($["${RESPONSE}"="2"]?record)
 same => n,Goto(confirm_recording)

 same => n(done),System(/usr/share/vitalpbx/scripts/synchronizer reminder "${TENANT}" "${REMINDER_FILENAME}" "${REMINDER_DID}" "${REMINDER_UNIX}")
 same => n,Playback(num-was-successfully&added&goodbye)
 same => n,Return()

 same => n(set_today),Set(REMINDER_TODAY=${STRFTIME($[${EPOCH}],,%Y%m%d)})
 same => n,Set(REMINDER_YEAR=${REMINDER_TODAY:0:4})
 same => n,Set(REMINDER_DATE=${REMINDER_TODAY:4:4})
 same => n,Goto(read_time)

exten => h,1,System(rm -f "${REMINDER_FILENAME}")
 same => n,Return()

;-------------------------------------------------------------------
;END REMINDER

