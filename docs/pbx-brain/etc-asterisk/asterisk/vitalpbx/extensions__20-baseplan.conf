; It proccess SIP Messages
; Modified by EINM to match the header "To" with format pjsip:"1234" <sip:1234@pbx.example.com>
[messages]
exten => _[-+*#0-9a-zA-Z].,1,NoOp(Processing Message...)
 same => n,Answer()
 same => n,NoOp(To: ${MESSAGE(to)})
 same => n,NoOp(From: ${MESSAGE(from)})
 same => n,NoOp(Body: ${MESSAGE(body)})
 same => n,GotoIf($["X${CUT(MESSAGE(to),<,2)}X"="XX"]?noname)
 same => n,Set(SMS_NUM=${CUT(MESSAGE(to),<,2)})
 same => n,Set(SMS_NUM=${CUT(SMS_NUM,>,1)})
 same => n,Set(SMS_TECH=${CUT(SMS_NUM,:,1)})
 same => n,Set(SMS_REAL_TECH=${CUT(MESSAGE(to),:,1)})
 same => n,GotoIf($["${SMS_TECH}"="${SMS_REAL_TECH}"]?noname)
 same => n,Set(MESSAGE(to)=${STRREPLACE(SMS_NUM,${SMS_TECH},${SMS_REAL_TECH})})
 same => n(noname),Set(SMS_TO=${CUT(MESSAGE(to),@,1)})
 same => n,Set(DEST_SERVER=${CUT(MESSAGE(to),@,2)})
 same => n,Set(FROM_TECHNOLOGY=${CUT(SMS_TO,:,1)})
 same => n,Set(SMS_TO=${CUT(SMS_TO,:,2)})
 same => n,Set(MESSAGE(to)=sip:${SMS_TO}@${DEST_SERVER})
 same => n,Set(FROM=${CUT(MESSAGE(from),<,2)})
 same => n,Set(ACTUALFROM=${CUT(FROM,@,1)})
 same => n,Set(FROM_TECHNOLOGY=${TOUPPER(${FROM_TECHNOLOGY})})
 same => n,Set(DEVICE=${CUT(ACTUALFROM,:,2)})
 same => n,NoOp(devices/${FROM_TECHNOLOGY}/${DEVICE}/assigned_exten)
 same => n,Set(EXTENSION=${DB(devices/${FROM_TECHNOLOGY}/${DEVICE}/assigned_exten)})
 same => n,Set(TENANT=${DB(devices/${FROM_TECHNOLOGY}/${DEVICE}/tenant)})
 same => n,Set(SMS_FROM=${MESSAGE(from)})
 same => n,Set(SMS_FROM=${STRREPLACE(SMS_FROM,${DEVICE},${EXTENSION})})
 same => n,Set(DIAL_STRING=${DB(${TENANT}/extensions/${SMS_TO}/dial)})
 same => n,GotoIf($[$["${DIAL_STRING}"=""]&$[${LEN(${SMS_TO})}>=10]]?:regular-destination)
 same => n,Set(SMS_BODY_ENC=${URIENCODE(${MESSAGE(body)})})
 same => n,Set(SCRIPT_RESPONSE=${SHELL(/usr/share/vitalpbx/scripts/SIPMessageToSMS "${TENANT}" "${EXTENSION}" "${SMS_TO}" "${SMS_BODY_ENC}")})
 same => n,Set(SCRIPT_STATUS=${CUT(SCRIPT_RESPONSE,|,1)})
 same => n,Set(SCRIPT_MSG=${CUT(SCRIPT_RESPONSE,|,2)})
 same => n,NoOP(${SCRIPT_STATUS}: ${SCRIPT_MSG})
 same => n,GotoIf($["${SCRIPT_STATUS}"="ERROR"]?sendfailedmsg)
 same => n,Hangup()
 same => n(regular-destination),GotoIf($["${DIAL_STRING}"=""]?sendfailedmsg)
 same => n,Set(COUNTER=1)
 same => n,Set(CURRENT_DEVICE=${CUT(DIAL_STRING,&,${COUNTER})})
 same => n,While($[${EXISTS(${CURRENT_DEVICE})}])
 same => n,Set(TECHNOLOGY=${CUT(CURRENT_DEVICE,/,1)})
 same => n,Set(USER=${CUT(CURRENT_DEVICE,/,2)})
 same => n,GotoIf($[$["${TECHNOLOGY}"="IAX2"]|$["${TECHNOLOGY}"="DAHDI"]]?next)
 same => n,GotoIf($["${TECHNOLOGY}"="PJSIP"]?:sip)
 same => n,NoOP(Sending messages to PJSIP Contacts)
 same => n,Set(DEV_CONTACTS=${PJSIP_DIAL_CONTACTS(${USER})})
 same => n,While($["${SET(CURRENT_DEV_CONTACT=${SHIFT(DEV_CONTACTS,&):6})}" != ""])
 same => n,MessageSend(pjsip:${CURRENT_DEV_CONTACT},${SMS_FROM})
 same => n,NoOp(SMS Status to ${CURRENT_DEV_CONTACT}: ${MESSAGE_SEND_STATUS})
 same => n,EndWhile()
 same => n,Goto(next)
 same => n(sip),MessageSend(${TOLOWER(${TECHNOLOGY})}:${USER},${SMS_FROM})
 same => n,NoOp(SMS Status to ${CURRENT_DEVICE}: ${MESSAGE_SEND_STATUS})
 same => n(next),Set(COUNTER=$[${COUNTER} + 1])
 same => n,Set(CURRENT_DEVICE=${CUT(DIAL_STRING,&,${COUNTER})})
 same => n,EndWhile()
 same => n(failed),Goto(h,1)

  ; Handle failed messaging
 exten => _[-+*#0-9a-zA-Z].,n(sendfailedmsg),Set(MESSAGE(body)=The message to number ${EXTEN} has failed.)
  same => n,MessageSend(${TOLOWER(${FROM_TECHNOLOGY})}:${DEVICE},"${SMS_TO}" <sip:${SMS_TO}@${DEST_SERVER}>)
  same => n,NoOp(SMS Status: ${MESSAGE_SEND_STATUS})
  same => n,Goto(h,1)

 exten => h,1,NoOP(End Sending Messages)
  same => n,Hangup()
  
