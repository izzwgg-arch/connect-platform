[send-mobile-push]
exten => s,1,NoOP(Sending push notifications for mobile devices)
 same => n,Set(DEVICE=${ARG1})
 same => n,Set(TECH=${ARG2})
 same => n,Set(MAX_TRIES=10)
 same => n,Set(TRY=1)
 same => n,Set(DEVICE_STATUS=${DEVICE_STATE(${TECH}/${DEVICE})})
 same => n,GotoIf($["${DEVICE_STATUS}"!="UNAVAILABLE"]?dial)
 same => n,System(/usr/share/vitalpbx/scripts/push_notifications "${TECH}/${DEVICE}" "Call From VitalPBX" "VitalPBX LLC")
 same => n(loop),GotoIf($[${TRY} > ${MAX_TRIES}]?end)
 same => n,Set(DEVICE_STATUS=${DEVICE_STATE(${TECH}/${DEVICE})})
 same => n,NoOP(Try: ${TRY}, Device Status: ${DEVICE_STATUS})
 same => n,GotoIf($["${DEVICE_STATUS}"!="UNAVAILABLE"]?dial)
 same => n,Wait(2)
 same => n,Set(TRY=$[${TRY}+1])
 same => n,Goto(loop)
 same => n(dial),NoOP(Dialing the device)
 same => n,Set(DIALING_STRING=${TECH}/${DEVICE})
 same => n,GotoIf($["${TECH}"="PJSIP"]?:do-dial)
 same => n,Set(DIALING_STRING=${PJSIP_DIAL_CONTACTS(${DEVICE})})
 same => n(do-dial),Dial(${DIALING_STRING})
 same => n(end),Hangup()

