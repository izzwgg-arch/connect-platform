 same => n,GotoIf($[$["${CALLERID(num)}"="Anonymous"]|$["${CALLERID(num)}"="anonymous"]]?end)
 same => n,GotoIf($[$["${CALLERID(num)}"="+Anonymous"]|$["${CALLERID(num)}"="+anonymous"]]?end)
 same => n,GotoIf($[$["${CALLERID(num)}"="Unknown"]|$["${CALLERID(num)}"="unknown"]]?end)
 same => n,GotoIf($[$["${CALLERID(num)}"="Private"]|$["${CALLERID(num)}"="private"]]?end)
 same => n,GotoIf($[$["${CALLERID(num)}"="Restricted"]|$["${CALLERID(num)}"="restricted"]]?end)
 same => n,Return()
 same => n(empty),NoOp(Droping call with empty CID)
 same => n,Goto(h-call)
 same => n(end),NoOp(Droping call with CID ${CALLERID(num)})
 same => n(h-call),Hangup(603)

