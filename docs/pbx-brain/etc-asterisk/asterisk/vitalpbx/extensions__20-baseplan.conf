[blind-transfer-callback]
 exten => s,1,NoOP(Checking Blind Transfer CallBack...)
  same => n,GotoIf($[$[$["${CALL_STATUS}"="ANSWER"]|$["${CALL_STATUS}"="CANCEL"]]|$["${FROM_BXF_CB}"="yes"]]?end)
  same => n,Set(BLIND_TRANSFER_TECH=${CUT(BLINDTRANSFER,/,1)})
  same => n,Set(BLIND_TRANSFER_DEVICE=${CUT(BLINDTRANSFER,/,2)})
  same => n,Set(BLIND_TRANSFER_DEVICE_LENGTH=${LEN(${BLIND_TRANSFER_DEVICE})})
  same => n,Set(BLIND_TRANSFER_DEVICE_BASE_LENGTH=${MATH(${BLIND_TRANSFER_DEVICE_LENGTH}-9,i)})
  same => n,Set(BLIND_TRANSFER_DEVICE_CLEAN=${BLIND_TRANSFER_DEVICE:0:${BLIND_TRANSFER_DEVICE_BASE_LENGTH}})
  same => n,Set(BLIND_TRANSFER_EXTENSION=${DB(devices/${BLIND_TRANSFER_TECH}/${BLIND_TRANSFER_DEVICE_CLEAN}/assigned_exten)})
  same => n,GotoIf($["${BLIND_TRANSFER_EXTENSION}"=""]?end)
  same => n,Set(BLIND_TRANSFER_CALLBACK_ENABLED=${ODBC_EXTENSION-SETTING(callback_on_busy_transfer,${BLIND_TRANSFER_EXTENSION},${TENANT})})
  same => n,GotoIf($["${BLIND_TRANSFER_CALLBACK_ENABLED}"!="yes"]?end)
  same => n,Set(_FROM_BXF_CB=yes)
  same => n,ForkCDR(er)
  same => n,Wait(1.2)
  same => n,Dial(Local/${BLIND_TRANSFER_EXTENSION}@${TRANSFER_CONTEXT}/n)
  same => n,Hangup()
  same => n(end),Return()