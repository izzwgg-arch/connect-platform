[sub-call-back]
exten => s,1,NoOp(FEATURE: CALL BACK)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Set(numbertodial=${DB(${TENANT}/callbacks/${ARG1}/dialnumber)})
 same => n,GotoIf($["${numbertodial}" = ""]?:skipcallerid)
 same => n,Set(numbertodial=${CALL_SOURCE})
 same => n(skipcallerid),Set(context=${DB(${TENANT}/callbacks/${ARG1}/cos)})
 same => n,Set(destination=${DB(${TENANT}/callbacks/${ARG1}/destination)})
 same => n,Set(dialprefix=${DB(${TENANT}/callbacks/${ARG1}/dialprefix)})
 same => n,Set(delay=${DB(${TENANT}/callbacks/${ARG1}/delay)})
 same => n,ExecIf($["${delay}"=""]?Set(delay=0))
 same => n,Set(time_p=${STRFTIME($[${EPOCH}+${delay}] ,,%Y%m%d%H%M.%S)})
 same => n,System(echo "Channel: Local/${dialprefix}${numbertodial}@${context} \nMaxRetries: 3 \nRetryTime: 30 \nWaitTime: 30 \nCallerid: "CALL BACK" <${CALL_DESTINATION}> \nExtension: ${CUT(destination,\,,2)} \nContext: ${context} \nPriority: 1 \nSetvar: Language=${CHANNEL(language)} \nSetvar: IGNORE_DIVERSIONS=yes \nSetvar: CALL_ORIGIN=feature \nSetvar: FEATURE_SERVICE=call_back" > ${ASTSPOOLDIR}/${UNIQUEID}.call)
 same => n,System(touch -t ${time_p} ${ASTSPOOLDIR}/${UNIQUEID}.call)
 same => n,Hangup()

exten => h,1,System(mv ${ASTSPOOLDIR}/${UNIQUEID}.call ${ASTSPOOLDIR}/outgoing/${time_p}.${UNIQUEID}.call)
 same => n,NoOp()
 same => n,Verbose(2,Good Bye)
;END of [sub-call-back]


