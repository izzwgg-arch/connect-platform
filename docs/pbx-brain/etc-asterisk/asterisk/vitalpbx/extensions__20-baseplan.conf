[parse-dial-string]
exten => s,1,NoOp(Parsing dial string: ${DIAL_STRING})
 same => n,Set(NEW_DIAL_STRING=)
 same => n,Set(COUNTER=1)
 same => n,Set(CURRENT_DEVICE=${CUT(DIAL_STRING,&,${COUNTER})})
 same => n,While($[${EXISTS(${CURRENT_DEVICE})}])
 same => n,Set(TECHNOLOGY=${CUT(CURRENT_DEVICE,/,1)})
 same => n,Set(USER=${CUT(CURRENT_DEVICE,/,2)})
 same => n,GotoIf($["${TECHNOLOGY}"="PJSIP"]?:regular)
 same => n,Goto(regular-pjsip)
 same => n,Set(PARSED_DEV=Local/${USER}@pjsip-push)
 same => n,Goto(append)
 same => n(regular-pjsip),Set(PARSED_DEV=${PJSIP_DIAL_CONTACTS(${USER})})
 same => n,ExecIf($["${LEN(${PARSED_DEV})}"="0"]?Set(PARSED_DEV=${CURRENT_DEVICE}))
 same => n,Goto(append)
 same => n(regular),Set(PARSED_DEV=${CURRENT_DEVICE})
 same => n(append),GotoIf($["${COUNTER}"="1"]?:concatenate)
 same => n,Set(NEW_DIAL_STRING=${PARSED_DEV})
 same => n,Goto(next)
 same => n(concatenate),GotoIf($["XX${PARSED_DEV}XX"!="XXXX"]?:next)
 same => n,Set(NEW_DIAL_STRING=${NEW_DIAL_STRING}&${PARSED_DEV})
 same => n(next),Set(COUNTER=$[${COUNTER} + 1])
 same => n,Set(CURRENT_DEVICE=${CUT(DIAL_STRING,&,${COUNTER})})
 same => n,EndWhile()
 same => n,NoOp(New dialstring: ${NEW_DIAL_STRING})
 same => n,Set(DIAL_STRING=${NEW_DIAL_STRING})
 same => n,Return()

