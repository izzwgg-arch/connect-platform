;ACCOUNT CODE VER. 1.0.0
;-------------------------------------------------------------------
[sub-account-code]
exten => s,1,NoOp(FEATURE: CUSTOMER ACCOUNT CODE)
 same => n,Answer
 same => n,Wait(1)
 same => n,Set(TIMEOUT(response)=10)
 same => n,Set(TRY=1)
 same => n(try_again),Read(accountcode,vpbx/vital-customer-account-number)
 same => n,GotoIf($["${DB(${TENANT}/accountcodes/${accountcode})}"="no"]?acc_disabled)
 same => n,GotoIf($["${DB(${TENANT}/accountcodes/${accountcode})}"="yes"]?:repeat)
 same => n(read_number),Read(NUMBER_TO_DIAL,pls-entr-num-uwish2-call&followed_pound)
 same => n,GotoIf($["XXX${NUMBER_TO_DIAL}"="XXX"]?read_number)
 same => n,ResetCDR()
 same => n,Set(CDR(customer_code)=${accountcode})
 same => n,Set(CDR(destination)=${NUMBER_TO_DIAL})
 same => n,Goto(${COS_NAME},${NUMBER_TO_DIAL},1)
 same => n,Goto(hangup)
 same => n(invalid),Playback(im-sorry&vpbx/vital-max-tries&vm-goodbye)
 same => n,Goto(hangup)
 same => n(repeat),Set(TRY=$[${TRY}+1])
 same => n,GotoIf($[${TRY} > 3]?invalid)
 same => n,Playback(vpbx/vital-customer-account-number-invalid&vm-pls-try-again)
 same => n,Goto(try_again)
 same => n(acc_disabled),Playback(im-sorry&vpbx/vital-customer-account-number-disabled&vm-goodbye)
 same => n(hangup),Hangup()
;END of [sub-account-code]
;-------------------------------------------------------------------
;END ACCOUNT CODE

;AUTORIZATION CODE VER. 1.0.0
;-------------------------------------------------------------------
[sub-autorization-code]
;TODO: Look for better audio files
exten => s,1,NoOp(FEATURE: AUTORIZATION CODE)
 same => n,Answer()
 same => n,Set(TRIES=1)
 same => n,Set(MAX_TRIES=3)
 same => n(get_password), NoOp()
 same => n,Read(AUTH_CODE,vpbx/vital-authorization-code,,,3,5)
 same => n,GotoIf($["${READSTATUS}"="TIMEOUT"]?auth_fail,1)
 same => n,GotoIf($["${DB(${TENANT}/authcodes/${AUTH_CODE}/enabled)}"="no"]?auth_disabled)
 same => n,GotoIf($["${DB(${TENANT}/authcodes/${AUTH_CODE}/enabled)}"="yes"]?ok)
  same => n,Set(TRIES=$[${TRIES}+1])
  same => n,GotoIf($[${TRIES} <= ${MAX_TRIES}]?:auth_fail,1)
 same => n,Playback(im-sorry&vpbx/vital-auth-code-invalid&vm-pls-try-again)
 same => n,Goto(get_password)
 same => n(ok),NoOp()
 same => n,Set(COS_FOR_CALL=${DB(${TENANT}/authcodes/${AUTH_CODE}/cos)})
 same => n,Set(AUTH_ALIAS=${DB(${TENANT}/authcodes/${AUTH_CODE}/alias)})
 same => n,Set(AUTH_ALIAS=${IF($["${AUTH_ALIAS}"=""]?${AUTH_CODE}:${AUTH_ALIAS})})
 same => n(read_numaber),Read(NUMBER_TO_DIAL,pls-entr-num-uwish2-call&followed_pound,,,3,5)
 same => n,GotoIf($["${READSTATUS}"="TIMEOUT"]?auth_fail,1)
 same => n,ResetCDR()
 same => n,Set(CDR(auth_code)=${AUTH_ALIAS})
 same => n,Set(CDR(destination)=${NUMBER_TO_DIAL})
 same => n,Goto(${COS_FOR_CALL},${NUMBER_TO_DIAL},1)
 same => n,Hangup()
 same => n(auth_disabled),Playback(im-sorry&vpbx/vital-auth-code-disabled&vm-goodbye)
 same => n,Hangup()

exten => auth_fail,1,NoOp(Authorization Reach MAX Tries/Timeout)
 same => n,Playback(vpbx/vital-max-tries&vm-goodbye)
 same => n,Hangup()

exten => t,1,Goto(timeout-reached,s,1)
 same => n,Hangup()
;END of [sub-autorization-code]
;-------------------------------------------------------------------
;END AUTORIZATION CODE

;REMOTE SUSTITUTION VER. 1.0.0
;-------------------------------------------------------------------
[sub-remote-substitution]
exten => s,1,NoOp(Execution of remote substitution)
 same => n,Set(TRIES=3)
 same => n,Set(TRY=0)
 same => n(enter_substitution_number),Set(TRY=$[${TRY}+1])
 same => n,GotoIf($[${TRY}>${TRIES}]?end_call)
 same => n,Read(SUBSTITUTION_NUMBER,please-enter-the&extension&followed_pound)
 same => n,Set(CONTEXT_TO_DIAL=${DB(${TENANT}/extensions/${SUBSTITUTION_NUMBER}/context)})
 same => n,GotoIf($["${CONTEXT_TO_DIAL}"!=""]?:enter_substitution_number)
 same => n,Set(EXT_PASSWORD=REDACTED
 same => n,GotoIf($["XXX${EXT_PASSWORD}"="XXX"]?nopassword)
 same => n,Authenticate(${EXT_PASSWORD})
 same => n(nopassword),NoOp(Ask for number to dial)
 same => n,Set(INTERNAL_CID=${ODBC_EXTENSION-SETTING(internal_cid,${SUBSTITUTION_NUMBER},${TENANT})})
 same => n,Set(TRY=0)
 same => n(enter_number_to_dial),Set(TRY=$[${TRY}+1])
 same => n,GotoIf($[${TRY}>${TRIES}]?end_call)
 same => n,Read(NUMBER_TO_DIAL,pls-entr-num-uwish2-call&followed_pound)
 same => n,GotoIf($["XXX${NUMBER_TO_DIAL}"="XXX"]?enter_number_to_dial)
 same => n,Set(CALLERID(all)=${INTERNAL_CID})
 same => n,ResetCDR()
 same => n,Set(CDR(destination)=${NUMBER_TO_DIAL})
 same => n,Goto(${CONTEXT_TO_DIAL},${NUMBER_TO_DIAL},1)
 same => n(end_call),Hangup()

 exten => t,1,NoOp(Time out)
  same => n,Goto(timeout-reached,s,1)

 exten => i,1,NoOp(Invalid Dial)
   same => n,Goto(invalid-dest,s,1)
;END of [sub-remote-substitution]
;-------------------------------------------------------------------
;END REMOTE SUSTITUTION

