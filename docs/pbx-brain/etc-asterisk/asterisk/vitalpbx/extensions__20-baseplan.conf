[sub-simulate-incoming-call]
exten => s,1,NoOp(FEATURE: SIMULATE INCOMING CALL)
 same => n,Set(DIAL_CTXT=incoming-calls)
 same => n,Set(DID=${CALLERID(num)})
 same => n,Set(CID=${CALLERID(num)})
 same => n(read-data),Set(TRY=1)
 same => n,Set(MAX_TRIES=3)
 same => n(invalid_exten),Gotoif($[${TRY} > ${MAX_TRIES}]?end_tries)
 same => n,Set(TRY=$[${TRY}+1])
 same => n,Read(EXT,vpbx/vital-sim-incoming-call-did,,,3,5)
 same => n,Gotoif($["${EXT}"=""]?:continue_steps)
 same => n,Playback(im-sorry&you-dialed-wrong-number)
 same => n,Goto(invalid_exten)
 same => n(continue_steps),NoOp(DID PROVIDED WAS: ${EXT})
 same => n,Set(DID=${EXT})
 same => n(end_tries),NoOp(DID TO CALL IS: ${DID})
 same => n,GotoIf(${DIALPLAN_EXISTS(${DIAL_CTXT},${DID},1)}?:noexist)
 same => n,Read(CID_NUMBER,vpbx/vital-sim-incoming-cid,,,1,5) ; Audio like: Please enter your Caller ID number if you want to change it, followed by pound
 same => n,ExecIf($["${CID_NUMBER}"!=""]?Set(CID=${CID_NUMBER}))
 same => n,NoOp(CID NUMBER IS: ${CID})
 same => n,Set(CALLERID(all)="Incoming Call Simulation" <${CID}>)
 same => n,Set(CDR(source)=${CID})
 same => n,Set(CDR(destination)=${DID})
 same => n,Goto(${DIAL_CTXT},${DID},1)
 same => n,Hangup()
 same => n(noexist),Playback(no-route-exists-to-dest)
 same => n,Goto(read-data)

;-------------------------------------------------------------------
;END SIMULATE INCOMING CALL

