 same => n,GotoIf($["${DB(${TENANT}/extensions/${CALL_SOURCE}/hints)}"="yes"]?hint:nohint)
 same => n(hint),GotoIf($["${DB(${TENANT}/extensions/${CALL_SOURCE}/CC/state)}"="yes"]?hint_disabled)
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}CCS_${CALL_SOURCE})=BUSY)
 same => n,Goto(enable)
 same => n(hint_disabled),NoOp(${DB_DELETE(${TENANT}/extensions/${CALL_SOURCE}/CC/state)})
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}CCS_${CALL_SOURCE})=NOT_INUSE)
 same => n,Goto(disable)
 same => n(nohint),GotoIf($["${DB(${TENANT}/extensions/${CALL_SOURCE}/CC/state)}"="yes"]?nohint_disabled)
 same => n,Goto(enable)
 same => n(nohint_disabled),NoOp(${DB_DELETE(${TENANT}/extensions/${CALL_SOURCE}/CC/state)})
 same => n,Goto(disable)
 same => n(enable),Set(DB(${TENANT}/diversions/${CALL_SOURCE}/${ARG2}/enable)=yes)
 same => n,Set(DB(${TENANT}/diversions/${CALL_SOURCE}/has_enable_diversions)=yes)
 same => n,Set(DB(${TENANT}/extensions/${CALL_SOURCE}/CC/state)=yes)
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer "enable-CC" "${TENANT}" "${CALL_SOURCE}")
 same => n,Playback(vpbx/vital-call-completion&activated)
 same => n,Hangup()
 same => n(disable),Set(DB(${TENANT}/diversions/${CALL_SOURCE}/${ARG2}/enable)=no)
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer "disable-CC" "${TENANT}" "${CALL_SOURCE}")
 same => n,Gosub(sub-cf-checkall,s,1)
 same => n,Playback(vpbx/vital-call-completion&de-activated)
 same => n,Hangup()
;END of [sub-call-completion-state]
;------------------------------------------------------------------

[sub-cc-request]
exten => s,1,NoOp(Call Completion Request)
 same => n,NoCDR()
 same => n,Answer()
 same => n,Set(X=1)
 same => n,Set(MAX_TRIES=3)
 same => n,Set(CC_REQUEST_MODE=${IF($["${ARG1}"="BUSY"]?is-curntly-busy:is-curntly-unavail)})
 same => n,Playback(extension&${CC_REQUEST_MODE})
 same => n(loop),GotoIf($[${X}>${MAX_TRIES}]?max_retries,1)
 same => n,Read(DIGITS,vpbx/vital-call-completion-request&digits/5,1,,3,5)
 same => n,GotoIf($["${DIGITS}"="5"]?enable-cc)
 same => n,Set(X=$[${X} + 1])
 same => n,Goto(loop)
 same => n(enable-cc),NoOp(Enabling Call Completion)
 same => n,Set(DB(${TENANT}/extensions/${CALL_DESTINATION}/CC/request)=${CALL_SOURCE})
 same => n,Set(DB(${TENANT}/extensions/${CALL_SOURCE}/CC/extension)=${CALL_DESTINATION})
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer "remove-CC" "${TENANT}" "${CALL_DESTINATION}")
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer "add-CC" "${TENANT}" "${CALL_SOURCE}" "${CALL_DESTINATION}")
 same => n,Playback(activated)
 same => n,Hangup()

exten => max_retries,1,NoOp(Max Retries Reached)
 same => n,Playback(vpbx/vital-max-tries&please-try-again-later)
 same => n,Hangup()

exten => t,1,NoOp(Timeout Reached)
 same => n,Goto(max_retries,2)
 same => n,Hangup()
;END of [sub-call-completion-request]
;-------------------------------------------------------------------

[sub-call-completion-cancel]
exten => s,1,NoOp(FEATURE: CALL COMPLETION REQUEST CANCEL)
 same => n,Answer
 same => n,Wait(1)
 same => n,Set(cc_extension=${DB(${TENANT}/extensions/${CALL_SOURCE}/CC/extension)})
 same => n,NoOp(${DB_DELETE(${TENANT}/extensions/${CALL_SOURCE}/CC/extension)})
 same => n,NoOp(${DB_DELETE(${TENANT}/extensions/${cc_extension}/CC/request)})
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer "remove-CC" "${TENANT}" "${cc_extension}")
 same => n,Playback(vpbx/vital-call-completion-cancelled)
 same => n,Hangup()

;END of [sub-call-completion-cancel]
;-------------------------------------------------------------------

[sub-call-completion-check]
exten => s,1,NoOp(FEATURE: CALL COMPLETION CHECK)
 same => n,Set(CC_MODE=none)
 same => n,Set(CC_MODE=${IF(${DB_EXISTS(${TENANT}/extensions/${CALL_SOURCE}/CC/request)}?CALLER:${CC_MODE})})
 same => n,Set(CC_MODE=${IF(${DB_EXISTS(${TENANT}/extensions/${CALL_DESTINATION}/CC/request)}?CALLEE:${CC_MODE})})
 same => n,GotoIf($["${CC_MODE}"="none"]?end)
 same => n,Set(NUMBER=${IF($["${CC_MODE}"="CALLER"]?${CALL_SOURCE}:${CALL_DESTINATION})})
 same => n,Set(CC_CALLER=${DB(${TENANT}/extensions/${NUMBER}/CC/request)})
 same => n,Set(CC_CALLEE=${DB(${TENANT}/extensions/${CC_CALLER}/CC/extension)})
 same => n,NoOp(${DB_DELETE(${TENANT}/extensions/${NUMBER}/CC/request)})
 same => n,NoOp(${DB_DELETE(${TENANT}/extensions/${CC_CALLER}/CC/extension)})
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer "remove-CC" "${TENANT}" "${CC_CALLEE}")
 same => n,Set(CALLER_ID=${ODBC_EXTENSION-SETTING(internal_cid,${CC_CALLER},${TENANT})})
 same => n,System(echo "Channel: Local/${CC_CALLER}@${COS_NAME} \nMaxRetries: 3 \nRetryTime: 1 \nWaitTime: 30 \nCallerID: "Call Completion" <${CC_CALLEE}> \nExtension: ${CC_CALLEE} \nContext: ${COS_NAME} \nSetvar: Language=${CHANNEL(language)} \nSetvar: CALL_ORIGIN=feature \nSetvar: FEATURE_SERVICE=call_completion" > ${ASTSPOOLDIR}/${UNIQUEID}.call)
 same => n,Set(OUTGOING_TIME=${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)})
 same => n,System(touch -t ${OUTGOING_TIME} ${ASTSPOOLDIR}/${UNIQUEID}.call)
 same => n,System(mv ${ASTSPOOLDIR}/${UNIQUEID}.call ${ASTSPOOLDIR}/outgoing/${OUTGOING_TIME}.${UNIQUEID}.call)
 same => n(end),Return()
;END of [sub-call-completion-check]
;-------------------------------------------------------------------
;END CALL COMPLETION

