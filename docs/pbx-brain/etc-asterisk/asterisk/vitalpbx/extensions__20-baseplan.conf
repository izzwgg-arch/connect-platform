exten => s,1,NoOp(SUB: DND ENABLED/DISABLED)
 same => n,Answer()
 same => n,Set(DND_OPTION=${ARG1})
 same => n,GotoIf($["${DND_OPTION}"="1"]?enable_dnd)
 same => n,GotoIf($["${DND_OPTION}"="2"]?disable_dnd)
 same => n,Wait(1)
 same => n,GotoIf($["${DB(${TENANT}/diversions/${CALL_SOURCE}/DND/enable)}"="yes"]?disable_dnd)
 same => n(enable_dnd),Set(DB(${TENANT}/diversions/${CALL_SOURCE}/DND/enable)=yes)
 same => n,Set(DB(${TENANT}/diversions/${CALL_SOURCE}/has_enable_diversions)=yes)
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}DND_${CALL_SOURCE})=INUSE)
 same => n,Set(DND_ACTION=yes)
 same => n,Playback(do-not-disturb&activated)
 same => n,Hangup()
 same => n(disable_dnd),Set(DB(${TENANT}/diversions/${CALL_SOURCE}/DND/enable)=no)
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}DND_${CALL_SOURCE})=UNAVAILABLE)
 same => n,Gosub(sub-cf-checkall,s,1)
 same => n,Set(DND_ACTION=no)
 same => n,Playback(do-not-disturb&de-activated)
 same => n,Hangup()

exten => h,1,NoOP(Finish DND Call)
 same => n,Set(ODBC_DIVERSIONS(${CALL_SOURCE},${TENANT},DND)=${DND_ACTION})
 same => n,Hangup()

[sub-dnd-state-direct]
exten => s,1,NoOp(SUB: Direct DND)
 same => n,Set(OPTION=${CALL_DESTINATION:${ARG1}})
 same => n,Set(OPTION=${OPTION:1}) ; remove the '*'
 same => n,Gosub(sub-dnd-state,s,1(${OPTION}))
 same => n,Hangup()

;-------------------------------------------------------------------
;END DND

;CALL FOWARDING STATE VER. 1.0.0
;-------------------------------------------------------------------
[sub-cf-state]
exten => s,1,NoOp(SUB: CALL FOWARDING ENABLED/DISABLED)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(CURRENT_CF_NUMBER=${DB(${TENANT}/diversions/${CALL_SOURCE}/${ARG2}/destination)})
 same => n,GoSubIf($[ $["${CURRENT_CF_NUMBER}"=""]|$["${LEN(${CFNUMBER})}"!="0"] ]?sub-cf-set,s,1(${ARG1},${ARG2},from-cf-state,${CFNUMBER}))
 same => n,GotoIf($[$["${DB(${TENANT}/diversions/${CALL_SOURCE}/${ARG2}/enable)}"="yes"]&$["${LEN(${CFNUMBER})}"="0"]]?disable_cf)
 same => n,Set(DB(${TENANT}/diversions/${CALL_SOURCE}/${ARG2}/enable)=yes)
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}${ARG2}_${CALL_SOURCE})=BUSY)
 same => n,Set(ODBC_DIVERSIONS(${CALL_SOURCE},${TENANT},${ARG2})=yes)
 same => n,Set(DB(${TENANT}/diversions/${CALL_SOURCE}/has_enable_diversions)=yes)
 same => n,Playback(${ARG1}&activated)
 same => n,Hangup()
 same => n(disable_cf),Set(DB(${TENANT}/diversions/${CALL_SOURCE}/${ARG2}/enable)=no)
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}${ARG2}_${CALL_SOURCE})=NOT_INUSE)
 same => n,Set(ODBC_DIVERSIONS(${CALL_SOURCE},${TENANT},${ARG2})=no)
 same => n,Gosub(sub-cf-checkall,s,1)
 same => n,Playback(${ARG1}&de-activated)
 same => n,Hangup()
;END of [sub-cf-state]

;-------------------------------------------------------------------
[sub-cf-set]
exten => s,1,NoOp(SUB: CALL FOWARDING SET NUMBER)
 same => n,ExecIf($["${ARG3}"!="from-cf-state"]?Answer())
 same => n,ExecIf($["${ARG3}"!="from-cf-state"]?Wait(1))
 same => n,Set(number=${ARG4})
 same => n,GotoIf($["${number}"=""]?continue)
 same => n,Set(NUMBER_TO_BE_SET=${number})
 same => n,Goto(skip_read)
 same => n(continue),Playback(${ARG1})
 same => n(readnumber),Read(NUMBER_TO_BE_SET,ent-target-attendant&then-press-pound)
 same => n,GotoIf($["${NUMBER_TO_BE_SET}"=""]?readnumber)
 same => n,Wait(1)
 same => n(skip_read),Set(DB(${TENANT}/diversions/${CALL_SOURCE}/${ARG2}/destination)=sub-custom-numbers,${NUMBER_TO_BE_SET},1)
 same => n,System(${SCRIPTS_PATH}/vitalpbx "setCFNumber" "${ARG2}" "${TENANT}" "${CALL_SOURCE}" "${NUMBER_TO_BE_SET}")
 same => n,ExecIf($["${ARG3}"="from-cf-state"]?return())
 same => n,Playback(${ARG1}&to-extension)
 same => n,SayDigits(${CALL_SOURCE})
 same => n,Playback(is-set-to)
 same => n,SayDigits(${NUMBER_TO_BE_SET})
 same => n,Playback(goodbye)
 same => n,Hangup()
;END of [sub-cf-set]

