;CUSTOM RECORDING VER. 1.0.0
;-------------------------------------------------------------------
[sub-custom-recording] ;${ARG1}-->Tenant
exten => s,1,NoOp(FEATURE: CUSTOM RECORDING)
 same => n,Answer
 same => n,Wait(1)
 same => n,Set(CURRENT_TIME=${STRFTIME($[${EPOCH}],,%Y%m%d)})
 same => n,Set(FILENAME=/tmp/${CURRENT_TIME}_${CALLERID(num)}_${UNIQUEID}.wav)
 same => n,NoOp(Recording File: ${FILENAME})
 same => n(rerecord),Playback(vpbx/vital-custom-recording)
 same => n,Record("${FILENAME}",,,k)
 same => n,Set(TIMEOUT(digit)=1)
 same => n,Set(TIMEOUT(response)=15)
 same => n(menu),Background(to-listen-to-it&press-1)
 same => n(accept),Background(to-accept-recording&press-2)
 same => n,Background(to-rerecord-announce&digits/3)
 same => n,Background(to-cancel-this-msg&press-4)
 same => n,Wait(2)
 same => n,Goto(menu)
exten => 1,1,Playback("${FILENAME:0:-4}")
 same => n,Goto(s,accept)
exten => 2,1,Playback(auth-thankyou)
 same => n,System(/usr/share/vitalpbx/scripts/custom_recording "${FILENAME}" "${TENANT}" "${RECORDING_ID}")
 same => n,Hangup()
exten => 3,1,Goto(s,rerecord)
exten => 4,1,Playback(cancelled)
 same => n,System(rm -f "${FILENAME}")
 same => n,Hangup()
exten => i,1,Goto(menu)
exten => t,1,Goto(menu)
exten => h,1,NoOp(Finish Custom Recording)
 same => n,System(rm -f "${FILENAME}")
;END of [sub-custom-recording]
;-------------------------------------------------------------------
;END CUSTOM RECORDING

