[queue_pause]
exten => s,1,NoOp(pause agent on queues)
 same => n,Set(PAUSE_REASON=${ARG1})
 same => n,Set(QUEUES=${ODBC_QUEUES-LIST(${TENANT})})
 same => n,Set(QUEUE_COUNTER=1)
 same => n,Set(ACTUAL_QUEUE=${CUT(QUEUES,^,${QUEUE_COUNTER})})
 same => n,While($[${EXISTS(${ACTUAL_QUEUE})}])
 same => n,Set(QUEUE_NAME=${DB(${TENANT}/queues/${ACTUAL_QUEUE}/name)})
 same => n,GotoIf($[${QUEUE_EXISTS(${QUEUE_NAME})}]?:next)
 same => n,Set(MEMBER_TYPE=${DB(${TENANT}/queues/${ACTUAL_QUEUE}/member/${CALL_SOURCE}/type)})
 same => n,GotoIf($[${ISNULL(${MEMBER_TYPE})}]?next)
 same => n,Set(CoS=${DB(${TENANT}/extensions/${CALL_SOURCE}/context)})
 same => n,Set(INTERFACE=Local/${CALL_SOURCE}@${CoS})
 same => n,Set(MEMBER_PENALTY=${DB(${TENANT}/queues/${ACTUAL_QUEUE}/member/${CALL_SOURCE}/penalty)})
 same => n,NoOp(Pausing ${CALL_SOURCE} to Queue ${ACTUAL_QUEUE})
 same => n,Set(PAUSED=${QUEUE_MEMBER(${QUEUE_NAME},paused,Local/${CALL_SOURCE}@${QUEUE_AGENTS_CONTEXT}/n)})
 same => n,GotoIf($["${PAUSED}"="1"]?:pause)
 same => n,NoOP(Interface Local/${CALL_SOURCE}@${QUEUE_AGENTS_CONTEXT}/n is paused already)
 same => n,Goto(next)
 same => n(pause),PauseQueueMember(${QUEUE_NAME},Local/${CALL_SOURCE}@${QUEUE_AGENTS_CONTEXT}/n,,${PAUSE_REASON})
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}QAP_${CALL_SOURCE}_${ACTUAL_QUEUE})=BUSY)
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}QAP_${CALL_SOURCE})=BUSY)
 same => n(next),Set(QUEUE_COUNTER=$[${QUEUE_COUNTER} + 1])
 same => n,Set(ACTUAL_QUEUE=${CUT(QUEUES,^,${QUEUE_COUNTER})})
 same => n,EndWhile()
 same => n,Hangup()

[queue_unpause]
exten => s,1,NoOp(unpause agent from queues)
 same => n,Set(QUEUES=${ODBC_QUEUES-LIST(${TENANT})})
 same => n,Set(QUEUE_COUNTER=1)
 same => n,Set(ACTUAL_QUEUE=${CUT(QUEUES,^,${QUEUE_COUNTER})})
 same => n,While($[${EXISTS(${ACTUAL_QUEUE})}])
 same => n,Set(QUEUE_NAME=${DB(${TENANT}/queues/${ACTUAL_QUEUE}/name)})
 same => n,GotoIf($[${QUEUE_EXISTS(${QUEUE_NAME})}]?:next)
 same => n,Set(MEMBER_TYPE=${DB(${TENANT}/queues/${ACTUAL_QUEUE}/member/${CALL_SOURCE}/type)})
 same => n,GotoIf($[${ISNULL(${MEMBER_TYPE})}]?next)
 same => n,Set(CoS=${DB(${TENANT}/extensions/${CALL_SOURCE}/context)})
 same => n,Set(INTERFACE=Local/${CALL_SOURCE}@${CoS})
 same => n,Set(MEMBER_PENALTY=${DB(${TENANT}/queues/${ACTUAL_QUEUE}/member/${CALL_SOURCE}/penalty)})
 same => n,NoOp(Un-Pausing ${CALL_SOURCE} from Queue ${ACTUAL_QUEUE})
 same => n,Set(PAUSED=${QUEUE_MEMBER(${QUEUE_NAME},paused,Local/${CALL_SOURCE}@${QUEUE_AGENTS_CONTEXT}/n)})
 same => n,GotoIf($["${PAUSED}"="1"]?unpause)
 same => n,NoOP(Interface Local/${CALL_SOURCE}@${QUEUE_AGENTS_CONTEXT}/n is unpaused already)
 same => n,Goto(next)
 same => n(unpause),UnpauseQueueMember(${QUEUE_NAME},Local/${CALL_SOURCE}@${QUEUE_AGENTS_CONTEXT}/n)
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}QAP_${CALL_SOURCE}_${ACTUAL_QUEUE})=NOT_INUSE)
 same => n,Set(DEVICE_STATE(Custom:${TENANT_PREFIX}QAP_${CALL_SOURCE})=NOT_INUSE)
 same => n(next),Set(QUEUE_COUNTER=$[${QUEUE_COUNTER} + 1])
 same => n,Set(ACTUAL_QUEUE=${CUT(QUEUES,^,${QUEUE_COUNTER})})
 same => n,EndWhile()
 same => n,Hangup()

;-------------------------------------------------------------------
;END CALL CENTER

