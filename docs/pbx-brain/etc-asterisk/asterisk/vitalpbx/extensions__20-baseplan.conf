;HOT DESKING VER. 1.0.0
;-------------------------------------------------------------------
[sub-hot-desking]
exten => s,1,NoOP(SUB: HOT DESKING SERVICE)
 same => n,Gosub(sub-get-device-tree,s,1)
 same => n,NoOp(Testing if device is hot desking)
 same => n,Set(IS_HOT_DESK=${DB(${DEV_TREE}/hot_desk)})
 same => n,GotoIf($["${IS_HOT_DESK}"="yes"]?:invalid_device)
 same => n,Goto(assign_exten,1)
 same => n,Hangup()
 same => n(invalid_device),NoOp(Sorry, but this device is not hot desking)
 same => n,Playback(vpbx/vital-no-hotdesking-service)
 same => n,Hangup()

exten => assign_exten,1,NoOp(Assign extension to device ${INTERFACE})
 same => n,Set(tries=0)
 same => n,Set(HD_CONFIRMED=no)
 same => n(read_extension),NoOp(Please enter the extension that you wish assign to this device)
 same => n,Read(EXTEN_TO_ASSIGN,vpbx/vital-hotdesking-login,,,3,5)
 same => n,GotoIf($["XXX{EXTEN_TO_ASSIGN}"="XXX"]?read_extension)
 same => n,Set(IS_HOT_DESK=${DB(${TENANT}/extensions/${EXTEN_TO_ASSIGN}/hotdesking)})
 same => n,GotoIf($["${IS_HOT_DESK}"="yes"]?valid_extension)
 same => n,Set(tries=$[${tries}+1])
 same => n,GotoIf($[${tries}>=3]?invalid_extension)
 same => n,Playback(vpbx/vital-no-hotdesking-extension&please-try-again)
 same => n,Goto(read_extension)
 same => n(valid_extension),NoOp(Assigning extension ${EXTEN_TO_ASSIGN} to device ${INTERFACE})
 same => n,Set(ASSIGNED_EXTEN=${DB(${DEV_TREE}/assigned_exten)})
 same => n,GoSubIf($["${EXTEN_TO_ASSIGN}"="${ASSIGNED_EXTEN}"]?unassign_exten,s,1)
 same => n,NoOp(${DB(${TENANT}/extensions/${EXTEN_TO_ASSIGN}/dial)})
 same => n,Set(EXTENSION_PASSWORD=REDACTED
 same => n,GotoIf($["XXX${EXTENSION_PASSWORD}"="XXX"]?no_authenticate)
 same => n,gosub(authenticate,s,1(${EXTENSION_PASSWORD}))
 same => n(no_authenticate),Set(HD_CONFIRMED=yes)
 same => n,PlayBack(vpbx/vital-hotdesking-login-confirm)
 same => n,Hangup()
 same => n(invalid_extension),Playback(vpbx/vital-max-tries&please-try-again-later&goodbye)
 same => n,Hangup()

exten => h,1,NoOp(Check if need processing)
 same => n,GotoIf($["${HD_CONFIRMED}"!="yes"]?end)
 same => n,NoOp(${EXTEN_TO_ASSIGN})
 same => n,GotoIf($[${EXISTS(${EXTEN_TO_ASSIGN})}]?:end)
 same => n,Set(IS_HOT_DESK=${DB(${TENANT}/extensions/${EXTEN_TO_ASSIGN}/hotdesking)})
 same => n,GotoIf($["${IS_HOT_DESK}"!="yes"]?end)
 same => n,ExecIf($["${DB(${TENANT}/extensions/${ASSIGNED_EXTEN}/dial)}"!=""]?Set(prev_dial=${DB(${TENANT}/extensions/${ASSIGNED_EXTEN}/dial)}):Set(prev_dial=no) ; if has previously assigned
 same => n,GotoIf($[$["${prev_dial}"="no"]|$["${EXTEN_TO_ASSIGN}"="${ASSIGNED_EXTEN}"]]?next)
 same => n,gosub(unassign_device,s,1(${prev_dial},${ASSIGNED_EXTEN}))
 same => n,GoSub(sub-queues-logout,s,1(${ASSIGNED_EXTEN})) ; unassign previous extension
 same => n,Gosub(sub-get-device-tree,s,1) ; because unassign_device breaks INTERFACE variable
 same => n(next),ExecIf($["${DB(${TENANT}/extensions/${EXTEN_TO_ASSIGN}/dial)}"!=""]?Set(current_dial=${DB(${TENANT}/extensions/${EXTEN_TO_ASSIGN}/dial)}):Set(current_dial=no)) ; check for assgined
 same => n,GotoIf($[$["${current_dial}"="no"]|$["${prev_dial}"="no"]|$["${EXTEN_TO_ASSIGN}"="${ASSIGNED_EXTEN}"]]?continue)
 same => n,gosub(unassign_device,s,1(${current_dial},${EXTEN_TO_ASSIGN}))
 same => n,ExecIf($[$["${current_dial}"!="no"]&$[${DB_EXISTS(devices/${current_dial}/assigned_exten)}]]?Set(DB(devices/${current_dial}/assigned_exten)=))
 same => n(continue),Set(DB(${TENANT}/extensions/${ASSIGNED_EXTEN}/dial)=)
 same => n,ExecIf($["${current_dial}"!="no"]?Gosub(unassign_device,s,1(${current_dial},${EXTEN_TO_ASSIGN})))
 same => n,Set(DB(${DEV_TREE}/assigned_exten)=${EXTEN_TO_ASSIGN})
 same => n,ExecIf(${DB_EXISTS(${DEV_TREE}/hot_desk_ringdevice)}?Set(ring_device=${DB(${DEV_TREE}/hot_desk_ringdevice)}):Set(ring_device=no))
 same => n,ExecIf($["${ring_device}"="yes"]?Set(DB(${TENANT}/extensions/${EXTEN_TO_ASSIGN}/dial)=${INTERFACE}))
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer hotdesk-login "${DEV_USER}" "${DEV_TECHNOLOGY}" "${EXTEN_TO_ASSIGN}" "${TENANT}")
 same => n,UserEvent("UserDeviceAdded","Data: ${EXTEN_TO_ASSIGN},${INTERFACE}")
 same => n,GoSubIf($["${HD_LOGIN_TO_QUEUES}"="TRUE"]?sub-queues-login,s,1(${EXTEN_TO_ASSIGN}))
 same => n(end),Hangup()
; END

[sub-hot-desking-direct]
exten => s,1,NoOp(SUB: Hot Desking Direct ${CALL_DESTINATION})
 same => n,Set(OPTION=${CALL_DESTINATION:${ARG1}})
 same => n,Set(OPTION=${OPTION:1}) ; remove the '*'
 same => n,GotoIf($["${DB(${DEV_TREE}/hot_desk)}"="yes"]?:sub-hot-desking,s,invalid_device)
 same => n,Set(_ASSIGNED_EXTEN=${DB(${DEV_TREE}/assigned_exten)})
 same => n,GotoIf($["${OPTION}"="1"]?:un-assign)
 same => n,GoSub(sub-hot-desking-assign-extension,s,1)
 same => n(un-assign),GoSub(sub-hot-desking-remove-extension,s,1)
 same => n,Hangup()

[sub-hot-desking-remove-extension]
exten => s,1,NoOP(SUB:Remove Extension)
 same => n,GotoIf($["XXX{ASSIGNED_EXTEN}"="XXX"]?end)
 same => n,Set(_REMOVE_EXTEN=1)
 same => n,Set(_EXTEN_TO_ASSIGN=${ASSIGNED_EXTEN})
 same => n,Goto(unassign_exten,s,remove-accepted)
 same => n(end),Hangup()

[sub-hot-desking-assign-extension]
exten => s,1,NoOP(SUB: Assign Extension)
 same => n,Set(tries=0)

 same => n,Set(EXTEN_TO_ASSIGN=${HD_EXTENSION_TO_LOGIN})
 same => n,Set(PROVIDED_PASSWORD=REDACTED
 same => n,Set(CHANNEL(hangup_handler_push)=sub-hot-desking,h,1());
 same => n,GotoIf($[${ISNULL(${EXTEN_TO_ASSIGN})}]?:check-extension)
 same => n(read_extension),Read(EXTEN_TO_ASSIGN,vpbx/vital-hotdesking-login,,,3,5)
 same => n,GotoIf($["XXX{EXTEN_TO_ASSIGN}"="XXX"]?read_extension)
 same => n(check-extension),Set(IS_HOT_DESK=${DB(${TENANT}/extensions/${EXTEN_TO_ASSIGN}/hotdesking)})
 same => n,GotoIf($["${IS_HOT_DESK}"="yes"]?valid_extension)
 same => n,Set(tries=$[${tries}+1])
 same => n,GotoIf($[${tries}>=3]?invalid_extension)
 same => n,Playback(vpbx/vital-no-hotdesking-extension&please-try-again)
 same => n,Goto(read_extension)
 same => n(valid_extension),NoOp(Assigning extension ${EXTEN_TO_ASSIGN} to device ${INTERFACE})
 same => n,NoOp(${DB(${TENANT}/extensions/${EXTEN_TO_ASSIGN}/dial)})
 same => n,Set(EXTENSION_PASSWORD=REDACTED
 same => n,GotoIf($["XXX${EXTENSION_PASSWORD}"="XXX"]?no_authenticate)
 same => n,GotoIf($[${ISNULL(${PROVIDED_PASSWORD})}]?auth)
 same => n,GotoIf($["${PROVIDED_PASSWORD}"="${EXTENSION_PASSWORD}"]?no_authenticate)
 same => n(auth),gosub(authenticate,s,1(${EXTENSION_PASSWORD}))
 same => n(no_authenticate),Set(HD_CONFIRMED=yes)
 same => n,PlayBack(vpbx/vital-hotdesking-login-confirm)
 same => n,Hangup()
 same => n(invalid_extension),Playback(vpbx/vital-max-tries&please-try-again-later&goodbye)
 same => n,Hangup()

[unassign_exten]
exten => s,1,NoOp(Your extension is already assigned to this device, for remove press 1, for cancel press 2 or hangup)
 same => n(read_remove_opts),Read(REMOVE_EXTEN,vpbx/vital-hotdesking-logout,1,,3,5)
 same => n,GotoIf($["${REMOVE_EXTEN}"=""]?read_remove_opts)
 same => n,NoOp(${REMOVE_EXTEN})
 same => n,GotoIf($[$[${REMOVE_EXTEN}=1]|$[${REMOVE_EXTEN}=2]]?:read_remove_opts)
 same => n,GotoIf($[${REMOVE_EXTEN}=2]?cancel)
 same => n(remove-accepted),NoOp(This extension have been removed correctly, Good Bye)
 same => n,PlayBack(vpbx/vital-hotdesking-logout-remove&goodbye)
 same => n,Goto(end)
 same => n(cancel),PlayBack(vpbx/vital-hotdesking-logout-cancel&goodbye)
 same => n(end),hangup()

exten => h,1,NoOp(Check if need removing)
 same => n,GotoIf($[${EXISTS(${REMOVE_EXTEN})}]?:end)
 same => n,GotoIf($[${REMOVE_EXTEN}=1]?:end) ; cannot do on the same line
 same => n,Set(DB(${DEV_TREE}/assigned_exten)=)
 same => n,Set(DB(${TENANT}/extensions/${ASSIGNED_EXTEN}/dial)=)
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer hotdesk-logout "${DEV_USER}" "${DEV_TECHNOLOGY}" "${EXTEN_TO_ASSIGN}" "${TENANT}")
 same => n,UserEvent("UserDeviceRemoved","Data: ${EXTEN_TO_ASSIGN},${INTERFACE}")
 same => n,GoSub(sub-queues-logout,s,1(${EXTEN_TO_ASSIGN}))
 same => n(end),Hangup()

;END of [sub-hot-desking]

[unassign_device]
exten => s,1,NoOp(unassign hot desk device)
 same => n,Set(current_dial=${ARG1})
 same => n,Set(DB(devices/${current_dial}/assigned_exten)=) ; unassign previous device
 same => n,Set(dev_tech=${CUT(current_dial,/,1)}) ; get the technology
 same => n,Set(dev_user=${CUT(current_dial,/,2)}) ; get the user
 same => n,System(/usr/share/vitalpbx/scripts/synchronizer hotdesk-logout "${dev_user}" "${dev_tech}" "${ARG2}" "${TENANT}")
 same => n,UserEvent("UserDeviceRemoved","Data: ${ARG2},${INTERFACE}")
 same => n,return()

; ARG1: Password to validate
; ARG2: Prompt to ask the password
; ARG3: ERROR Prompt after reaching the maximum number of allowed tries
; ARG4: ERROR Prompt to play in every try
[authenticate]
exten => s,1,NoOp(authenticate password)
 same => n,Set(tries=0)
 same => n,Set(PROMPT=${IF($["${LEN(${ARG2})}"!="0"]?${ARG2}:agent-pass)})
 same => n,Set(PROMPT_ERROR=${IF($["${LEN(${ARG3})}"!="0"]?${ARG3}:im-sorry&please-try-again-later&goodbye)})
 same => n(read_password),NoOp(Please enter the password)
 same => n,Read(PASSWORD,${PROMPT},,,3,5)
 same => n,Set(tries=$[${tries}+1])
 same => n,GotoIf($[${tries}>3]?end)
 same => n,GotoIf($["${PASSWORD}"!="${ARG1}"]?:match)
 same => n,ExecIf($["${LEN(${ARG4})}"!="0"]?Playback(${ARG4}))
 same => n,Goto(read_password)
 same => n(match),Return()
 same => n(end),Playback(${PROMPT_ERROR})
 same => n,Hangup()
; END

[sub-hot-desking-call]
exten => s,1,NoOp(Trying to connect call)
 same => n,Set(EXTENSION=${ARG1})
 same => n,Gosub(sub-get-device-tree,s,1)
 same => n,Set(ASSIGNED_EXTEN=${DB(${DEV_TREE}/assigned_exten)})
 same => n,GotoIf($["${ASSIGNED_EXTEN}"=""]?no_exten_assigned,1)
 same => n,GotoIf($["${DB(${TENANT}/extensions/${ASSIGNED_EXTEN}/hotdesking)}"!="yes"]?no_exten_assigned,1)
 same => n,Set(CALL_CONTEXT=${DB(${TENANT}/extensions/${ASSIGNED_EXTEN}/context)})
 same => n,Set(CALLERID(num)=${ASSIGNED_EXTEN})
 same => n,Set(__hotdesk_moh=${DB(${TENANT}/extensions/${ASSIGNED_EXTEN}/moh)})
 same => n,Set(CHANNEL(namedpickupgroup)=${DB(${TENANT}/extensions/${ASSIGNED_EXTEN}/pickupgroup)})
 same => n,Set(CHANNEL(language)=${DB(${TENANT}/extensions/${ASSIGNED_EXTEN}/language)})
 same => n,Goto(${CALL_CONTEXT},${ARG1},1)
 same => n,Hangup()

exten => no_exten_assigned,1,NoOp(This device don't have any extension assigned)
 same => n,Set(CDR(source)=${DEV_USER})
 same => n,Set(__HOT_DESK_CALL=yes)
 same => n,GotoIf($[${DIALPLAN_EXISTS(emergency-calls,${EXTENSION},1)}=1]?emergency-calls,${EXTENSION},1)
 same => n,Playback(sorry-cant-let-you-do-that&goodbye)
 same => n,Hangup()
;-------------------------------------------------------------------
;END HOT DESKING

;WAKEUP CALL VER. 1.0.0
;-------------------------------------------------------------------
[sub-wake-up-call-request]
exten => s,1,NoOp(Wakeup Call Request)
 same => n,Answer()
 same => n,Set(TIMEOUT(response)=10)
 same => n,Playback(vpbx/vital-welcome-wake-up-call)
 same => n,Set(EXTENSION_NUMBER=${CALL_SOURCE})
 same => n,Set(CALL_CONTEXT=${COS_NAME})
 same => n,Set(LANGUAGE=${CHANNEL(language)})
 same => n,Set(WKP_TREE=${TENANT}/WAKE_UP)
 same => n,Set(EXT_TREE=${TENANT}/extensions)
 same => n,Set(WKP_REMOTE=no)
 same => n,GotoIf($["${ARG1}"="remote"]?:cwkp)
 same => n,Set(WKP_REMOTE=yes)
 same => n,Set(password=REDACTED
 same => n,GotoIf($["${password}"=""]?read_extension)
 same => n,Authenticate(${password})
 same => n(read_extension),Read(EXTENSION_NUMBER,vpbx/vital-remote-wake-up-call-number,,,3,5)
 same => n,GotoIf($["${EXTENSION_NUMBER}"=""]?read_extension)
 same => n,GotoIf(${DB_EXISTS(${EXT_TREE}/${EXTENSION_NUMBER}/context)}?:read_extension)
 same => n,Set(CALL_CONTEXT=${DB(${EXT_TREE}/${EXTENSION_NUMBER}/context)})
 same => n,Set(LANGUAGE=${DB(${EXT_TREE}/${EXTENSION_NUMBER}/language)})
 same => n(cwkp),Goto(create_wkp,1)

exten => create_wkp,1,NoOp(Wakeup Call ${ARG1})
 same => n,NoOp(New Wakeup Call)
 same => n,Set(WKP_CALLEE=Local/${EXTENSION_NUMBER}@${CALL_CONTEXT})
 same => n(read_time),Read(TIME,enter-a-time,4,,3,5)
 same => n,GotoIf($[${TIME:0:2}<24]?:time_error)
 same => n,GotoIf($[${TIME:2:2}<60]?:time_error)
 same => n,Goto(time_ok)
 same => n(time_error),Playback(time&error)
 same => n,Goto(read_time)
 same => n(time_ok),NoOp()
 same => n,Set(CURRENT_DATE=${STRFTIME($[${EPOCH}],,%Y%m%d)})
 same => n,Set(CURRENT_TIME=${STRFTIME($[${EPOCH}],,%H%M)})
 same => n,GotoIf($[${CURRENT_TIME} < ${TIME}]?:tomorrow)
 same => n,Set(EPOCH_TIME=${EPOCH})
 same => n,Set(WKP_TIME=${STRFTIME(${EPOCH_TIME},,%Y%m%d)}${TIME})
 same => n,Goto(continue_creation)
 same => n(tomorrow),NoOp(Wakeup Call for Tomorrow)
 same => n,Set(EPOCH_TIME=$[${EPOCH}+86400])
 same => n,Set(WKP_TIME=${STRFTIME(${EPOCH_TIME},,%Y%m%d)}${TIME})
 same => n(continue_creation),NoOp()
 same => n,Set(WKP_ID=WKP_${UNIQUEID})
 same => n,Set(WKP_NAME=${WKP_TIME}.${WKP_ID}.call)
 same => n,GotoIf(${DB_EXISTS(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_TIME})}?:create_call_file)
 same => n,NoOp(Wake up call already exist)
 same => n,Set(WKP_ID=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_TIME})})
 same => n,Set(WKP_NAME=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID})})
 same => n,Read(CANCEL_WKP,to-cancel-wakeup&press-1,1,,3,5)
 same => n,GotoIf($["${CANCEL_WKP}"="1"]?:end)
 same => n,DBdeltree(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID})
 same => n,DBdeltree(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_TIME})
 same => n,System(rm -f ${ASTSPOOLDIR}/outgoing/${WKP_NAME})
 same => n,Playback(wakeup-call-cancelled&for&extension)
 same => n,Saydigits(${EXTENSION_NUMBER})
 same => n,Playback(goodbye)
 same => n,Hangup()
 same => n(create_call_file),NoOp()
 same => n(read_options),Read(OPTION,"wakeup-for-one-time&press-1&for-a-daily-wakeup-call&press-2",1,,3,5)
 same => n,GotoIf($["${OPTION}"="1"]?:second_opt)
 same => n,Set(WKP_MODE=one_time)
 same => n,Goto(continue_file_creation)
 same => n(second_opt),GotoIf($["${OPTION}"="2"]?:read_options)
 same => n,Set(WKP_MODE=permanent)
 same => n(continue_file_creation),GoSub(sub-create-wake-up-file,s,1(${WKP_TIME},${WKP_CALLEE},${CALL_SOURCE},${WKP_ID},${WKP_TREE}))
 same => n,Playback(rqsted-wakeup-for&extension)
 same => n,Saydigits(${EXTENSION_NUMBER})
 same => n,Playback(goodbye)
 same => n(end),Hangup()

exten => h,1,NoOp(Hangup Call)
 same => n,GotoIf($["${WAKE_UP_CALL}"="yes"]?:end)
 same => n,Gosub(sub-create-wake-up-tree,s,1(${WKP_TREE},${EXTENSION_NUMBER},${WKP_TIME},${WKP_ID},${WKP_NAME},${WKP_MODE},${EPOCH_TIME},${TIME},${WKP_CALLEE},${LANGUAGE}))
 same => n,System(mv ${TEMP_FILE} ${ASTSPOOLDIR}/outgoing/${WKP_NAME})
 same => n(end),NoOp()

[sub-create-wake-up-tree]
exten => s,1,NoOp(Create Wake up tree)
 same => n,Set(DB(${ARG1}/${ARG2}/${ARG3})=${ARG4})
 same => n,Set(DB(${ARG1}/${ARG2}/${ARG4})=${ARG5})
 same => n,Set(DB(${ARG1}/${ARG2}/${ARG4}/time_id)=${ARG3})
 same => n,Set(DB(${ARG1}/${ARG2}/${ARG4}/mode)=${ARG6})
 same => n,Set(DB(${ARG1}/${ARG2}/${ARG4}/tries)=0)
 same => n,Set(DB(${ARG1}/${ARG2}/${ARG4}/max_tries)=3)
 same => n,Set(DB(${ARG1}/${ARG2}/${ARG4}/epoch_time)=${ARG7})
 same => n,Set(DB(${ARG1}/${ARG2}/${ARG4}/time)=${ARG8})
 same => n,Set(DB(${ARG1}/${ARG2}/${ARG4}/callee)=${ARG9})
 same => n,Set(DB(${ARG1}/${ARG2}/${ARG4}/language)=${ARG10})
 same => n,Return()

[sub-create-wake-up-file]
exten => s,1,NoOp(Create Wake Up Call Outgoing File)
  same => n,Set(WKP_CONTEXT=wake-up-call)
  same => n,Set(__TEMP_FILE=${ASTSPOOLDIR}/${ARG4}.call)
  same => n,System(echo "Channel: ${ARG2} \nMaxRetries: 2 \nRetryTime: 45 \nWaitTime: 30 \nCallerid: "WAKEUP CALL" <${ARG3}> \nContext: ${WKP_CONTEXT} \nExtension: s \nSetvar: EXTENSION_NUMBER=${ARG3} \nSetvar: WKP_TREE=${ARG5} \nSetvar: IGNORE_DIVERSIONS=yes \nSetvar: CALL_ORIGIN=feature \nSetvar: FEATURE_SERVICE=wake_up \nSetvar: WKP_ID=${ARG4}" > ${TEMP_FILE})
  same => n,System(touch -t ${ARG1} ${TEMP_FILE})
  same => n,Set(__WAKE_UP_CALL=yes)
  same => n,Return()

[wake-up-call]
exten => s,1,NoOp(WAKEUP CALL)
 same => n,NoCDR()
 same => n,GotoIf($["${WKP_NO_ANSWERED}"="yes"]?no_answer)
 same => n,Answer()
 same => n(no_answer),Set(WKP_TIME_ID=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/time_id)})
 same => n,Set(WKP_MODE=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/mode)})
 same => n,Set(WKP_LANG=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/language)})
 same => n,Set(WKP_TIME=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/time)})
 same => n,Set(EPOCH_TIME=${EPOCH})
 same => n,Set(WKP_CALLEE=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/callee)})
 same => n,Set(CHANNEL(language)=${WKP_LANG})
 same => n,GotoIf($["${WKP_MODE}"="permanent"]?:continue_wkp)
 same => n,Set(NEW_EPOCH_TIME=$[${EPOCH_TIME}+86400])
 same => n,Set(NEXT_WKP_TIME=${STRFTIME(${NEW_EPOCH_TIME},,%Y%m%d)}${WKP_TIME})
 same => n,Set(WKP_NAME=${NEXT_WKP_TIME}.${WKP_ID}.call)
 same => n,GoSub(sub-create-wake-up-file,s,1(${NEXT_WKP_TIME},${WKP_CALLEE},${EXTENSION_NUMBER},${WKP_ID},${WKP_TREE}))
 same => n,GotoIf($["${WKP_NO_ANSWERED}"="yes"]?end)
 same => n(continue_wkp),NoOp()
 same => n,Playback(this-is-yr-wakeup-call)
 same => n,GotoIf($["${WKP_SKIP_SNOOZE}"="yes"]?say-time)
 same => n,Read(SNOOZE_OPTION,"to-snooze-for&digits/5&minutes&press-1&digits/10&minutes&press-2&digits/15&minutes&press-3",1,,3,5)
 same => n,GotoIf($["${SNOOZE_OPTION}"=""]?say-time)
 same => n,GotoIf($[$[${SNOOZE_OPTION}=1]|$[${SNOOZE_OPTION}=2]|$[${SNOOZE_OPTION}=3]]?snooze,1)
 same => n(say-time),Playback(at-tone-time-exactly)
 same => n,Playback(beep)
 same => n,SayUnixTime(,,IMp)
 same => n(end),Hangup()

exten => snooze,1,NoOp(You've Decided to take a nap)
 same => n,Playback(vpbx/vital-snooze-for&digits/$[${SNOOZE_OPTION}*5]&minutes&activated&silence/1&goodbye)
 same => n,Set(WKP_POSTPONED=yes)
 same => n,Hangup()

exten => h,1,NoOp(Hangup Call)
 same => n,NoCDR()
 same => n,Set(__FEATURE_SERVICE=none)
 same => n,DBdeltree(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_TIME_ID})
 same => n,GotoIf($["${WAKE_UP_CALL}"="yes"]?:one_time)
 same => n,Set(DB(${WKP_TREE}/${EXTENSION_NUMBER}/${NEXT_WKP_TIME})=${WKP_ID})
 same => n,Set(DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID})=${WKP_NAME})
 same => n,Set(DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/time_id)=${NEXT_WKP_TIME})
 same => n,Set(DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/tries)=0)
 same => n,Set(DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/epoch_time)=${EPOCH_TIME})
 same => n,System(mv ${TEMP_FILE} ${ASTSPOOLDIR}/outgoing/${WKP_NAME})
 same => n(one_time),GotoIf($["${WKP_MODE}"="one_time"]?:test_snooze)
 same => n,DBdeltree(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID})
 same => n,ExecIf($["X${WKP_DB_ID}X"!="XX"]?Set(ODBC_WK-STATE()=${WKP_DB_ID},E))
 same => n(test_snooze),NoOp()
 same => n,GotoIf($["${WKP_POSTPONED}"="yes"]?:end)
 same => n,Set(SNOOZE_TIME=5)
 same => n,ExecIf($[${SNOOZE_OPTION}=2]?Set(SNOOZE_TIME=10))
 same => n,ExecIf($[${SNOOZE_OPTION}=3]?Set(SNOOZE_TIME=15))
 same => n,Set(SNOOZE_EPOCH=$[${EPOCH}+$[${SNOOZE_TIME}*60]])
 same => n,Set(SNOOZE_WKP_TIME=${STRFTIME(${SNOOZE_EPOCH},,%H%M)})
 same => n,Set(SNOOZE_WKP_DATE_TIME=${STRFTIME(${SNOOZE_EPOCH},,%Y%m%d%H%M)})
 same => n,Set(SNOOZE_WKP_ID=WKP_${UNIQUEID})
 same => n,Set(SNOOZE_WKP_NAME=${SNOOZE_WKP_DATE_TIME}.${SNOOZE_WKP_ID}.call)
 same => n,GoSub(sub-create-wake-up-file,s,1(${SNOOZE_WKP_DATE_TIME},${WKP_CALLEE},${EXTENSION_NUMBER},${SNOOZE_WKP_ID},${WKP_TREE}))
 same => n,Gosub(sub-create-wake-up-tree,s,1(${WKP_TREE},${EXTENSION_NUMBER},${SNOOZE_WKP_DATE_TIME},${SNOOZE_WKP_ID},${SNOOZE_WKP_NAME},one_time,${SNOOZE_EPOCH},${SNOOZE_WKP_TIME},${WKP_CALLEE},${WKP_LANG}))
 same => n,System(mv ${TEMP_FILE} ${ASTSPOOLDIR}/outgoing/${SNOOZE_WKP_NAME})
 same => n(end),NoOp()

[wake-up-no-answered]
exten => s,1,NoOp(Wake up call was not answered by ${EXTENSION_NUMBER})
 same => n,NoCDR()
 same => n,Set(FEATURE_SERVICE=none)
 same => n,Set(__WKP_NO_ANSWERED=yes)
 same => n,GotoIf(${DB_EXISTS(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID})}?:end)
 same => n,Set(TRIES=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/tries)})
 same => n,Set(MAX_TRIES=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/max_tries)})
 same => n,Set(WKP_MODE=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/mode)})
 same => n,Set(WKP_TIME_ID=${DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/time_id)})
 same => n,Set(TRIES=$[${TRIES}+1])
 same => n,Set(DB(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID}/tries)=${TRIES})
 same => n,GotoIf($[${TRIES}=${MAX_TRIES}]?:end)
 same => n,GoSubIf($["${WKP_MODE}"="permanent"]?wake-up-call,s,4)
 same => n,DBdeltree(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_TIME_ID})
 same => n,DBdeltree(${WKP_TREE}/${EXTENSION_NUMBER}/${WKP_ID})
 same => n,ExecIf($["X${WKP_DB_ID}X"!="XX"]?Set(ODBC_WK-STATE()=${WKP_DB_ID},F))
 same => n(end),Return()
;-------------------------------------------------------------------
;END WAKEUP CALL

