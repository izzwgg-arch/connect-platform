exten => s,1,NoOp(Dialing Ring Group Member: ${ARG1})
 same => n,Set(EXTENSION=${ARG1})
 same => n,Set(TENANT=56a4d7cbd1c39e31)
 same => n,Set(COS=${DB(${TENANT}/extensions/${EXTENSION}/context)})
 same => n,GotoIf($["X${COS}X"="XX"]?no-cos)
 same => n,Set(__DISABLE_CF_AA=TRUE)
 same => n,Set(__SKIP_CONTACT_SERVICES=TRUE)
 same => n,Set(__NO_POST_SERVICES=TRUE)
 same => n,Set(__SKIP_PLAYBACK=TRUE)
 same => n,Set(__CALL_ORIGIN=ring-group)
 same => n,Gosub(${COS},${EXTENSION},1)
