[parking-9-parkedcallstimeout]
exten => s,1,NoOp(Parking Timeout has been reached)
 same => n,Gosub(app-termination,hangup,1)
 same => n,Hangup()

[parking-9-callback]
exten => s,1,NoOp(Returning Call)
 same => n,Set(CALLBACK_EXT=${IF($["${CALL_TYPE}"="3"]?${CALLER}:${DESTINATION_NUMBER})})
 same => n,Set(CALLBACK_CTXT=${TRANSFER_CONTEXT})
 same => n,GotoIf($[$["${LEN(${CALLBACK_EXT})}"="0"]|$["${LEN(${CALLBACK_CTXT})}"="0"]]?end)
 same => n,Goto(${CALLBACK_CTXT},${CALLBACK_EXT},1)
 same => n(end),Hangup()

