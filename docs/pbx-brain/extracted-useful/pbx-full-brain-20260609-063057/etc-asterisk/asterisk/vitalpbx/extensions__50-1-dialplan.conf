[sip-default]
exten => s,1,NoOp(Guest call to extension S or without DID)
 same => n,Hangup()

exten => _.,1,NoOp(Guest call to DID ${EXTEN})
 same => n,Hangup()

[ext-followme]
exten => FW101,1,NoOp(Follow Me: FW101)
 same => n,ExecIf($["${LEN(${INBOUND_LANGUAGE})}"!="0"]?Set(CHANNEL(language)=${INBOUND_LANGUAGE}):Set(CHANNEL(language)=${DB(${TENANT}/extensions/101/language)}))
 same => n,Set(__RETURN_ON_EXTERNAL=yes)
 same => n,Set(__SKIP_PLAYBACK=${IF($["${QUEUE_CALL}"="TRUE"]?TRUE:${SKIP_PLAYBACK})})
 same => n,Set(CALLER_RECORDING=${ASTSPOOLDIR}/tmp/followme-${UNIQUEID}.wav)
 same => n,Set(__O_RING_TIME=30)
 same => n,Set(__SKIP_CONTACT_SERVICES=TRUE)
 same => n,Set(__SRC_APP=${IF($["${LEN(${SRC_APP})}"="0"]?FW101:${SRC_APP})})
 same => n,ExecIf($["${SKIP_PLAYBACK}"!="TRUE"]?Playback(followme/status):)
 same => n,ExecIf($["${SKIP_PLAYBACK}"!="TRUE"]?Playback(followme/pls-hold-while-try):)
 same => n(start-dialing),NoOp(Start Dialing)
 same => n,Gosub(sub-set-moh,s,1(default,YES))
 same => n,Set(__SKIP_CONTACT_SERVICES=FALSE)
 same => n,Return()

exten => h,1,NoOp(Finish Follow-me call)
 same => n,System(rm -f ${CALLER_RECORDING})

[FW101-confirm]
exten => s,1,NoOp(Confirm Call)
 same => n,ExecIf($["${LEN(${INBOUND_LANGUAGE})}"!="0"]?Set(CHANNEL(language)=${INBOUND_LANGUAGE}):Set(CHANNEL(language)=${DB(${TENANT}/extensions/101/language)}))
 same => n,Set(DIALED_NUMBER=${CUT(DIALEDPEERNUMBER,@,1)})
 same => n,Set(SOUND=${IF($["${LEN(${FWM_RECORDED_NAME})}"="0"]?followme/no-recording:followme/call-from&${FWM_RECORDED_NAME})})

[extvm-operator]
exten => VMO101,1,NoOp(Voicemail Operator for extension 101)
 same => n,Playback(disabled)
 same => n,Return()
 same => n,Hangup()

[ext-parking]
include => parking-1-parkedcalls

exten => 700,1,NoOp(Parking Call)
 same => n,Park(parking-1,c(parking-1-callback,s,1))

exten => _70[1-9],1,NoOp(Slot: ${CALL_DESTINATION})
