 same => n,Gosub(trk-11-dial,${NTD},1(${ARG1}))
 same => n,GotoIf($["${ARG1}"="from-trk-grp"]?come-back)
 same => n,Hangup()
 same => n(come-back),Return()

[trk-11-dial]
exten => _[-+*#0-9a-zA-Z].,1,NoOp(Trunk: Addb Builders)
 same => n,NoOp(Dialing: ${EXTEN})
 same => n,Set(CDR(trunk)=11)
 same => n,Set(TRUNK_DIALING_UTIME=${EPOCH})
 same => n,Set(SKIP_HANGUP_AUDIOS=no)
 same => n,Gosub(sub-setup-call-type,s,1(outgoing,${ICALL}))
 same => n,ExecIf($["${DB(${TENANT}/force_default_external_cid)}"="yes"]?Set(CALLERID(all)=${DB(${TENANT}/default_external_cid)}):)
 same => n,GotoIf(${DB_EXISTS(${TENANT}/allowed_sim_calls)}?:after-val-sim-calls)
 same => n,Set(MAX_TENANT_CALLS=${DB(${TENANT}/allowed_sim_calls)})
 same => n,Set(TENANT_NAME=${DB(${TENANT}/name)})
 same => n,GotoIf($[$[${MAX_TENANT_CALLS}>0]&$["${IS_EMERGENCY_CALL}"!="yes"]]?:after-val-sim-calls)
 same => n,NoOp(Allowed Simultaneous Calls for ${TENANT_NAME}: ${MAX_TENANT_CALLS})
 same => n,Set(GROUP()=${TENANT})
 same => n,NoOp(Current calls in progress: ${GROUP_COUNT()})
 same => n,GotoIf($[${GROUP_COUNT()} > ${MAX_TENANT_CALLS}]?:trk-conf)
 same => n,NoOp(The Tenant has reached the maximum number of allowed outbound calls)
 same => n,Set(DIALSTATUS=CONGESTION)
 same => n,Goto(after_dial)
 same => n(after-val-sim-calls),NoOp()
 same => n(trk-conf),NoOp(Configuring Trunk Parameters)
 same => n,ExecIf($["${TRUNK_MOH_SET}"!="yes"]?Set(CHANNEL(musicclass)=default):)
 same => n,Set(__TRUNK_MOH_SET=yes)
 same => n,GotoIf($[$["${EMERGENCY_CALL}"="yes"]&$["X${CALLERID(num)}X"!="XX"]]?after-overwrite)
 same => n,NoOp(Overwrite CID with trunk CID (forced))
 same => n,Set(CALLERID(all)="Addb Builders" <8452433057>)
 same => n(after-overwrite),NoOp(CID to be sent: ${CALLERID(all)})
 same => n,Set(DIAL_PREFIX=)
 same => n,Set(__TRKDIALOPTIONS=ktr)
 same => n,Set(ORIGINATOR=${IF($["${CALL_ORIGIN}"="diversions"]?${DIVERSION_ORIGIN}:${CALL_SOURCE})})
 same => n,Set(RING_TIME=${IF($["X${O_RING_TIME}X"="XX"]?90:${O_RING_TIME})})
 same => n,Set(CALLED=${EXTEN})
 same => n,Set(TRUNK_ENDPOINT=344022_Vaddb)
 same => n,Set(EXTRA_DIAL_OPTIONS=${EXTRA_DIAL_OPTIONS}b(sub-set-crm-headers^s^1))
 same => n,Set(__CIDNUM=${CALLERID(num)})
 same => n,Set(__CIDNAME=${CALLERID(name)})
 same => n,Set(FORCE_RECORDING=${IF($["${APP_RECORDING}"="yes"]?yes:no)})
 same => n,Set(FILTERED_NUMBER=${FILTER(0-9+*#,${DIAL_PREFIX}${EXTEN})})
 same => n,GotoIf($["${FAX_CALL}"="true"]?:post-fax)
 same => n,NoOp(Fax call detected)
 same => n,ExecIf($[${AST_OUTGOING_ATTEMPT}>1]?System(/usr/share/vitalpbx/scripts/virtual_faxes "updateFaxLogStatus" "${TENANT}" "${FAX_LOG}" "SENDING" ""):)
 same => n(post-fax),NoOp(End Fax Section)
 same => n,GotoIf($["${BLINDTRANSFER}"=""]?after_bfxer)
 same => n,Set(TRANSFER_FROM=${IF($[${LEN(${DID_NUMBER})}=0]?${CALLERID(num)}:${DID_NUMBER})})
 same => n,Gosub(sub-diversion-headers,s,1(${TRANSFER_FROM},deflection))
 same => n(after_bfxer),NoOp(Post Blind Transfer Detection...)
 same => n,Gosub(sub-setup-callrec-name,s,1)
 same => n,ExecIf($["${DIALER_CALL}"="yes"]?Set(CDR(source)=${CIDNUM}):)
 same => n,Dial(PJSIP/${FILTERED_NUMBER}@344022_Vaddb,${RING_TIME},${TRKDIALOPTIONS}${EXTRA_DIAL_OPTIONS}U(sub-before-bridging-call^${TENANT}^${ORIGINATOR}^${FILTERED_NUMBER}^${FORCE_RECORDING}))
 same => n,GotoIf($["${FAX_CALL}"="true"]?:after-fax)
 same => n,NoOp(Fax call detected)
 same => n,ExecIf($[${AST_OUTGOING_ATTEMPT}<${MAX_FAX_TRIES}]?System(/usr/share/vitalpbx/scripts/virtual_faxes "updateFaxLogStatus" "${TENANT}" "${FAX_LOG}" "QUEUED" ""):System(/usr/share/vitalpbx/scripts/virtual_faxes "updateFaxLogStatus" "${TENANT}" "${FAX_LOG}" "FAILED" "${DIALSTATUS}"))
 same => n(after-fax),NoOp(End Fax Section)
 same => n(after_dial),NoOp(After Dial)
 same => n,GotoIf($[$["${ARG1}"="from-trk-grp"]|$["${RETURN_ON_EXTERNAL}"="yes"]]?come-back)
 same => n,Hangup()
 same => n(come-back),Return()

