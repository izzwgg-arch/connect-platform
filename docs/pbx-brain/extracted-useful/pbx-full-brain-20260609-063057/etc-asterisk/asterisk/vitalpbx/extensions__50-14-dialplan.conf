[IVR-31]
exten => s,1,NoOp(IVR: MAin)
 same => n,Set(INVALIDATTEMPTS=0)
 same => n,Set(TIMEOUTATTEMPTS=0)
 same => n,Set(TIMEOUT(digit)=2)
 same => n,Set(TIMEOUT(response)=10)
 same => n,Set(__PBX_APP=QUEUE)
 same => n,Set(__PBX_APP_DESC=MAin)
 same => n,Answer()
 same => n(begin),NoOp(IVR Menu Begin)
 same => n(welcome-background),BackGround(/var/lib/vitalpbx/static/03efa0395977e053/recordings/d82c8d1619ad8176d665453cfb2e55f0)
 same => n(retry),NoOp(IVR Retry Section)
 same => n(retry-background),NoOp(No retry message)
 same => n,Set(CHANNEL(hangup_handler_push)=notify-call-hangup,s,1)
 same => n,WaitExten(10)

exten => 1,1,NoOp(Option 1 has been pressed)
