exten => _[*#+0-9].,1,NoOp(Direct Dial to extension ${EXTEN})
 same => n,System(/usr/share/vitalpbx/scripts/ivr_stats "31" "${EXTEN}" "${CALLERID(name)}" "${CALLERID(number)}" "${CALL_DESTINATION}" "${CDR(uniqueid)}")
 same => n,NoCDR()
