exten => 700,1,NoOp(Parking Call)
 same => n,Park(parking-11,c(parking-11-callback,s,1))

exten => _70[1-9],1,NoOp(Slot: ${CALL_DESTINATION})
 same => n,Set(RECORD_PARKING_LOT=no)
 same => n,Gosub(sub-parking-lots,s,1(${CALL_DESTINATION},parking-11,parking-11-parkedcalls))

exten => _710,1,NoOp(Slot: ${CALL_DESTINATION})
