exten => t,1,Set(TIMEOUTATTEMPTS=$[${TIMEOUTATTEMPTS}+1])
 same => n,GotoIf($[${TIMEOUTATTEMPTS}>=3]?timeout)
 same => n,BackGround(option-is-invalid)
 same => n,Goto(s,retry)
 same => n(timeout),BackGround(sorry-youre-having-problems&vm-goodbye)
 same => n,Goto(T6_cos-all,103,1)

exten => i,1,Set(INVALIDATTEMPTS=$[${INVALIDATTEMPTS}+1])
 same => n,GotoIf($[${INVALIDATTEMPTS}>=3]?invalid)
 same => n,ExecIf($["${INVALID_DIAL}"!="yes"]?BackGround(option-is-invalid):)
 same => n,Goto(s,retry)
 same => n(invalid),BackGround(sorry-youre-having-problems&vm-goodbye)
 same => n,Goto(T6_cos-all,103,1)

exten => invalid_dial,1,NoCDR()
 same => n,NoOp(Invalid Numbering Dial)
 same => n,Playback(silence/1&no-route-exists-to-dest&vm-pls-try-again)
 same => n,Set(INVALID_DIAL=yes)
 same => n,Goto(i,1)

exten => h,1,NoOp(IVR-18 call ended)
 same => n,Hangup()

[T6_ivr-only-extensions]
exten => _[*#+0-9].,1,Set(__CALL_ORIGIN=RESTRICTED_IVR_CALL)
 same => n,Goto(T6_cos-all,${EXTEN},1)
 same => n,Hangup()

exten => h,1,NoOp(Ending DIRECT DIAL ON IVR)
 same => n,Hangup()

[TG-3]
exten => s,1,NoOp(Time Group: Nexus Realty)
 same => n,Set(__TGMATCH=0)
 same => n,Set(TG_TIMEZONE=${IF($[${LEN(${TC_TIMEZONE})}=0]?:/usr/share/zoneinfo/${TC_TIMEZONE})})
 same => n,GotoIfTime(09:00-17:00,mon-thu,*,*,${TG_TIMEZONE}?match:)
 same => n,GotoIfTime(09:00-17:00,fri-sat,*,*,${TG_TIMEZONE}?match:)
 same => n,Return()
 same => n(match),Set(__TGMATCH=1)
 same => n,Return()

[T6_app-announcement]
exten => announcement-6,1,NoOp(Announcement: Nexus After Hours)
 same => n,Playback(/var/lib/vitalpbx/static/32a3be93ff315930/recordings/1c383cd30b7c298ab50293adfecb7b18)
 same => n,Goto(sub-extensions-vm,VM-102,1)

[T6_app-time-condition]
exten => TC-3,1,NoOp(Time Condition: Nexus Realty)
 same => n,Set(TC_TIMEZONE=America/New_York)
 same => n,Gosub(TG-3,s,1)
 same => n,NoOp(${TGMATCH})
 same => n,Set(OVERRIDE_STATE=${DB(${TENANT}/time_conditions/TC3/override)})
 same => n,GotoIf($["${OVERRIDE_STATE}"!="no"]?:check-default)
 same => n,GotoIf($["${OVERRIDE_STATE}"="force_match"]?match)
 same => n,GotoIf($["${OVERRIDE_STATE}"="force_unmatch"]?unmatch)
 same => n(check-default),GotoIf($[${TGMATCH} > 0]?match)
 same => n(unmatch),NoOp(Time Condition No Matched)
 same => n,Goto(T6_app-announcement,announcement-6,1)
 same => n,Hangup()
 same => n(match),NoOp(Time Condition Matched)
 same => n,Goto(T6_app-ivr,IVR-18,1)
 same => n,Hangup()

exten => 901,1,NoOp(Time Condition: Nexus Realty)
 same => n,Set(TC_TIMEZONE=America/New_York)
 same => n,Gosub(sub-toggle-tc-state,s,1(3,TG-3))
 same => n,Hangup()

[T6_app-ai-assistants]
exten => h,1,NoOp(HangUp Virtual Assistant call)
 same => n,ExecIf($["X${AUDIO_RESPONSE}X"!="XX"]?System(rm -f ${AUDIO_RESPONSE}.wav):)
 same => n,ExecIf($["X${CALLER_RECORDING}X"!="XX"]?System(rm -f ${CALLER_RECORDING}):)
 same => n,Hangup()


