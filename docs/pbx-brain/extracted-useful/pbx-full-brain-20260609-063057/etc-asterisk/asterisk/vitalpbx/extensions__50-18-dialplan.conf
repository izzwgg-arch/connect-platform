[T18_cos-all]
include => T18_cos-all-init


[T18_cos-all-init]
exten => _[-+*#0-9a-zA-Z].,1,NoOp(More than on digit pattern)
 same => n,Gosub(s,1(${EXTEN}))

exten => _[-+*#0-9a-zA-Z],1,NoOp(One Digit pattern)
 same => n,Gosub(s,1(${EXTEN}))

exten => i,1,NoOp(Invalid dial on init section)
 same => n,ForkCDR(e)
 same => n,ExecIf($[$["${FROM_QUEUE_CALLBACK}"="yes"]|$["${SRC_APP}"="IVR"]]?Hangup():)
 same => n,Goto(invalid-dest-cos,s,1)

exten => h,1,NoCDR()
 same => n,NoOp(Hanging Up the Call)
 same => n,Hangup()

exten => s,1,Set(EXTENSION=${ARG1})
 same => n,NoOp(Dialing ${EXTENSION} from ${CALLERID(num)})
 same => n,Gosub(sub-set-global-vars,s,1(fb6a694802f40408,${EXTENSION},parking-18))
 same => n,Gosub(sub-set-call-vars,s,1(fb6a694802f40408,${EXTENSION},19,T18_cos-all,T18_ARS-all))
 same => n,Gosub(sub-construct-cid,s,1)
 same => n,Gosub(T18_set-global-tenant-vars,s,1)
 same => n,GotoIf($["${CALL_ORIGIN}"="RESTRICTED_IVR_CALL"]?local-dialing)
 same => n,NoOp(Check if is an Emergency Call)
 same => n,GotoIf($[${DIALPLAN_EXISTS(T18_emergency-calls,${EXTENSION},1)}=1]?T18_emergency-calls,${EXTENSION},1)
 same => n,Gosub(sub-lockphone-check,s,1)
 same => n(local-dialing),Gosub(sub-local-dialing,s,1)
 same => n,GotoIf($["${CALL_ORIGIN}"="RESTRICTED_IVR_CALL"]?end-call)
 same => n,Set(OUTBOUND_PROFILE=${DB(${TENANT}/extensions/${CALL_SOURCE}/outbound_profile)})
 same => n,GotoIf($[$["${OUTBOUND_PROFILE}"="disabled"]|$["X${OUTBOUND_PROFILE}X"="XX"]]?post-dialing)
 same => n,GotoIf($[${DIALPLAN_EXISTS(${OUTBOUND_PROFILE},${EXTENSION},1)}=1]?${OUTBOUND_PROFILE},${EXTENSION},1)
 same => n(post-dialing),Goto(T18_cos-all-post,${EXTENSION},1)
 same => n(end-call),Hangup()

