exten => _[-+*#0-9a-zA-Z],1,NoOp(One Digit pattern)
 same => n,Gosub(s,1(${EXTEN}))

exten => i,1,NoOp(Invalid dial on init section)
 same => n,ForkCDR(e)
 same => n,ExecIf($[$["${FROM_QUEUE_CALLBACK}"="yes"]|$["${SRC_APP}"="IVR"]]?Hangup():)
 same => n,Goto(invalid-dest-cos,s,1)

exten => h,1,NoCDR()
 same => n,NoOp(Hanging Up the Call)
 same => n,Hangup()

exten => s,1,Set(EXTENSION=${ARG1})
 same => n,NoOp(Dialing ${EXTENSION} from ${CALLERID(num)})
 same => n,Gosub(sub-set-global-vars,s,1(59943f7a1616b24e,${EXTENSION},parking-7))
 same => n,Gosub(sub-set-call-vars,s,1(59943f7a1616b24e,${EXTENSION},7,T7_cos-all,T7_ARS-all))
 same => n,Gosub(sub-construct-cid,s,1)
 same => n,Gosub(T7_set-global-tenant-vars,s,1)
 same => n,GotoIf($["${CALL_ORIGIN}"="RESTRICTED_IVR_CALL"]?local-dialing)
 same => n,NoOp(Check if is an Emergency Call)
 same => n,GotoIf($[${DIALPLAN_EXISTS(T7_emergency-calls,${EXTENSION},1)}=1]?T7_emergency-calls,${EXTENSION},1)
 same => n,Gosub(sub-lockphone-check,s,1)
