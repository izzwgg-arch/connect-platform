[T7_ext-parking]
include => parking-7-parkedcalls

exten => 700,1,NoOp(Parking Call)
 same => n,Park(parking-7,c(parking-7-callback,s,1))

exten => _70[1-9],1,NoOp(Slot: ${CALL_DESTINATION})
 same => n,Set(RECORD_PARKING_LOT=no)
 same => n,Gosub(sub-parking-lots,s,1(${CALL_DESTINATION},parking-7,parking-7-parkedcalls))

exten => _710,1,NoOp(Slot: ${CALL_DESTINATION})
 same => n,Set(RECORD_PARKING_LOT=no)
 same => n,Gosub(sub-parking-lots,s,1(${CALL_DESTINATION},parking-7,parking-7-parkedcalls))

[parking-7-parkedcallstimeout]
exten => s,1,NoOp(Parking Timeout has been reached)
 same => n,Gosub(app-termination,hangup,1)
 same => n,Hangup()

[parking-7-callback]
exten => s,1,NoOp(Returning Call)
 same => n,Set(CALLBACK_EXT=${IF($["${CALL_TYPE}"="3"]?${CALLER}:${DESTINATION_NUMBER})})
 same => n,Set(CALLBACK_CTXT=${TRANSFER_CONTEXT})
 same => n,GotoIf($[$["${LEN(${CALLBACK_EXT})}"="0"]|$["${LEN(${CALLBACK_CTXT})}"="0"]]?end)
 same => n,Goto(${CALLBACK_CTXT},${CALLBACK_EXT},1)
 same => n(end),Hangup()

