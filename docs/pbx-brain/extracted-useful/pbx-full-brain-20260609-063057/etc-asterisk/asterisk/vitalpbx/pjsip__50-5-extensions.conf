[T5_101](p1)
type=endpoint
auth=authT5_101
identify_by=username,auth_username
outbound_auth=authT5_101
aors=T5_101
deny=0.0.0.0/0
contact_deny=0.0.0.0/0
permit=0.0.0.0/0
contact_permit=0.0.0.0/0
dtmf_mode=rfc4733
message_context=messages
set_var=DEVICENAME=T5_101
set_var=CHANNEL(parkinglot)=parking-5
allow=!all,ulaw,alaw,vp8,vp9,opus
subscribe_context=T5_extension-hints
language=en
moh_suggest=default
context=T5_cos-all
mailboxes=101@luxure_management-voicemail
device_state_busy_at=0
callerid="Simon Wertzberger" <101>

[authT5_101]
type=auth
auth_type=userpass
username=T5_101
password=REDACTED

[T5_101](p1-aor)
type=aor
max_contacts=5

