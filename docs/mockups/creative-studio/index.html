<title>Loopcom Creative Studio</title>
<meta name="description" content="Phase 0 interactive mockup of the Loopcom Creative Studio inside the Coworker. Not built. Example data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Tokens = apps/portal/app/globals.css (light 12223, dark 3409) + Creative Studio additions (stage, media kinds). */
:root{
  --bg:#f6f8fb; --bg-soft:#eef2f7; --panel:#ffffff; --panel-2:#f8fafc; --panel-3:#f1f5f9;
  --text:#0f172a; --text-dim:#475569; --text-faint:#94a3b8;
  --border:rgba(15,23,42,.12); --border-2:rgba(15,23,42,.07);
  --accent:#3b82f6; --accent-2:#2563eb; --accent-soft:rgba(59,130,246,.12); --on-accent:#fff;
  --success:#16a34a; --warning:#d97706; --danger:#dc2626; --info:#2563eb;
  --ok-soft:rgba(22,163,74,.10); --warn-soft:rgba(217,119,6,.12); --bad-soft:rgba(220,38,38,.10);
  --card-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px -18px rgba(15,23,42,.25);
  --pop-shadow:0 24px 60px -20px rgba(15,23,42,.35),0 2px 8px rgba(15,23,42,.08);
  --stage:#e6eaf0; --stage-grid:rgba(15,23,42,.05); --monitor:#05080c;
  --k-video:#3b82f6; --k-gfx:#7c6cf0; --k-cap:#d99a1e; --k-vo:#1b9e8f; --k-music:#d4588f; --k-sfx:#3f9d4b;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1218; --bg-soft:#101923; --panel:#141f2b; --panel-2:#1a2635; --panel-3:#213043;
    --text:#e1e9f1; --text-dim:#8ea0b2; --text-faint:#62768a;
    --border:#26374a; --border-2:#1f2e3f;
    --accent:#22a8ff; --accent-2:#4f7bff; --accent-soft:rgba(34,168,255,.13); --on-accent:#04121d;
    --success:#34c27b; --warning:#f0b655; --danger:#ea6068; --info:#4ab2ff;
    --ok-soft:rgba(52,194,123,.12); --warn-soft:rgba(240,182,85,.13); --bad-soft:rgba(234,96,104,.13);
    --card-shadow:0 10px 28px -22px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.03);
    --pop-shadow:0 24px 60px -18px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.4);
    --stage:#0a1017; --stage-grid:rgba(255,255,255,.035); --monitor:#030507;
    --k-video:#3f9dff; --k-gfx:#8f82ff; --k-cap:#e5ab3a; --k-vo:#2cb9a8; --k-music:#e06fa2; --k-sfx:#56b865;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1218; --bg-soft:#101923; --panel:#141f2b; --panel-2:#1a2635; --panel-3:#213043;
  --text:#e1e9f1; --text-dim:#8ea0b2; --text-faint:#62768a;
  --border:#26374a; --border-2:#1f2e3f;
  --accent:#22a8ff; --accent-2:#4f7bff; --accent-soft:rgba(34,168,255,.13); --on-accent:#04121d;
  --success:#34c27b; --warning:#f0b655; --danger:#ea6068; --info:#4ab2ff;
  --ok-soft:rgba(52,194,123,.12); --warn-soft:rgba(240,182,85,.13); --bad-soft:rgba(234,96,104,.13);
  --card-shadow:0 10px 28px -22px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.03);
  --pop-shadow:0 24px 60px -18px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.4);
  --stage:#0a1017; --stage-grid:rgba(255,255,255,.035); --monitor:#030507;
  --k-video:#3f9dff; --k-gfx:#8f82ff; --k-cap:#e5ab3a; --k-vo:#2cb9a8; --k-music:#e06fa2; --k-sfx:#56b865;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-inline:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:14px;height:14px}.ic.lg{width:20px;height:20px}.ic.xl{width:26px;height:26px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--text-dim)}.faint{color:var(--text-faint)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- mockup strip ---------- */
.strip{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--border);font-size:12.5px}
.strip b{font-weight:700}
.tagm{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--warning);background:var(--warn-soft);padding:2px 8px;border-radius:99px}
.strip .grow{flex:1}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--text-dim);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 42px)}
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:42px;height:calc(100vh - 42px);overflow:hidden}
.sb-profile{display:flex;gap:10px;align-items:center;padding:14px 14px 10px}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.sb-tenant{font-size:12px;color:var(--text-dim);line-height:1.3}
.sb-tenant b{display:block;color:var(--text);font-size:13px}
.sb-nav{flex:1;overflow-y:auto;padding:4px 10px 14px}
.sb-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:700;padding:14px 8px 5px;display:flex;align-items:center;gap:6px}
.sb-link{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;min-height:34px;border:0;background:transparent;border-radius:9px;padding:3px 8px 3px 4px;text-align:left;font-size:13px;color:var(--text);position:relative}
.sb-link:hover{background:var(--panel-2)}
.sb-link[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.sb-link[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent)}
.sb-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--text-dim);background:var(--panel-2)}
.sb-link[aria-current="page"] .sb-ico{color:var(--accent);background:transparent}
.sb-badge{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.sb-badge.new{background:var(--ok-soft);color:var(--success)}
.sb-sub{font-size:11px;color:var(--text-faint);font-weight:500;letter-spacing:0;text-transform:none}

.workspace{min-width:0;display:flex;flex-direction:column}
.topbar{height:54px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:42px;z-index:30}
.wm{height:26px;width:auto;display:block}
.wm-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wm-light{display:none}:root:not([data-theme="light"]) .wm-dark{display:block}}
:root[data-theme="dark"] .wm-light{display:none}:root[data-theme="dark"] .wm-dark{display:block}
.tb-search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:6px 10px;color:var(--text-faint);font-size:13px}
.tb-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.navtoggle{display:none}
.content{padding:18px 24px 60px;min-width:0}

/* ---------- page furniture ---------- */
.ribbon{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);margin-bottom:10px}
.crumb{font-size:12px;color:var(--text-faint);display:flex;gap:6px;align-items:center}
.pagehead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.pagehead h2{font-size:22px;letter-spacing:-.015em;font-weight:700}
.pagehead p{color:var(--text-dim);max-width:70ch;margin-top:3px}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--card-shadow);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h3{font-size:15px;font-weight:650}
.card-h .sub{font-size:12px;color:var(--text-dim)}
.card-h .end{margin-left:auto;display:flex;gap:6px;align-items:center}
.seclbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--text-faint);margin:0 0 8px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--text)}
.btn:hover{border-color:var(--text-faint)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px;gap:5px}
.btn.lg{padding:10px 18px;font-size:14px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--text-dim)}
.iconbtn:hover{background:var(--panel-2);color:var(--text)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--panel-3);color:var(--text-dim)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nub::before{display:none}
.pill.ok{background:var(--ok-soft);color:var(--success)}
.pill.warn{background:var(--warn-soft);color:var(--warning)}
.pill.bad{background:var(--bad-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500;color:var(--text-dim);display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--text)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text);font-weight:600}
.input,.select,textarea.input{width:100%;min-height:34px;border:1px solid var(--border);background:var(--panel-2);border-radius:8px;padding:6px 10px;font-size:13px;outline:none}
.input:focus,.select:focus{border-color:var(--accent)}
textarea.input{resize:vertical;line-height:1.45}
label.fld{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--text-dim)}
.help{font-size:11.5px;color:var(--text-faint);font-weight:400}
.sw{position:relative;width:36px;height:20px;border-radius:99px;background:var(--panel-3);border:1px solid var(--border);flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{left:18px}
.twrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--text-dim);background:var(--panel-2);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--border-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--border);margin:12px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--text-dim)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.note{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);background:var(--panel-2);border-radius:12px;padding:10px 12px;font-size:12.5px}
.note.warn{border-color:color-mix(in srgb,var(--warning) 45%,transparent);background:var(--warn-soft)}
.note.bad{border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:var(--bad-soft)}
.note.ok{border-color:color-mix(in srgb,var(--success) 40%,transparent);background:var(--ok-soft)}
.note.info{border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.note .ic{margin-top:2px}
.bar{height:6px;border-radius:6px;background:var(--panel-3);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px;transition:width .25s}
.bar.ok i{background:var(--success)}.bar.warn i{background:var(--warning)}.bar.bad i{background:var(--danger)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--panel-3);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--panel-2),var(--panel-3),var(--panel-2));background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--panel-3);color:var(--text)}
.avatar.cw{background:radial-gradient(circle at 35% 30%,#4fc3ff,#1d6fe0 70%);color:#fff}

/* media / art */
canvas.art{display:block;width:100%;height:100%;background:#0a1220}
.thumb{position:relative;border-radius:10px;overflow:hidden;background:#0a1220;aspect-ratio:16/9}
.thumb.sq{aspect-ratio:1}.thumb.v{aspect-ratio:9/16}.thumb.p45{aspect-ratio:4/5}
.thumb .badge{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:1px 7px;border-radius:99px;display:flex;gap:4px;align-items:center}
.thumb .badge.r{left:auto;right:6px}
.thumb .dur{position:absolute;right:6px;bottom:6px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:0 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.player{position:relative;background:var(--monitor);border-radius:12px;overflow:hidden}
.player .ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:18px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:12px}
.player .ctrl .bar{flex:1;height:4px;background:rgba(255,255,255,.25)}
.player .ctrl .bar i{background:#fff}
.player .ctrl button{background:transparent;border:0;color:#fff;display:grid;place-items:center;padding:2px}
.capline{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);color:#fff;font-weight:700;font-size:clamp(12px,2vw,17px);text-shadow:0 2px 6px rgba(0,0,0,.7);white-space:nowrap}
.capline em{font-style:normal;color:#5cc8ff}

/* coworker bits (shared with the approved Coworker mockup) */
.cw-steps{border:1px solid var(--border);border-radius:10px;background:var(--panel-2);overflow:hidden}
.cw-steps-h{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:11.5px;color:var(--text-dim);border-bottom:1px solid var(--border)}
.cw-steps-h b{color:var(--text)}
.cw-steps-h .t{margin-left:auto;font-variant-numeric:tabular-nums}
.cw-step{display:flex;align-items:center;gap:9px;padding:6px 10px;font-size:12.5px;border-top:1px solid var(--border-2)}
.cw-step:first-of-type{border-top:0}
.cw-step .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-step .st{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.tool{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px 1px 5px;border-radius:99px;white-space:nowrap}
.tool.media{color:var(--k-gfx);background:color-mix(in srgb,var(--k-gfx) 14%,transparent)}
.ok-ic{color:var(--success)}.warn-ic{color:var(--warning)}.bad-ic{color:var(--danger)}
.approve{border:1px solid var(--warning);background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.approve-h{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--warning)}
.msg-user{align-self:flex-end;max-width:80%;background:var(--accent);color:var(--on-accent);padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:13.5px}
.msg-ai{display:flex;gap:10px;align-items:flex-start}
.msg-ai .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.typing{display:flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-faint);animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-4px);opacity:.5}}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(8,12,18,.55);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--pop-shadow);width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:16px;flex:1}
.modal-b{padding:16px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border);align-items:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:90;box-shadow:var(--pop-shadow);display:flex;gap:8px;align-items:center}

/* floating coworker bubble */
.bubble{position:fixed;right:22px;bottom:22px;width:54px;height:54px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#4fc3ff,#1d6fe0 70%);box-shadow:0 10px 26px rgba(34,120,255,.45);color:#fff;display:grid;place-items:center;z-index:60}
.bubble .dot{position:absolute;top:1px;right:1px;width:13px;height:13px;border-radius:50%;background:var(--warning);border:2px solid var(--panel);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.2);opacity:.7}}
.pop{position:fixed;right:22px;bottom:88px;width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--pop-shadow);z-index:61;overflow:hidden}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:42px;bottom:0;width:260px;z-index:70;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--pop-shadow)}
  body.nav-open .sidebar{transform:none}
  .navtoggle{display:grid}
  .tb-search{display:none}
