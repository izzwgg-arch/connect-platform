<title>Loopcom Community</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Loopcom Community — high-fidelity mockups on the CONNECT theme tokens.
   Tokens are copied from apps/portal/app/globals.css: bare :root is DARK,
   light is the opt-in [data-theme="light"] override — the same convention the
   portal uses (useAppContext stamps <html data-theme>). The page never reads
   prefers-color-scheme: the in-page switch is the only lever, like the app.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0c1218;--bg-soft:#101923;--panel:#141f2b;--panel-2:#1a2635;
  --text:#e1e9f1;--text-dim:#8ea0b2;--accent:#22a8ff;--accent-2:#4f7bff;
  --border:#26374a;--success:#34c27b;--warning:#f0b655;--danger:#ea6068;--info:#4ab2ff;
  --shadow:0 8px 30px rgba(0,0,0,.24);
  --ink-success:#34c27b;--ink-warning:#f0b655;--ink-danger:#ea6068;
  --ring:rgba(34,168,255,.28);--soft:color-mix(in srgb,var(--accent) 14%,transparent);
  --radius:12px;--radius-lg:16px;
  --font:Inter,"Segoe UI",Roboto,Arial,sans-serif;
}
:root[data-theme="light"],.lc[data-theme="light"]{
  --bg:#f6f8fb;--bg-soft:#f8fafc;--panel:#ffffff;--panel-2:#f8fafc;
  --text:#0f172a;--text-dim:#475569;--accent:#3b82f6;--accent-2:#2563eb;
  --border:color-mix(in srgb,rgba(15,23,42,.08) 78%,#94a3b8);
  --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --shadow:0 12px 40px rgba(0,0,0,.08);
  --ink-success:#0f7a4a;--ink-warning:#8a5a00;--ink-danger:#b42318;
  --ring:rgba(59,130,246,.18);--soft:color-mix(in srgb,var(--accent) 11%,transparent);
}
.lc[data-theme="dark"]{
  --bg:#0c1218;--bg-soft:#101923;--panel:#141f2b;--panel-2:#1a2635;
  --text:#e1e9f1;--text-dim:#8ea0b2;--accent:#22a8ff;--accent-2:#4f7bff;
  --border:#26374a;--success:#34c27b;--warning:#f0b655;--danger:#ea6068;--info:#4ab2ff;
  --shadow:0 8px 30px rgba(0,0,0,.24);
  --ink-success:#34c27b;--ink-warning:#f0b655;--ink-danger:#ea6068;
  --ring:rgba(34,168,255,.28);--soft:color-mix(in srgb,var(--accent) 14%,transparent);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.lc{min-height:100%;background:var(--bg);color:var(--text)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── viewer chrome (NOT part of the product) ─────────────────────────── */
.vbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:14px;padding:10px 16px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.vbar img{height:26px;width:auto}
.vbar .vt{font-weight:700;font-size:13px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase}
.vbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--panel-2)}
.seg button{padding:5px 12px;border-radius:999px;font-weight:600;font-size:12.5px;color:var(--text-dim)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.vwrap{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 47px)}
.vnav{border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:47px;height:calc(100vh - 47px);overflow:auto;background:var(--bg-soft)}
.vnav .grp{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);padding:12px 10px 6px}
.vnav button{display:flex;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-weight:500;color:var(--text-dim);gap:8px;align-items:center}
.vnav button:hover{background:var(--soft);color:var(--text)}
.vnav button[aria-current="true"]{background:var(--soft);color:var(--accent);font-weight:600}
.vnav button .n{font-size:11px;color:var(--text-dim);margin-left:auto;font-variant-numeric:tabular-nums}
.vmain{padding:18px 20px 60px;min-width:0}
.vhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.vhead h1{font-size:20px;font-weight:700}
.vhead p{color:var(--text-dim);max-width:70ch}
.frame{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
.frame .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.frame .bar i{width:10px;height:10px;border-radius:50%;background:var(--border);display:inline-block}
.frame .bar .url{margin-left:8px;flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.note{margin-top:14px;padding:12px 14px;border:1px dashed var(--border);border-radius:10px;color:var(--text-dim);font-size:13px;line-height:1.55}
.note b{color:var(--text)}
@media (max-width:900px){.vwrap{grid-template-columns:1fr}.vnav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;border-right:0;border-bottom:1px solid var(--border)}.vnav .grp{width:100%}.vnav button{width:auto}.vmain{padding:14px 16px 40px}}

/* ── product: shell ──────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:640px;background:var(--bg)}
.side{background:var(--bg-soft);border-right:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.side .logo img{height:28px;width:auto}
.side .logo .cm{font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);border-left:1px solid var(--border);padding-left:10px}
.side .sec{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);padding:12px 10px 5px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--text-dim);font-weight:500;font-size:13.5px}
.nav:hover{background:var(--soft);color:var(--text)}
.nav.on{background:var(--soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav .b{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--border)}
.side .me small{display:block;color:var(--text-dim);font-size:11.5px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
.top .q{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:7px 12px;color:var(--text-dim);font-size:13px}
.top .q kbd{margin-left:auto;font:600 10.5px var(--font);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--text-dim)}
.top .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-dim);position:relative;border:1px solid transparent}
.ib:hover{background:var(--soft);color:var(--text)}
.ib .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--panel)}
.content{padding:18px;display:grid;gap:16px}
.two{grid-template-columns:minmax(0,1fr) 300px}
.three{grid-template-columns:250px minmax(0,1fr) 300px}
@media (max-width:1100px){.two,.three{grid-template-columns:1fr}}
.col{display:grid;gap:16px;align-content:start;min-width:0}

/* ── product: primitives ─────────────────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.card.tight{padding:12px 14px}
.card.hair{position:relative;overflow:hidden}
.card.hair::before{content:"";position:absolute;inset:-1px -1px auto;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent)}
.ct{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:10px}
.ct .more{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.p{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.btn.g{background:transparent;border-color:transparent;color:var(--text-dim)}
.btn.g:hover{background:var(--soft);color:var(--text)}
.btn.d{color:var(--ink-danger)}
.btn.s{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.w{width:100%;justify-content:center}
.btn svg.i{width:16px;height:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.av{border-radius:50%;display:inline-grid;place-items:center;font-weight:700;color:#fff;flex:none;letter-spacing:.02em;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.av.sq{border-radius:10px}
.av.t2{background:linear-gradient(135deg,#1c7c54,#34c27b)}
.av.t3{background:linear-gradient(135deg,#8a5a00,#f0b655)}
.av.t4{background:linear-gradient(135deg,#6d28d9,#a78bfa)}
.av.t5{background:linear-gradient(135deg,#0e7490,#22d3ee)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim)}
.chip.ok{color:var(--ink-success);border-color:color-mix(in srgb,var(--success) 40%,transparent);background:color-mix(in srgb,var(--success) 12%,transparent)}
.chip.warn{color:var(--ink-warning);border-color:color-mix(in srgb,var(--warning) 45%,transparent);background:color-mix(in srgb,var(--warning) 12%,transparent)}
.chip.bad{color:var(--ink-danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.chip.ac{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--soft)}
.chip.sel{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.chip svg.i{width:12px;height:12px;stroke-width:2.4}
.dim{color:var(--text-dim)}
.sm{font-size:12.5px}.xs{font-size:11.5px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;display:block}
.in{width:100%;background:var(--bg-soft);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font:inherit;font-size:13.5px}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.in.ph{color:var(--text-dim)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{padding:9px 13px;font-weight:600;font-size:13px;color:var(--text-dim);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button .n{color:var(--text-dim);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.list{display:grid;gap:10px}
.li{display:flex;gap:12px;align-items:flex-start}
.li .t{min-width:0;flex:1}
.li .t b{display:block;font-weight:600}
.li .t small{display:block;color:var(--text-dim);font-size:12.5px}
.sw{display:inline-block;width:34px;height:20px;border-radius:999px;background:var(--border);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}.sw.on::after{left:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700}
.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.stat{display:grid;gap:2px}
.stat b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat small{color:var(--text-dim);font-size:12px}
.stat .d{font-size:12px;font-weight:600;color:var(--ink-success)}
.stat .d.n{color:var(--ink-danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--text-dim)}.kv dd{margin:0;font-weight:500}
.why{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-dim);padding:6px 10px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.cover{height:120px;border-radius:12px 12px 0 0;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 55%,var(--panel)),color-mix(in srgb,var(--accent-2) 60%,var(--panel)) 60%,var(--panel-2));position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:auto -60px -140px auto;width:360px;height:360px;border-radius:50%;border:44px solid rgba(255,255,255,.08)}
.post{display:grid;gap:10px}
.post .hd{display:flex;gap:10px;align-items:flex-start}
.post .hd b{font-weight:600}
.post .hd small{display:block;color:var(--text-dim);font-size:12px}
.post .hd .x{margin-left:auto;color:var(--text-dim)}
.post .img{height:190px;border-radius:10px;background:linear-gradient(160deg,var(--panel-2),color-mix(in srgb,var(--accent) 22%,var(--panel-2)));border:1px solid var(--border);display:grid;place-items:center;color:var(--text-dim);font-size:12px}
.post .acts{display:flex;gap:2px;border-top:1px solid var(--border);padding-top:8px}
.post .acts button{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:8px;color:var(--text-dim);font-weight:600;font-size:12.5px}
.post .acts button:hover{background:var(--soft);color:var(--text)}
.post .acts .r{margin-left:auto}
.cnt{display:flex;gap:10px;font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.embed{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg-soft);display:grid;gap:8px}
.embed .k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.step{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--text-dim)}
.step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11px;border:1px solid var(--border)}
.step.done i{background:var(--success);color:#fff;border-color:transparent}
.step.now{color:var(--text);font-weight:600}.step.now i{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.prog{height:6px;border-radius:999px;background:var(--border);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.bubble{max-width:72%;padding:9px 12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--border);font-size:13.5px}
.bubble.me{margin-left:auto;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.bubble small{display:block;font-size:10.5px;opacity:.7;margin-top:3px;text-align:right}
.rx{display:inline-flex;gap:4px;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--border);margin-top:-6px}
.sev{width:4px;border-radius:2px;align-self:stretch;flex:none}
.auth{min-height:640px;display:grid;place-items:center;background:radial-gradient(900px 500px at 20% -10%,var(--soft),transparent 60%),radial-gradient(700px 400px at 100% 100%,color-mix(in srgb,var(--accent-2) 12%,transparent),transparent 60%),var(--bg);padding:32px 16px}
.authcard{width:min(440px,100%);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px;position:relative;box-shadow:var(--shadow);display:grid;gap:14px}
.authcard::before{content:"";position:absolute;inset:-1px -1px auto;height:2px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent)}
.authcard img{height:34px;width:auto;justify-self:center}
.or{display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.land{background:var(--bg)}
.land .nav0{display:flex;align-items:center;gap:20px;padding:16px 40px;border-bottom:1px solid var(--border)}
.land .nav0 img{height:28px}
.land .nav0 a{color:var(--text-dim);font-weight:600;font-size:13.5px}
.land .hero{padding:64px 40px 48px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;background:radial-gradient(800px 420px at 0% 0%,var(--soft),transparent 60%)}
.land .hero h1{font-size:44px;font-weight:800;line-height:1.08;letter-spacing:-.03em}
.land .hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.land .hero p{font-size:16.5px;color:var(--text-dim);max-width:52ch;margin-top:14px}
.land .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 40px 56px}
.land .pillars .card h3{font-size:16px;margin:10px 0 6px}
.land .pillars .card p{color:var(--text-dim);font-size:13.5px}
.land .pic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.land footer{padding:20px 40px;border-top:1px solid var(--border);color:var(--text-dim);font-size:12.5px;display:flex;gap:18px;flex-wrap:wrap}
@media (max-width:900px){.land .hero{grid-template-columns:1fr;padding:36px 20px}.land .hero h1{font-size:32px}.land .pillars{grid-template-columns:1fr;padding:0 20px 36px}.land .nav0,.land footer{padding-inline:20px}}
.phones{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.phone{width:320px;max-width:100%;border-radius:44px;background:#0b0f14;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid #2a3340;flex:none}
.phone.android{border-radius:30px}
.phone .scr{border-radius:36px;overflow:hidden;background:var(--bg);color:var(--text);height:640px;display:flex;flex-direction:column;position:relative}
.phone.android .scr{border-radius:22px}
.phone .sb{display:flex;justify-content:space-between;padding:12px 24px 4px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.phone .isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:28px;border-radius:999px;background:#0b0f14}
.phone.android .hole{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#0b0f14}
.phone .body{flex:1;overflow:hidden;padding:8px 14px;display:grid;gap:10px;align-content:start;font-size:13px}
.phone .tab{display:flex;justify-content:space-around;padding:8px 6px 16px;border-top:1px solid var(--border);background:var(--panel)}
.phone .tab div{display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--text-dim)}
.phone .tab div.on{color:var(--accent)}
.phone .tab .fab{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 20px var(--ring)}
.phone .home{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:999px;background:var(--text);opacity:.6}
.phone .hdr{display:flex;align-items:center;gap:10px;padding:4px 0 2px;font-weight:700;font-size:17px}
.phone .hdr img{height:22px}
.phone .hdr .sp{flex:1}
.phone .cap{font-size:11px;color:var(--text-dim);text-align:center;margin-top:8px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.swatch{border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:11.5px}
.swatch i{display:block;height:46px}
.swatch div{padding:6px 8px;background:var(--panel)}
.swatch code{display:block;color:var(--text-dim);font-size:10.5px}
.tscale div{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border)}
.tscale code{color:var(--text-dim);font-size:11px;width:150px;flex:none}
.admin{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:640px}
.admin .aside{background:var(--bg-soft);border-right:1px solid var(--border);padding:14px 10px}
.admin .aside .nav{font-size:13px}
.spark{width:100%;height:120px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const av = (name, size=36, tone='', sq=false) => {

S.mobile = { title:'iPhone & Android', desc:'Native-feeling screens on the same tokens. iPhone gets the tab bar with a raised Post action and the home indicator; Android gets predictive back, Material-height bars and the system nav gesture area. Same backend, same rules.',
  note:'Strategy (from the audit): extend the existing <b>Expo 54 / React Native 0.81</b> app in <code>apps/mobile</code> — it already has the theme tokens, push (FCM/APNs), CallKit, deep-link plumbing and the store accounts. Community ships as a tab set inside it; a person without phone service sees Community tabs only. Passkeys via the platform WebAuthn APIs; QR via the existing scanner; camera/photos/contacts permissions are all optional paths.',
  render(){ const tab=(on)=>`<div class="tab">${[['home','Home'],['people','Network'],['plus','Post'],['chat','Messages'],['people','Me']].map(([i,l],k)=>k===2?`<div><span class="fab">${ico('plus')}</span></div>`:`<div class="${on===k?'on':''}">${ico(i)}${l}</div>`).join('')}</div>`;
  const feedBody=`<div class="hdr"><img src="${NAV}" alt="Loopcom"><span class="sp"></span>${ico('search')}${ico('bell')}</div>
    <div class="pill-row" style="flex-wrap:nowrap;overflow:hidden">${chip('For you','sel')}${chip('Following')}${chip('Local')}${chip('Opportunities')}</div>
    <div class="card tight post" style="gap:8px"><div class="hd">${av('Rivky Stern',34,'t4')}<div><b>Rivky Stern</b><small>Stern Promo · 2nd · 4h</small></div></div><p class="sm">PSA for year-end gifts: Gildan moved their heavyweight blanks to a new dye lot and the navy is lighter…</p><div class="cnt"><span>41 reactions</span><span>9 comments</span></div><div class="acts"><button>${ico('like')}</button><button>${ico('msg')}</button><button>${ico('repost')}</button><button class="r">${ico('save')}</button></div></div>
    <div class="card tight post" style="gap:8px"><div class="hd">${av('Camp Bnos Yisroel',34,'t3',true)}<div><b>Camp Bnos Yisroel</b><small>Yanky Gross · 1st · 6h</small></div></div><div class="embed" style="padding:10px"><span class="k">RFQ · closes Oct 6</span><b class="sm">25 embroidered jackets, Monroe by Oct 20</b><div class="row">${btn('Quote','p s')}${btn('Ask','s')}</div></div></div>`;
  const profBody=`<div class="hdr">${ico('back')}<span class="sp"></span>${ico('qr')}${ico('dots')}</div>
    <div class="cover" style="height:70px;border-radius:12px"></div><div class="row" style="margin-top:-30px;padding-left:8px">${av('Shloimy Weiss',60)}</div>
    <div><b style="font-size:17px">Shloimy Weiss</b><p class="dim sm">Owner, Weiss Embroidery &amp; Uniforms · Monroe, NY</p><div class="pill-row" style="margin-top:6px">${vchip('Phone')}${vchip('Business')}${chip('Loopcom','ac','link')}</div></div>
    <div class="row" style="gap:6px">${btn('Message','p s','msg')}${btn('Call','s','phone')}${btn('Quote','s','quote')}${btn('Connect','s','plus')}</div>
    <div class="card tight"><b class="sm">About</b><p class="sm dim">Second-generation embroidery shop. 4 Tajima heads, in-house digitizing, 5-day turnaround on repeat orders…</p></div>
    <div class="card tight"><b class="sm">In your network</b><p class="sm dim">14 mutual · 3 people you know are verified customers</p></div>`;
  const msgBody=`<div class="hdr">${ico('back')}${av('Yanky Gross',30,'t2')}<div style="line-height:1.1"><b style="font-size:14px">Yanky Gross</b><small class="dim" style="display:block;font-size:11px;font-weight:500">online</small></div><span class="sp"></span>${ico('phone')}${ico('video')}</div>
    <div style="display:grid;gap:8px;align-content:end;flex:1;padding-top:8px"><div class="bubble" style="max-width:86%">Can you do the 25 jackets in navy with gold thread instead of white?<small>10:12</small></div><div class="row" style="justify-content:flex-end"><div class="bubble me" style="max-width:86%">Yes — same price. Standard gold is included. Want me to update the quote?<small>10:14 · read</small></div></div><div class="bubble" style="max-width:86%">Standard gold. Yes please, and one sample first?<small>10:15</small></div><div class="row" style="justify-content:flex-end"><div class="embed" style="max-width:86%;padding:10px"><span class="k">Quote updated</span><b class="sm">25 × jackets — $1,875 · sample in 3 days</b></div></div></div>
    <div class="row" style="border-top:1px solid var(--border);padding-top:8px;margin:0 -14px;padding-inline:10px">${ico('plus')}<div class="in" style="flex:1;padding:7px 10px">Message</div>${ico('mic')}${ico('send')}</div>`;
  const rfqBody=`<div class="hdr">${ico('back')}<b style="font-size:15px">Quotes (3)</b><span class="sp"></span>${ico('share')}</div>
    <div class="card tight"><div class="row" style="justify-content:space-between"><span class="chip ok">${ico('check')}Open · Oct 6</span><small class="dim xs">RFQ-2026-1188</small></div><b class="sm" style="display:block;margin-top:6px">25 custom embroidered jackets, Monroe by Oct 20</b></div>
    ${[['Weiss Embroidery','t2','$1,875','Oct 16 · sample 3d','Shortlisted','warn'],['Stern Promo','t4','$1,690','Oct 19 · sample 5d','New','ac'],['Lakewood Stitch','t5','$2,150','Oct 12 · sample 2d','New','ac']].map(([v,t,p,d,s,k])=>`<div class="card tight"><div class="row">${av(v,30,t,true)}<div style="flex:1;min-width:0"><b class="sm">${v}</b><small class="dim" style="display:block;font-size:11px">${d}</small></div><b class="mono">${p}</b></div><div class="row" style="margin-top:8px;justify-content:space-between">${chip(s,k)}<span class="row">${btn('Message','s')}${btn('Accept','p s')}</span></div></div>`).join('')}`;
  const ph=(kind,body,tabOn,cap)=>`<div><div class="phone ${kind}"><div class="scr">${kind==='android'?'<span class="hole"></span>':'<span class="isl"></span>'}<div class="sb"><span>9:41</span><span>${kind==='android'?'▲ ▼ ▮':'●●● ᯤ ▮'}</span></div><div class="body">${body}</div>${tab(tabOn)}${kind==='android'?'':'<span class="home"></span>'}</div></div><div class="cap">${cap}</div></div>`;
  return `<div class="phones">${ph('ios',feedBody,0,'iPhone · Home feed · tab bar with raised Post')}${ph('ios',profBody,4,'iPhone · Profile · QR in the header')}${ph('android',msgBody,3,'Android · Conversation · predictive back')}${ph('android',rfqBody,0,'Android · RFQ quotes · accept is idempotent')}</div>`; } };

const ORDER = [['Foundation',['design','landing','login','register','onboarding']],['Core network',['profile','company','feed','network','connections','search','messages','notifications']],['Commerce & community',['jobs','marketplace','rfq','opportunities','groups','events']],['Business & admin',['company-admin','analytics','settings','moderation']],['Mobile',['mobile']]];
function nav(){ const el=document.getElementById('vnav'); let i=0; el.innerHTML = ORDER.map(([g,ids])=>`<div class="grp">${g}</div>`+ids.map(id=>{i++;return `<button data-id="${id}" onclick="show('${id}')">${S[id].title}<span class="n">${i}</span></button>`}).join('')).join(''); }
function show(id){ if(!S[id]) id='design'; const s=S[id]; document.getElementById('vtitle').textContent=s.title; document.getElementById('vdesc').textContent=s.desc; document.getElementById('stage').innerHTML=s.render(); document.getElementById('vnote').innerHTML=s.note||''; document.querySelectorAll('#vnav button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id)); if(location.hash!=='#'+id) history.replaceState(null,'','#'+id); window.scrollTo({top:0}); }
function setTheme(t){ document.getElementById('lc').dataset.theme=t; document.getElementById('th-dark').setAttribute('aria-pressed',t==='dark'); document.getElementById('th-light').setAttribute('aria-pressed',t==='light'); try{localStorage.setItem('lc-theme',t)}catch(e){} }
nav();
try{ const t=localStorage.getItem('lc-theme'); if(t==='light'||t==='dark') setTheme(t); }catch(e){}
show((location.hash||'#design').slice(1));
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.addEventListener('click',e=>{ const a=e.target.closest('a[href^="#"]'); if(a&&S[a.getAttribute('href').slice(1)]){ e.preventDefault(); show(a.getAttribute('href').slice(1)); } });
</script>
