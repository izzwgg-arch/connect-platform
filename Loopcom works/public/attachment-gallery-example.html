<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attachment Gallery Example</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Segoe UI, system-ui, sans-serif;
      background: #0b1220;
      color: #fff;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .frame {
      width: min(96vw, 980px);
      height: min(88vh, 720px);
      background: #09090b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,.08);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .top h1 { margin: 0; font-size: 15px; }
    .top p { margin: 4px 0 0; font-size: 12px; color: #a1a1aa; }
    .stage {
      position: relative;
      flex: 1;
      background: #000;
      display: grid;
      place-items: center;
      min-height: 0;
    }
    .media {
      max-width: calc(100% - 120px);
      max-height: calc(100% - 40px);
      border-radius: 8px;
    }
    img.media { object-fit: contain; }
    iframe.media { width: calc(100% - 120px); height: calc(100% - 40px); background: #fff; }
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(0,0,0,.65);
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }
    .arrow:hover { background: rgba(0,0,0,.85); }
    .left { left: 12px; }
    .right { right: 12px; }
    .thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 12px;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    .thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.2);
      overflow: hidden;
      background: #27272a;
      color: #d4d4d8;
      font-size: 10px;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      opacity: .7;
    }
    .thumb.active {
      opacity: 1;
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,.35);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .note {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      max-width: 720px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #14532d;
      color: #bbf7d0;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div>
    <div class="badge">Example · Request attachment gallery popup</div>
    <div class="frame">
      <div class="top">
        <div>
          <h1 id="title">kitchen.jpg</h1>
          <p id="meta">1 of 5 · image/jpeg</p>
        </div>
        <button class="thumb" style="width:auto;padding:8px 12px;opacity:1" onclick="alert('Open in new tab')">Open</button>
      </div>
      <div class="stage">
        <button class="arrow left" onclick="prev()" aria-label="Previous">‹</button>
        <div id="viewer"></div>
        <button class="arrow right" onclick="next()" aria-label="Next">›</button>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <p class="note">Use left/right arrows (or keyboard ← →) to move across PDF / image / audio / video / other files in one local gallery popup.</p>
  </div>

  <script>
    const items = [
      {
        name: 'kitchen.jpg',
        mime: 'image/jpeg',
        kind: 'image',
        src: 'https://images.unsplash.com/photo-1556912173-46c336c7fd55?auto=format&fit=crop&w=1200&q=80',
        thumb: 'https://images.unsplash.com/photo-1556912173-46c336c7fd55?auto=format&fit=crop&w=120&q=60',
      },
      {
        name: 'estimate.pdf',
        mime: 'application/pdf',
        kind: 'pdf',
        src: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
      },
      {
        name: 'site-walk.mp4',
        mime: 'video/mp4',
        kind: 'video',
        src: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
      },
      {
        name: 'voicemail.mp3',
        mime: 'audio/mpeg',
        kind: 'audio',
        src: 'https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3',
      },
      {
        name: 'notes.docx',
        mime: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        kind: 'other',
      },
    ]

    let index = 0

    function render() {
      const item = items[index]
      document.getElementById('title').textContent = item.name
      document.getElementById('meta').textContent = `${index + 1} of ${items.length} · ${item.mime}`
      const viewer = document.getElementById('viewer')
      if (item.kind === 'image') {
        viewer.innerHTML = `<img class="media" src="${item.src}" alt="${item.name}" />`
      } else if (item.kind === 'pdf') {
        viewer.innerHTML = `<iframe class="media" src="${item.src}" title="${item.name}"></iframe>`
      } else if (item.kind === 'video') {
        viewer.innerHTML = `<video class="media" src="${item.src}" controls autoplay></video>`
      } else if (item.kind === 'audio') {
        viewer.innerHTML = `<div style="text-align:center;padding:24px"><div style="font-size:42px;margin-bottom:16px">🎵</div><audio src="${item.src}" controls autoplay style="width:min(420px,70vw)"></audio></div>`
      } else {
        viewer.innerHTML = `<div style="text-align:center;padding:28px;background:#18181b;border-radius:12px;max-width:360px"><div style="font-size:42px;margin-bottom:12px">📎</div><div>${item.name}</div><div style="color:#a1a1aa;font-size:12px;margin-top:8px">Preview not available — use Open</div></div>`
      }

      document.getElementById('thumbs').innerHTML = items.map((entry, i) => {
        const active = i === index ? 'active' : ''
        if (entry.kind === 'image') {
          return `<button class="thumb ${active}" onclick="go(${i})"><img src="${entry.thumb}" alt="" /></button>`
        }
        const label = entry.kind === 'pdf' ? 'PDF' : entry.kind === 'video' ? 'VID' : entry.kind === 'audio' ? 'AUD' : 'FILE'
        return `<button class="thumb ${active}" onclick="go(${i})">${label}</button>`
      }).join('')
    }

    function prev() { index = (index - 1 + items.length) % items.length; render() }
    function next() { index = (index + 1) % items.length; render() }
    function go(i) { index = i; render() }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prev()
      if (e.key === 'ArrowRight') next()
    })

    render()
  </script>
</body>
</html>
