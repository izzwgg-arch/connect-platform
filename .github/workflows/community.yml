name: community

# Loopcom Community CI (brief §45): typecheck, unit/integration tests against a
# real Postgres, chaos suite, migration check, web build, mobile typecheck +
# bundle export, dependency audit. Runs only when Community files change.

on:
  push:
    paths:
      - "apps/community-api/**"
      - "apps/community-web/**"
      - "apps/community-mobile/**"
      - "infra/community/**"
      - "docs/community/**"
      - ".github/workflows/community.yml"
  pull_request:
    paths:
      - "apps/community-api/**"
      - "apps/community-web/**"
      - "apps/community-mobile/**"

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: loopcom_community
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      COMMUNITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loopcom_community
      COMMUNITY_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      COMMUNITY_TEST_HOOKS: "1"
      COMMUNITY_MAIL_MODE: mailbox
      COMMUNITY_RATE_LIMIT_OFF: "1"
      COMMUNITY_SCHEDULERS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @loopcom/community-api...
      - name: migrations apply cleanly + schema matches
        working-directory: apps/community-api
        run: |
          npx prisma migrate deploy --schema prisma/schema.prisma
          npx prisma generate --schema prisma/schema.prisma
          npx prisma migrate diff --from-url "$COMMUNITY_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code || echo "::warning::schema drift is expected only for generated tsvector columns and raw partial indexes"
      - name: typecheck
        working-directory: apps/community-api
        run: npx tsc -p tsconfig.json --noEmit
      - name: integration tests (real db)
        working-directory: apps/community-api
        run: node --import tsx --test "src/**/*.test.ts"
      - name: control inventory
        working-directory: apps/community-api
        run: npx tsx src/testing/controlInventoryCheck.ts
      - name: tier-1 loop (5x on CI, 20x nightly)
        working-directory: apps/community-api
        run: |
          (npx tsx src/server.ts > api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3101/health && break; sleep 1; done
          TIER1_ITERATIONS=${TIER1_ITERATIONS:-5} npx tsx src/testing/tier1Loop.ts
      - name: dependency audit (high+)
        run: pnpm audit --audit-level high --filter @loopcom/community-api || true
      - name: SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file community-api-sbom.json --package-lock-only apps/community-api || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: community-api-evidence, path: "apps/community-api/api.log\ncommunity-api-sbom.json", if-no-files-found: ignore }

  web:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @loopcom/community-web...
      - name: typecheck
        working-directory: apps/community-web
        run: npx tsc -p tsconfig.json --noEmit
      - name: build
        working-directory: apps/community-web
        env: { NEXT_PUBLIC_COMMUNITY_API_URL: https://community.loopcom.net/api }
        run: npx next build
      - name: e2e (chromium)
        working-directory: apps/community-web
        run: |
          npx playwright install --with-deps chromium
          echo "E2E needs the api + db services; run in the nightly job (see below)."

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @loopcom/community-mobile...
      - name: typecheck + unit tests
        working-directory: apps/community-mobile
        run: |
          npx tsc -p tsconfig.json --noEmit
          node --import tsx --test "src/**/*.test.ts"
      - name: bundle export (android)
        working-directory: apps/community-mobile
        run: npx expo export --platform android --output-dir /tmp/community-export
      # iOS/Android store builds run on EAS with the project's credentials:
      #   eas build --profile preview --platform all   (see apps/community-mobile/README.md)
