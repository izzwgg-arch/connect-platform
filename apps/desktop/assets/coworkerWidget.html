<!doctype html>
<!--
  The floating Coworker bubble's renderer.

  ⛔ This window is FRAMELESS + TRANSPARENT + ALWAYS-ON-TOP. It has no Node access
  (contextIsolation on, nodeIntegration off) — it talks to the main process only
  through the tiny preload bridge (window.coworkerWidget). Its whole job is: draw
  the Loopcom mark, tell main when it is pressed and released, and let main move
  the window while it is held.

  ⛔⛔ NO `-webkit-app-region: drag` ANYWHERE IN THIS FILE, EVER. That is what made
  the first build of this bubble dead on arrival: on Windows an app-region drag
  handle is the OS's window caption, and the renderer NEVER receives mousedown or
  mouseup on it — so the click-vs-drag script below never ran, and a click opened
  nothing while dragging worked perfectly. The drag is driven by the main process
  (widgetWindow.ts) reading the real cursor; this file only reports the press.

  ⛔ The mark is the REAL Loopcom logo — the Blue 2B tile Izzy picked, the same
  artwork as the app's own icon — cut to a circle and embedded as a data URI so the
  window needs no second file and no network. Regenerate it with
  scripts/desktop-coworker-bubble-asset.py; do not hand-draw a substitute.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <style>
      /* 58 inside a 64 window: room for the hover lift and the shadow without clipping. */
      :root { --bubble: 58px; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent; overflow: hidden; user-select: none;
        -webkit-user-drag: none;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #bubble {
        position: absolute; inset: 0; margin: auto;
        width: var(--bubble); height: var(--bubble); border-radius: 50%;
        cursor: grab; touch-action: none;
        box-shadow: 0 3px 9px rgba(6, 20, 45, 0.45);
        transition: transform 120ms ease, box-shadow 120ms ease;
      }
      #bubble img {
        display: block; width: 100%; height: 100%; border-radius: 50%;
        pointer-events: none; -webkit-user-drag: none;
      }
      #bubble:hover { transform: scale(1.06); box-shadow: 0 4px 12px rgba(6,20,45,0.55); }
      #bubble.pressed { cursor: grabbing; transform: scale(0.96); }
      /* Unread / working indicator — a small dot the main process can toggle. */
      #badge {
        position: absolute; top: 2px; right: 2px; width: 14px; height: 14px;
        border-radius: 50%; background: #ff5c5c; border: 2px solid #ffffff;
        display: none;
      }
      #badge.show { display: block; }
      #badge.working { background: #f0b655; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>

    <script>
      (function () {
        var bubble = document.getElementById("bubble");
        var badge = document.getElementById("badge");
        var api = window.coworkerWidget; // exposed by preload; absent in a bare browser
        if (!api) console.error("coworker widget: preload bridge missing — clicks cannot reach main");

        // The renderer reports ONLY press / held / release. Main reads the real
        // cursor position itself, decides click-vs-drag (widgetGeometry.isClick),
        // moves the window, and opens the chat on a click.
        var pressed = false, raf = 0;
        bubble.addEventListener("pointerdown", function (e) {
          if (e.button !== 0) return;
          pressed = true;
          bubble.classList.add("pressed");
          // Keep receiving pointer events even when the cursor outruns the window.
          try { bubble.setPointerCapture(e.pointerId); } catch (_) {}
          if (api && api.dragStart) api.dragStart();
        });
        bubble.addEventListener("pointermove", function () {
          if (!pressed || raf) return;
          raf = requestAnimationFrame(function () {
            raf = 0;
            if (pressed && api && api.dragMove) api.dragMove();
          });
        });
        function release() {
          if (!pressed) return;
          pressed = false;
          bubble.classList.remove("pressed");
          if (raf) { cancelAnimationFrame(raf); raf = 0; }
          if (api && api.dragEnd) api.dragEnd();
        }
        bubble.addEventListener("pointerup", release);
        bubble.addEventListener("pointercancel", release);
        bubble.addEventListener("lostpointercapture", release);
        window.addEventListener("blur", release);

        // Main pushes badge state: "none" | "unread" | "working".
        if (api && api.onBadge) {
          api.onBadge(function (state) {
            badge.className = "";
            if (state === "unread") badge.className = "show";
            else if (state === "working") badge.className = "show working";
          });
        }
      })();
    </script>
  </body>
</html>
