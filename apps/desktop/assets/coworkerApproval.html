<!doctype html>
<!--
  The Coworker's approval prompt. Shown by the main process (approvalWindow.ts)
  for ONE tool call whose policy verdict was "ask". The page reads the request over
  the preload bridge (window.coworkerApproval.get) and answers with exactly one of
  allow / deny for that call id. Enter = Allow, Esc = Don't allow.
  No Node, no network: contextIsolation on, sandbox on, CSP below.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
    <title>Loopcom Coworker — approval</title>
    <style>
      :root { color-scheme: dark; --bg:#0f1a2c; --panel:#16233a; --border:#23344f; --text:#e6edf7; --dim:#8b9ab2; --accent:#22a8ff; --danger:#f06060; --warn:#f0b655; }
      html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; user-select:none; }
      .wrap { display:flex; flex-direction:column; height:100%; box-sizing:border-box; padding:14px 16px 12px; }
      .head { display:flex; align-items:center; gap:10px; -webkit-app-region: drag; }
      .mark { width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#1e5cff,#22a8ff); display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; }
      .head b { font-size:14px; }
      .head small { color:var(--dim); margin-left:auto; }
      h1 { font-size:16px; margin:12px 0 6px; font-weight:600; }
      .what { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; white-space:pre-wrap; word-break:break-word; max-height:150px; overflow:auto; font-family: Consolas, "Cascadia Mono", monospace; font-size:12px; }
      .why { color:var(--dim); margin:8px 0 0; }
      .pills { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
      .pill { font-size:10px; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:999px; border:1px solid var(--border); color:var(--dim); }
      .pill.risk-HIGH, .pill.risk-DESTRUCTIVE { color:var(--danger); border-color:var(--danger); }
      .pill.risk-MEDIUM { color:var(--warn); border-color:var(--warn); }
      .actions { margin-top:auto; display:flex; gap:8px; justify-content:flex-end; padding-top:10px; }
      /* ⛔ Never inside a drag region: a button under -webkit-app-region: drag never receives its click on Windows (the dead-bubble lesson). */
      button { -webkit-app-region: no-drag; border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:8px; padding:8px 14px; font: inherit; cursor:pointer; }
      button.primary { background:var(--accent); color:#04121d; border-color:transparent; font-weight:600; }
      button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      .note { color:var(--dim); font-size:11px; margin-top:6px; }
      .missing { color:var(--danger); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head"><span class="mark">∞</span><b>Loopcom Coworker</b><small id="tool"></small></div>
      <h1 id="title">Let the Coworker do this?</h1>
      <div class="what" id="what">…</div>
      <p class="why" id="why"></p>
      <div class="pills" id="pills"></div>
      <div class="actions">
        <button id="deny">Don't allow</button>
        <button id="allow" class="primary" autofocus>Allow</button>
      </div>
      <div class="note">Enter = Allow · Esc = Don't allow · This asks about one action only; nothing else runs from this answer.</div>
    </div>
    <script>
      (function () {
        var api = window.coworkerApproval;
        var callId = null;
        function esc(s) { return String(s == null ? "" : s); }
        function answer(approved) {
          if (!api || !callId) return;
          document.getElementById("allow").disabled = true; document.getElementById("deny").disabled = true;
          api.answer({ callId: callId, approved: !!approved });
        }
        if (!api) { document.getElementById("what").innerHTML = '<span class="missing">Bridge missing — nothing can be approved from here.</span>'; return; }
        api.get().then(function (req) {
          if (!req) { document.getElementById("what").textContent = "This request is no longer waiting."; return; }
          callId = req.callId;
          document.getElementById("title").textContent = esc(req.title);
          document.getElementById("what").textContent = esc(req.what);
          document.getElementById("why").textContent = esc(req.why);
          document.getElementById("tool").textContent = esc(req.tool);
          var pills = document.getElementById("pills");
          var r = document.createElement("span"); r.className = "pill risk-" + esc(req.risk); r.textContent = "risk: " + esc(req.risk).toLowerCase().replace("_", " "); pills.appendChild(r);
          (req.domains || []).forEach(function (d) { var p = document.createElement("span"); p.className = "pill"; p.textContent = d; pills.appendChild(p); });
          document.getElementById("allow").focus();
        }).catch(function () { document.getElementById("what").textContent = "Could not read the request."; });
        document.getElementById("allow").addEventListener("click", function () { answer(true); });
        document.getElementById("deny").addEventListener("click", function () { answer(false); });
        window.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); answer(true); }
          if (e.key === "Escape") { e.preventDefault(); answer(false); }
        });
      })();
    </script>
  </body>
</html>
