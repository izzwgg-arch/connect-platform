// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // Expo SDK 54 / React Native 0.81.5 toolchain (2026-07-31). The SDK
        // 51->54 upgrade (ced70d7b) updated the app and iOS but left these at
        // SDK 51 levels, so the FIRST Android build attempted from this branch
        // failed inside Expo's own Gradle plugin with "Unresolved reference
        // 'extensions'/'extra'" — that plugin is compiled by Gradle's EMBEDDED
        // Kotlin, and Gradle 8.8 embeds Kotlin 1.9 while expo-modules-core 3.x
        // needs 2.x. iOS never hit it because it builds on EAS in the cloud.
        // Required versions are RN's own: node_modules/.../react-native/gradle/
        // libs.versions.toml -> agp = "8.11.0", kotlin = "2.1.20".
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '36.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '36')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.1.20'

        // RN 0.81.5 declares 27.1.12297006 (react-native/gradle/libs.versions.toml).
        // Leaving it at 26.1 with the SDK 54 toolchain made expo-av's C++ build
        // loop forever in CMake ("manifest 'build.ninja' still dirty after 100
        // tries"), which is what blocked the first SDK 54 Android build.
        ndkVersion = "27.1.12297006"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

// NOTE (2026-07-31): CMake version is NOT pinned here on purpose. Setting it
// from a `plugins.withId` hook fails with "It is too late to set version" —
// AGP has already read the extension by then. Use `cmake.dir` in
// local.properties instead (AGP's supported override); AGP otherwise defaults
// to 3.22.1, which loops forever on expo-av's C++ under the SDK 54 toolchain
// ("manifest 'build.ninja' still dirty after 100 tries" — that loop was in fact
// hiding a Windows MAX_PATH error, see below).

// ── Windows MAX_PATH workaround for native (C++) modules ────────────────────
// pnpm stores packages under names like
//   node_modules/.pnpm/expo-av@16.0.8_expo@54.0.36_<32-char-hash>/node_modules/expo-av
// and AGP then nests its prefab output under
//   .cxx/RelWithDebInfo/<hash>/prefab/<abi>/prefab/lib/<triple>/cmake/ReactAndroid/
// The result is 263 characters — past Windows' 260 limit — so every C++ module
// fails with:
//   ninja: error: rebuilding 'build.ninja': Stat(...): Filename longer than 260 characters
// (CMake 3.22.1 never reported this; it just regenerated forever. CMake 3.31.6
// surfaces it.) This is NOT caused by the repo's location: a checkout anywhere
// with a normal-length path still exceeds the limit. It only started biting
// with SDK 54, the first version whose modules actually compile C++ here.
//
// Redirect each native module's build output to a short path. Windows only —
// macOS/Linux/EAS have no such limit and must keep the default location.
// Done here rather than by patching node_modules so it survives `pnpm install`.
// The fix lives in pnpm patches (patches/expo-av@*.patch,
// patches/expo-modules-core@*.patch, patches/react-native-screens@*.patch), NOT
// here. It CANNOT be done from this file: AGP reads buildStagingDirectory during
// evaluation, so both a per-project afterEvaluate ("Cannot run
// Project.afterEvaluate when the project is already evaluated") and a
// gradle.projectsEvaluated hook ("It is too late to set buildStagingDirectory")
// fail. Both were tried on 2026-07-31 — please don't try again.

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
