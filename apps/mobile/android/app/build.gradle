apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/** Hermes is invoked as `cmd /c <path> â€¦`; paths with spaces break. Use 8.3 short path on Windows. */
static String windowsShortExePath(File exeOrBinary) {
    if (!org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        return exeOrBinary.absolutePath
    }
    File target = exeOrBinary
    if (!target.exists()) {
        def withExe = new File(exeOrBinary.parentFile, exeOrBinary.name + ".exe")
        if (withExe.exists()) target = withExe
    }
    if (!target.exists()) return exeOrBinary.absolutePath
    try {
        def proc = ["cmd", "/c", "for %I in (\"" + target.absolutePath + "\") do @echo %~sI"].execute()
        proc.waitFor()
        def out = proc.in.text.trim().readLines().find { it.length() > 0 && !it.startsWith("@") }
        return (out != null && out.length() > 0) ? out : target.absolutePath
    } catch (Throwable ignored) {
        return target.absolutePath
    }
}

static def versionToNumber(major, minor, patch) {
  return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
  def version = providers.exec {
    workingDir(projectDir)
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return versionToNumber(
      major,
      minor,
      patch
  )
}
def rnVersion = getRNVersion()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    def reactNativeHome = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    reactNativeDir = reactNativeHome
    def hermesFile = new File(reactNativeHome, "sdks/hermesc/win64-bin/hermesc")
    hermesCommand = org.gradle.internal.os.OperatingSystem.current().isWindows()
        ? windowsShortExePath(hermesFile)
        : (reactNativeHome.absolutePath + "/sdks/hermesc/%OS-BIN%/hermesc")
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    // Force an ABSOLUTE --entry-file (2026-07-31). The RN plugin passes
    // `--entry-file index.js` relative to `root`, and in this monorepo Expo CLI
    // resolves that against the REPO root instead of apps/mobile, failing with
    //   Error: Unable to resolve module ./index.js from C:\dev\projects\Connect 2/.
    // even though the working directory it launches in is already apps/mobile.
    // The same command with an absolute entry bundles fine (1406 modules), so
    // append it here — Expo's parser takes the last occurrence of a flag.
    extraPackagerArgs = ["--entry-file", file("../../index.js").absolutePath]

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // EXPLICIT (2026-07-31): in this monorepo the release bundle step resolved the
    // project root as the REPO root and failed with
    //   Error: Unable to resolve module ./index.js from C:\dev\projects\Connect 2/.
    // apps/mobile/index.js exists and is package.json "main"; the problem is that
    // Expo CLI was handed the wrong root, so it never loaded apps/mobile's
    // metro.config.js (which sets projectRoot/watchFolders for exactly this
    // layout). Pinning root here keeps the bundler inside apps/mobile.
    // NB: this file lives in android/app, so "../.." is apps/mobile (where
    // package.json and index.js are). "../" would be android/ — which fails with
    // "The expected package.json path: .../android/package.json does not exist".
    root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    if (rnVersion >= versionToNumber(0, 75, 0)) {
        /* Autolinking */
        autolinkLibrariesWithApp()
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.connectcommunications.mobile'
    defaultConfig {
        applicationId 'com.connectcommunications.mobile'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Ship script sets SHIP_VERSION_CODE / SHIP_BUILD_ID so adb install -r always picks up new APKs.
        // Play builds (scripts/android-play-bundle.ps1) set PLAY_VERSION_CODE / PLAY_VERSION_NAME instead:
        // small monotonic codes (100, 101, ...) so the Play track never inherits the timestamp scheme,
        // which would exhaust the 2.1e9 versionCode ceiling around 2036.
        def playVc = System.getenv("PLAY_VERSION_CODE")
        def playVn = System.getenv("PLAY_VERSION_NAME")
        def shipVc = System.getenv("SHIP_VERSION_CODE")
        def shipId = System.getenv("SHIP_BUILD_ID")
        if (playVc != null && !playVc.isEmpty()) {
            versionCode playVc.toInteger()
            versionName ((playVn != null && !playVn.isEmpty()) ? playVn : "1.0.0")
        } else {
            versionCode ((shipVc != null && !shipVc.isEmpty()) ? shipVc.toInteger() : 1)
            versionName ((shipId != null && !shipId.isEmpty()) ? ("1.0.0+" + shipId) : "1.0.0")
        }
    }
    // Play Store signing: scripts/android-play-bundle.ps1 sets CONNECT_PLAY_SIGNING=1 and the
    // credentials live in the gitignored android/keystore.properties. Sideload builds (the
    // download-page APKs) DELIBERATELY keep the historical debug signing — every installed
    // customer APK carries that signature, and switching it would break `adb install -r` /
    // in-place updates for the whole fleet. Only the Play AAB uses the upload key.
    def playSigningRequested = System.getenv("CONNECT_PLAY_SIGNING") == "1"
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (playSigningRequested) {
        if (!keystorePropsFile.exists()) {
            throw new GradleException("CONNECT_PLAY_SIGNING=1 but android/keystore.properties is missing — refusing to fall back to debug signing for a Play build.")
        }
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (playSigningRequested) {
            playUpload {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Debug-signed on purpose for sideload builds (see the note above);
            // Play builds must go through scripts/android-play-bundle.ps1.
            signingConfig (playSigningRequested ? signingConfigs.playUpload : signingConfigs.debug)
            // ⛔ PACKAGE ONLY THE ABIs THIS BUILD ASKED FOR.
            // `reactNativeArchitectures` controls only what RN and the
            // build-from-source modules COMPILE; it does nothing about the
            // prebuilt .so files inside AAR dependencies (libjingle, hermes,
            // ML Kit's barhopper, fresco...). Without this filter those ship
            // for EVERY architecture they were published with, so the
            // 2026-08-23 fleet APK carried 30.9 MB of x86 and 30.7 MB of
            // x86_64 — 43% of the download — for emulator CPUs no handset can
            // run, plus a 17.9 MB armeabi-v7a slice that was MISSING
            // libexpo-modules-core/libexpo-av/librnscreens (they build from
            // source, arm64 only) and so could not have launched anyway.
            // ⛔ Derive it from the property rather than hardcoding: the
            // sideload APK takes arm64-v8a from gradle.properties, while
            // scripts/android-play-bundle.ps1 passes
            // -PreactNativeArchitectures=armeabi-v7a,arm64-v8a and must keep
            // its 32-bit coverage. Hardcoding here would silently narrow the
            // Play AAB.
            ndk {
                abiFilters.clear()
                abiFilters.addAll(
                    (findProperty('reactNativeArchitectures') ?: 'arm64-v8a')
                        .toString().split(',').collect { it.trim() }.findAll { it }
                )
            }
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Required for IncomingCallFirebaseService.java (our custom native FCM handler)
    // firebase-messaging is a transitive dep of expo-notifications but not exposed
    // to the app module compile classpath without this explicit declaration.
    implementation("com.google.firebase:firebase-messaging")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

if (rnVersion < versionToNumber(0, 75, 0)) {
    apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle");
    applyNativeModulesAppBuildGradle(project)
}

apply plugin: 'com.google.gms.google-services'

