# ── AI Support Agent ("Shammes") — docs/ai-support-agent/PLAN.md ──────────────
# Standalone override so the shared docker-compose.app.yml stays untouched.
# Usage (on loopcom, /opt/connectcomms/app):
#   docker compose -f docker-compose.app.yml -f docker-compose.agent.yml up -d --build agent
# The agent boots DISABLED (AGENT_ENABLED unset = kill switch engaged). No PBX
# write capability exists in this service; PBX_ALLOW_CONFIG_MUTATIONS is never set.
services:
  agent:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    env_file:
      - /opt/connectcomms/env/.env.platform
    environment:
      TZ: ${TZ:-America/New_York}
      AGENT_PORT: 3920
      AGENT_ENABLED: ${AGENT_ENABLED:-0}
      AGENT_KILL_SWITCH: ${AGENT_KILL_SWITCH:-0}
      AGENT_AUDIT_DIR: /var/log/connect-agent
      AGENT_OWNER_EMAIL: ${AGENT_OWNER_EMAIL:-izzywkg@gmail.com}
      AGENT_TEAM_EMAILS: ${AGENT_TEAM_EMAILS:-}
      AGENT_SMTP_HOST: ${AGENT_SMTP_HOST:-}
      AGENT_SMTP_PORT: ${AGENT_SMTP_PORT:-587}
      AGENT_SMTP_USER: ${AGENT_SMTP_USER:-}
      AGENT_SMTP_PASS: ${AGENT_SMTP_PASS:-}
      AGENT_SMTP_FROM: ${AGENT_SMTP_FROM:-Connect Agent <agent@connectcomunications.com>}
      AGENT_SELFTEST_SECRET: ${AGENT_SELFTEST_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EVERETT_API_KEY: ${EVERETT_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    ports:
      - "127.0.0.1:3920:3920"
    volumes:
      - agent-audit:/var/log/connect-agent
    networks:
      - default
      - infra_default

volumes:
  # Append-only audit JSONL (tamper-evidence copy of the DB audit trail).
  agent-audit:
    driver: local
