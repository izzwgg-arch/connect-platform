# Loopcom website — nginx front end.
# Installed at /etc/nginx/sites-available/loopcom and symlinked into sites-enabled.
#
# Canonical host is https://www.loopcom.net. Everything else redirects there:
#   http://loopcom.net      -> https://www.loopcom.net
#   http://www.loopcom.net  -> https://www.loopcom.net
#   https://loopcom.net     -> https://www.loopcom.net
# One canonical host, one redirect hop, no chains.

# ⛔ Real client IP: nginx APPENDS the true peer to X-Forwarded-For, so the app
# reads the LAST entry. Do not switch this to $http_x_forwarded_for.

map $sent_http_content_type $loopcom_cache {
    default                         "no-cache";
    "text/css; charset=utf-8"       "public, max-age=604800";
    "text/javascript; charset=utf-8" "public, max-age=604800";
    "image/png"                     "public, max-age=2592000";
    "image/x-icon"                  "public, max-age=2592000";
}

limit_req_zone $binary_remote_addr zone=loopcom_forms:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name loopcom.net www.loopcom.net;

    # Let certbot answer challenges over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / { return 301 https://www.loopcom.net$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name loopcom.net;

    ssl_certificate     /etc/letsencrypt/live/www.loopcom.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.loopcom.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.loopcom.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.loopcom.net;

    ssl_certificate     /etc/letsencrypt/live/www.loopcom.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.loopcom.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- security headers -------------------------------------------------
    # ⛔ HSTS starts SHORT on purpose. Browsers cache it, so a long max-age
    # outlives a rollback. Raise it only once the site has been stable.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ⛔ 'unsafe-inline' appears in style-src ONLY, because the pages use inline
    # style attributes for layout. script-src stays strict: no inline script,
    # no eval, which is the directive that actually stops XSS. No user-supplied
    # HTML is ever rendered on this site.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;

    # ---- compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml application/manifest+json
               image/svg+xml;

    server_tokens off;
    client_max_body_size 128k;

    # ---- the form + chat endpoints ---------------------------------------
    location ~ ^/api/(quote|chat)$ {
        limit_req zone=loopcom_forms burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # ⛔ Nothing else under /api/ is public.
    location /api/ { return 404; }

    # ---- static site ------------------------------------------------------
    root /var/www/loopcom/dist;
    index index.html;

    # never serve dotfiles or backups
    location ~ /\.          { deny all; }
    location ~ ~$           { deny all; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control $loopcom_cache always;
        # headers set at server level are dropped in a block that adds its own,
        # so every one of them is repeated here deliberately.
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
