# Rate-limit refusal for /api/ — must be JSON.
#
# ⛔ A form POST expects JSON. nginx's default error pages are HTML, so a
# browser that trips the limiter gets markup where the script expects an
# object, and the visitor sees a generic "something went wrong" instead of
# being told to wait a minute. Keep this response JSON.
#
# ⛔ Do not inline this block into the site config over SSH with a heredoc —
# the quotes and braces get eaten and nginx silently serves `ok:false`.
# Edit this file and copy it.

default_type application/json;
add_header Retry-After 60 always;
add_header Cache-Control "no-store" always;
return 429 '{"ok":false,"message":"Too many requests from this connection. Please wait a minute and try again, or call us on (845) 723-1213."}';
