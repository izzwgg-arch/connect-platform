# Temporary HTTP-only config used before TLS exists.
# Replaced by nginx-loopcom.conf once certbot has issued a certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name loopcom.net www.loopcom.net _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    server_tokens off;
    client_max_body_size 128k;
    gzip on; gzip_vary on; gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

    location ~ ^/api/(quote|chat)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ { return 404; }

    root /var/www/loopcom/dist;
    index index.html;
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ $uri/index.html =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
