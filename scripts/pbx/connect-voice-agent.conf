; ============================================================================
; [connect-voice-agent] — conversational order-taking AI on a phone line.
;
; A tenant's DID Gotos here. The flow:
;   1. Answer + a beat of Progress so early audio is not clipped.
;   2. Mint a session UUID and announce it to Connect telephony over a
;      NON-BLOCKING AMI UserEvent (ConnectVoiceAgent) — same lane as
;      ConnectWake. Telephony maps UUID → this call moments before the
;      AudioSocket TCP connection lands.
;   3. AudioSocket() streams the call audio to Connect telephony
;      (VOICE_AGENT_HOST:VOICE_AGENT_PORT). The AI runs there; when it returns,
;      the app has already set connect/va/<uuid> if the caller wants a person.
;   4. Route on that flag: transfer → the tenant's human fallback; else hang up
;      (the AI said its goodbye before returning).
;
; ⛔ FALLBACK IS THE DEFAULT BRANCH, NEVER HANGUP. If ANYTHING upstream fails —
;    telephony down, AudioSocket refused, the AI errored — AudioSocket returns
;    immediately and we route to the human fallback. The AI is additive in
;    front of the existing flow; its worst failure is the caller reaching
;    exactly what they reach today.
;
; Per-tenant knobs, all in AstDB (no dialplan edit to onboard a tenant):
;   connect/va/<slug>/enabled        "1" to send this tenant's DID here
;   connect/va/<slug>/fallback_dest  dialplan target "context,exten,pri" for a
;                                    person (a queue, a ring group, an ext).
; Global (set once at install): connect/va/host, connect/va/port.
; ============================================================================
[connect-voice-agent]
exten => s,1,NoOp(Connect voice agent tenant=${TENANT_SLUG} pbxtenant=${PBX_TENANT_ID} did=${VA_DID})
 same =>   n,Set(VA_HOST=${DB(connect/va/host)})
 same =>   n,Set(VA_PORT=${DB(connect/va/port)})
 same =>   n,Set(VA_FALLBACK=${DB(connect/va/${TENANT_SLUG}/fallback_dest)})
 ; No host configured → straight to the human fallback (fail toward a person).
 same =>   n,GotoIf($["${VA_HOST}" = ""]?fallback)
 same =>   n,Answer()
 same =>   n,Progress()
 same =>   n,Wait(0.3)
 same =>   n,Set(VA_UUID=${UUID()})
 same =>   n,Set(DB(connect/va/${VA_UUID}/pending)=1)
 ; Announce the session to Connect telephony (non-blocking, like ConnectWake).
 same =>   n,UserEvent(ConnectVoiceAgent,UUID: ${VA_UUID},Tenant: ${PBX_TENANT_ID},Did: ${VA_DID},CallerNum: ${CALLERID(num)})
 ; Give the announcement a beat to reach telephony before the TCP connect.
 same =>   n,Wait(0.2)
 ; Stream the call to the AI. Returns when the AI ends or on any failure.
 same =>   n,AudioSocket(${VA_UUID},${VA_HOST}:${VA_PORT})
 same =>   n,Set(VA_RESULT=${DB(connect/va/${VA_UUID})})
 same =>   n,Set(DB_DELETE(connect/va/${VA_UUID}))
 same =>   n,Set(DB_DELETE(connect/va/${VA_UUID}/pending))
 ; transfer flag → a person; otherwise the AI finished and said goodbye.
 same =>   n,GotoIf($["${VA_RESULT}" = "transfer"]?fallback)
 same =>   n,Hangup()
 same =>   n(fallback),NoOp(Voice agent → human fallback dest=${VA_FALLBACK})
 same =>   n,GotoIf($["${VA_FALLBACK}" = ""]?nodest)
 same =>   n,Goto(${VA_FALLBACK})
 same =>   n(nodest),NoOp(No voice-agent fallback configured — answering to voicemail-safe hangup)
 same =>   n,Answer()
 same =>   n,Playback(vm-goodbye)
 same =>   n,Hangup()
