;
; Connect — supermarket pay-by-phone (the Gesheft payment line).
;
; The dialplan holds NO business logic. Every decision — whether a PIN is
; needed, what to say, what to collect, whether to charge — is made by the api
; door, which answers with one ready-to-play string and one word. That is
; deliberate: the money rules are tested on the server, and the PBX can never
; drift from them.
;
; ⛔ Stored cards only. There is no state here that collects card digits, and
;    there must never be one — the PBX is not, and must not become, a place
;    card numbers travel through.
; ⛔ The shared secret is READ FROM AstDB at call time, never baked into this
;    file (the wake-config pattern), so rotating it needs no dialplan edit.
; ⛔ Every exit lands on a person. A failed CURL, an unparseable answer, or a
;    runaway loop all end at PAY_HUMAN_* — never a hang-up on a caller who was
;    trying to pay, and never a silent loop.
;
; Caller sets, before Goto()ing here:
;   PAY_TENANT     Connect tenant id (the register account this line pays)
;   PAY_HUMAN_CTX  context to hand off to when a person is needed
;   PAY_HUMAN_EXT  extension in that context
;
[connect-supermarket-pay]
exten => s,1,NoOp(Connect pay-by-phone: tenant=${PAY_TENANT} cid=${CALLERID(num)})
 same => n,Answer()
 same => n,Set(PAY_CALL=${UNIQUEID})
 same => n,Set(PAY_CID=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(PAY_SECRET=${DB(connect/system/wake_api_secret)})
 same => n,Set(PAY_URL=${DB(connect/system/pay_api_url)})
 same => n,ExecIf($["${PAY_URL}" = ""]?Set(PAY_URL=https://app.loopcom.net/api/internal/supermarket/pay-ivr/step))
 same => n,Set(PAY_DIGITS=)
 same => n,Set(PAY_LOOPS=0)
 ; the api is the whole conversation: post what the caller pressed, play what
 ; it answers, collect what it asks for, repeat.
 same => n(step),Set(PAY_LOOPS=$[${PAY_LOOPS} + 1])
 same => n,GotoIf($[${PAY_LOOPS} > 25]?bail)
 same => n,Set(CURLOPT(conntimeout)=6)
 same => n,Set(CURLOPT(httptimeout)=25)
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/json)
 same => n,Set(CURLOPT(httpheader)=x-cdr-secret: ${PAY_SECRET})
 same => n,Set(PAY_BODY={"tenantId":"${PAY_TENANT}","callId":"${PAY_CALL}","callerNumber":"${PAY_CID}","digits":"${PAY_DIGITS}"})
 same => n,Set(PAY_RESP=${CURL(${PAY_URL},${PAY_BODY})})
 same => n,GotoIf($["${PAY_RESP}" = ""]?bail)
 same => n,Set(PAY_PLAY=${JSON_DECODE(PAY_RESP,playback)})
 same => n,Set(PAY_ACTION=${JSON_DECODE(PAY_RESP,action)})
 same => n,Set(PAY_MAX=${JSON_DECODE(PAY_RESP,maxDigits)})
 same => n,GotoIf($["${PAY_ACTION}" = ""]?bail)
 same => n,GotoIf($["${PAY_ACTION}" = "transfer"]?human)
 same => n,GotoIf($["${PAY_ACTION}" = "gather"]?gather)
 ; continue / hangup: say the last thing and go
 same => n,ExecIf($["${PAY_PLAY}" != ""]?Playback(${PAY_PLAY}))
 same => n,GotoIf($["${PAY_ACTION}" = "hangup"]?bye)
 same => n,Set(PAY_DIGITS=)
 same => n,Goto(step)
 ;
 ; Collect. The prompt plays as part of Read() so a caller who knows the menu
 ; can key straight through it. * is data here (it is the decimal point in an
 ; amount), # ends entry.
 same => n(gather),Set(PAY_DIGITS=)
 same => n,Read(PAY_DIGITS,${PAY_PLAY},${PAY_MAX},,1,10)
 same => n,Goto(step)
 ;
 same => n(human),ExecIf($["${PAY_PLAY}" != ""]?Playback(${PAY_PLAY}))
 same => n,Goto(bail)
 ;
 same => n(bye),Hangup()
 ;
 ; Every failure path ends with a person, never a dead end.
 same => n(bail),NoOp(Connect pay-by-phone: handing to a person)
 same => n,GotoIf($["${PAY_HUMAN_CTX}" = ""]?bye)
 same => n,Goto(${PAY_HUMAN_CTX},${PAY_HUMAN_EXT},1)

; Hangup handler: the api is told the call ended so the session row closes and
; a half-finished payment can never be resumed by the next caller on that id.
exten => h,1,Set(CURLOPT(httptimeout)=6)
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/json)
 same => n,Set(CURLOPT(httpheader)=x-cdr-secret: ${PAY_SECRET})
 same => n,Set(PAY_BYE=${CURL(${PAY_URL},{"tenantId":"${PAY_TENANT}","callId":"${PAY_CALL}","callerNumber":"${PAY_CID}","hangup":true})})
 same => n,NoOp(pay-by-phone session closed)

; ── Gesheft (PBX tenant 8) entry point ───────────────────────────────────────
; A Custom Application in the panel points at this, so the wiring survives a
; tenant regeneration — a raw edit to the generated tenant dialplan would be
; silently reverted the next time anyone pressed Apply Changes.
;
; "Someone who can help" is the SAME destination the menu's option 1 uses
; (the Phone Orders time condition), so a caller who cannot be served by the
; automated line lands exactly where they would have anyway.
[connect-pay-gesheft]
exten => s,1,Set(PAY_TENANT=cmnlgnumu0001p9g6xyl1pbdd)
 same => n,Set(PAY_HUMAN_CTX=T8_app-time-condition)
 same => n,Set(PAY_HUMAN_EXT=TC-4)
 same => n,Goto(connect-supermarket-pay,s,1)
