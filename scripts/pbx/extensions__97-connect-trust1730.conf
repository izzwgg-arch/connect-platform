; Connect — Trust Bookkeepings (T18) dial code 1730 (2026-09-08, Izzy).
; Outbound route 179 "Trust 1730" matches _1730<number> (14/15 digits) and forces
; CID 718-437-1730 over trunk 0001. Yealink handsets send the digits typed so far
; after a 3 s pause (interdigit_long_timer = 3), so a person who dials the code,
; pauses, then dials the number reaches the PBX with "1730" ALONE and nothing matched.
; This exten catches the bare code: answer, second dial tone, collect the number,
; then re-enter the tenant's outbound flow with the code prepended, so the SAME
; route 179 (same CID, same trunk, same patterns) carries the call.
; Tenant 18 only. Dialing all 14 digits in one go never reaches this and works as before.

[T18_cos-all](+)
exten => 1730,1,NoOp(Connect: Trust dial code 1730 dialed alone - second dial tone)
 same => n,Answer()
 same => n,Goto(connect-trust1730-collect,s,1)

[connect-trust1730-collect]
exten => s,1,NoOp(Connect: collecting the number after code 1730)
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Set(TIMEOUT(response)=12)
 same => n,Playtones(dial)
 same => n,WaitExten(12)
 same => n,StopPlaytones()
 same => n,Hangup()
exten => _NXXNXXXXXX,1,StopPlaytones()
 same => n,NoOp(Connect: code 1730 + ${EXTEN} -> route Trust 1730)
 same => n,Goto(T18_cos-all,1730${EXTEN},1)
exten => _1NXXNXXXXXX,1,StopPlaytones()
 same => n,NoOp(Connect: code 1730 + ${EXTEN} -> route Trust 1730)
 same => n,Goto(T18_cos-all,1730${EXTEN},1)
exten => _NXXXXXX,1,StopPlaytones()
 same => n,NoOp(Connect: code 1730 + ${EXTEN} -> route Trust 1730)
 same => n,Goto(T18_cos-all,1730${EXTEN},1)
exten => _011.,1,StopPlaytones()
 same => n,NoOp(Connect: code 1730 + ${EXTEN} -> route Trust 1730)
 same => n,Goto(T18_cos-all,1730${EXTEN},1)
exten => t,1,StopPlaytones()
 same => n,Hangup()
exten => i,1,StopPlaytones()
 same => n,Playback(invalid)
 same => n,Hangup()
